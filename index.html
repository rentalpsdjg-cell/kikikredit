<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kiki Kredit Solution - GitHub Deploy Engine</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <style>
    /* ============================================================
       1. ANTARMUKA LAYAR KASIR HP (DARK MODE - MODERN & BERSIH)
       ============================================================ */
    body { 
      background: #0f172a; 
      color: #f1f5f9; 
      font-family: 'Segoe UI', sans-serif; 
      padding: 12px; 
    }
    
    .card { 
      background: #1e293b; 
      border-radius: 12px; 
      border: 1px solid #334155; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.2); 
      margin-bottom: 15px; 
    }
    
    .stats-card { 
      background: linear-gradient(135deg, #0284c7, #0369a1); 
      color: white; 
      padding: 20px; 
      border-radius: 12px; 
    }
    
    .form-control-custom {
      background: #0f172a !important;
      color: #ffffff !important;
      border-radius: 8px;
      font-size: 15px;
      border: 2px solid #475569;
      padding: 10px 12px;
      height: auto;
      margin-bottom: 10px;
      font-weight: bold;
    }
    .form-control-custom:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }
    
    .badge-mingguan { background: #ff9800; color: white; }
    .btn-aksi { min-width: 65px; font-size: 12px !important; padding: 8px 4px !important; font-weight: bold; }
    
    #loadingOverlay { 
      display: none; 
      position: fixed; 
      top:0; left:0; width:100%; height:100%; 
      background: rgba(15, 23, 42, 0.9); 
      z-index:9999; 
      justify-content: center; 
      align-items: center; 
      flex-direction: column; 
    }

    /* MATIKAN PREVIEW STRUK DI LAYAR HP AGAR RESPONSIVITASNYA FOKUS */
    #strukCetak { display: none !important; }
 
    /* ============================================================
       2. ARSITEKTUR STRUK CETAK FISIK (MURNI TEKS TEBAL VERTIKAL)
       ============================================================ */
    @media print {
      body * { display: none !important; }
      html, body { height: auto; overflow: visible; background: #fff; }
      
      #strukCetak, #strukCetak * { display: block !important; }
      @page { size: auto; margin: 0mm; }
      
      .nota-container {
        width: 100%;
        padding: 5mm 2mm 5mm 2mm;
        font-family: 'Courier New', Courier, monospace;
        font-size: 21px !important; 
        font-weight: 900 !important; 
        color: #000 !important;
        line-height: 1.2;
        background: transparent !important;
      }
      
      .nota-header { 
        text-align: center; 
        margin-bottom: 8px; 
      }
      .nota-title { 
        font-size: 24px !important; 
        font-weight: 900 !important; 
        text-transform: uppercase; 
        line-height: 1.1;
      }
      
      .nota-garis { 
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        margin: 4px 0; 
        font-size: 21px !important;
        font-weight: 900 !important;
      }
      .nota-garis::after {
        content: "----------------------"; 
        display: block;
      }
      
      .nota-item-row { 
        margin-bottom: 5px; 
        word-break: break-all;
      }
      .nota-label { 
        font-weight: 900 !important; 
        text-transform: uppercase; 
        display: inline;
      }
      .nota-value { 
        font-weight: 900 !important; 
        display: inline;
      }
      
      .nota-footer { 
        text-align: center; 
        margin-top: 12px; 
        font-size: 18px !important; 
        font-weight: 900 !important; 
        line-height: 1.2;
      }
    }
  </style>
</head>
<body>
 
<div id="loadingOverlay">
  <div class="spinner-border text-info" role="status" style="width: 3rem; height: 3rem;"></div>
  <b class="mt-3 text-info">SINKRONISASI SERVER CLOUD...</b>
</div>
 
<div id="strukCetak">
  <div class="nota-container">
    <div class="nota-header">
      <div class="nota-title">KIKI KREDIT<br>SOLUTION</div>
    </div>
    
    <div class="nota-garis"></div>
    
    <div class="nota-item-row"><div class="nota-label">TGL: </div><div class="nota-value" id="printTanggal">-</div></div>
    <div class="nota-item-row"><div class="nota-label">NAM: </div><div class="nota-value" id="printPelanggan">-</div></div>
    <div class="nota-item-row"><div class="nota-label">BRG: </div><div class="nota-value" id="printBarang">-</div></div>
    
    <div class="nota-garis"></div>
    
    <div class="nota-item-row"><div class="nota-label">BYR: </div><div class="nota-value" id="printDiterima">Rp 0</div></div>
    <div class="nota-item-row"><div class="nota-label">SIS: </div><div class="nota-value" id="printSisa">Rp 0</div></div>
    
    <div class="nota-garis"></div>
    
    <div class="nota-footer">
      *** TERIMA KASIH ***<br>
      BUKTI PEMBAYARAN SAH.
    </div>
  </div>
</div>
 
<div class="container-fluid">
  <div class="stats-card text-center shadow mb-3">
    <h3 class="font-weight-bold"><i class="fas fa-store mr-2"></i>TOKO USAHA KIKI</h3>
    <div class="row mt-3">
      <div class="col-6 border-right">
        <small class="text-uppercase text-white-50 font-weight-bold">Total Piutang</small>
        <h4 id="statPiutang" class="font-weight-bold">Rp 0</h4>
      </div>
      <div class="col-6">
        <small class="text-uppercase text-white-50 font-weight-bold">Pelanggan Aktif</small>
        <h4 id="statAktif" class="font-weight-bold">0</h4>
      </div>
    </div>
  </div>
 
  <div class="card p-3">
    <h6 id="formTitle" class="font-weight-bold text-info mb-3"><i class="fas fa-user-plus mr-2"></i>Registrasi Pelanggan Baru</h6>
    <input type="hidden" id="editRowNum">
    <div class="row">
      <div class="col-md-4"><input type="text" id="nama" class="form-control form-control-custom" placeholder="Nama Pelanggan"></div>
      <div class="col-md-8"><input type="text" id="alamat" class="form-control form-control-custom" placeholder="Alamat Lengkap"></div>
      <div class="col-md-4"><input type="text" id="barang" class="form-control form-control-custom" placeholder="Nama Barang"></div>
      <div class="col-md-3"><input type="number" id="harga" class="form-control form-control-custom" placeholder="Harga Total (Rp)"></div>
      <div class="col-md-3">
        <select id="tipeTenor" class="form-control form-control-custom" style="padding:10px;">
          <option value="Bulanan">Tenor Bulanan</option>
          <option value="Mingguan">Tenor Mingguan</option>
        </select>
      </div>
      <div class="col-md-2"><input type="number" id="tenor" class="form-control form-control-custom" placeholder="Tenor"></div>
      <div class="col-md-4"><input type="number" id="sisaUtang" class="form-control form-control-custom" placeholder="Sisa Utang (Kosongkan jika baru)"></div>
    </div>
    <div class="row mt-2">
      <div class="col-9"><button id="btnSimpan" onclick="simpan()" class="btn btn-info btn-block font-weight-bold py-2 shadow" style="background:#0284c7; border:none;">SIMPAN TRANSAKSI</button></div>
      <div class="col-3"><button onclick="resetForm()" class="btn btn-secondary btn-block py-2">BATAL</button></div>
    </div>
  </div>
 
  <div class="card p-2 mb-2">
    <div class="input-group">
      <div class="input-group-prepend"><span class="input-group-text bg-transparent border-right-0" style="border-color:#475569;"><i class="fas fa-search text-muted"></i></span></div>
      <input type="text" id="cariInput" class="form-control border-left-0 form-control-custom mb-0" placeholder="Cari nama pelanggan..." onkeyup="filterTabel()">
    </div>
  </div>
 
  <div class="card p-2">
    <div class="table-responsive">
      <table class="table table-sm table-dark table-hover mb-0" style="font-size: 14px; background: transparent;">
        <thead class="text-muted" style="border-bottom: 2px solid #334155;">
          <tr>
            <th>Pelanggan</th>
            <th>Tipe</th>
            <th>Tenor</th>
            <th>Sisa Tagihan</th>
            <th class="text-right">Aksi</th>
          </tr>
        </thead>
        <tbody id="tabelBody">
          <tr><td colspan="5" class="text-center py-4 text-muted">Sinkronisasi basis data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
 
<script>
  // TAUTAN DRIVER UTAMA GOOGLE MACRO SCRIPT (Ganti ID dengan milik Anda jika berbeda)
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzrL3ITJ4yHhqblHlEjxQlRv0bQGTk_TYmmqlkBbS6Dk323XE78_jwkB920a4-aB4hb/exec";
  let dataStorage = [];
 
  function muatData() {
    document.getElementById('loadingOverlay').style.display = 'flex';
    fetch(SCRIPT_URL + "?aksi=ambilDataDashboard")
    .then(res => res.json())
    .then(data => {
      if (!data || data.error) {
        alert("Gagal sinkronisasi data!");
        document.getElementById('tabelBody').innerHTML = "<tr><td colspan='5' class='text-center text-danger font-weight-bold'>Gagal memuat basis data!</td></tr>";
        return;
      }
      
      dataStorage = data.pelanggan || [];
      document.getElementById('statPiutang').innerText = "Rp " + data.stats.totalPiutang.toLocaleString('id-ID');
      document.getElementById('statAktif').innerText = data.stats.aktif;
      
      if (dataStorage.length === 0) {
        document.getElementById('tabelBody').innerHTML = "<tr><td colspan='5' class='text-center py-4 text-muted'>Belum ada data pelanggan.</td></tr>";
        return;
      }
      
      let html = "";
      dataStorage.forEach(p => {
        let badge = p.tipe === 'Mingguan' ? 'badge-mingguan' : 'badge-info';
        let rowClass = p.status === 'LUNAS' ? 'table-success text-muted' : '';
        
        html += '<tr class="' + rowClass + '" style="border-bottom: 1px solid #334155 !important;">' +
          '<td class="py-3"><b style="font-size: 16px; color: #38bdf8;">' + p.nama.toUpperCase() + '</b><br><span class="small text-muted">' + p.alamat + ' | ' + p.barang + '</span></td>' +
          '<td class="py-3"><span class="badge ' + badge + ' p-1">' + p.tipe + '</span></td>' +
          '<td class="py-3"><b>' + p.cicilanKe + '</b>/' + p.tenor + '</td>' +
          '<td class="py-3 text-warning font-weight-bold">Rp ' + p.sisa.toLocaleString('id-ID') + '</td>' +
          '<td class="text-right py-3">' +
            '<div class="btn-group">' +
              '<button onclick="bayar(' + p.rowNum + ')" class="btn btn-success btn-aksi">Bayar</button>' +
              '<button onclick="cetakStrukLokal(' + p.rowNum + ')" class="btn btn-info btn-aksi" style="background:#0284c7; border:none;">Cetak</button>' +
              '<button onclick="pindahKeEdit(' + p.rowNum + ')" class="btn btn-warning btn-sm text-dark px-2 font-weight-bold">✏️</button>' +
              '<button onclick="hapus(' + p.rowNum + ')" class="btn btn-danger btn-sm px-2">🗑️</button>' +
            '</div>' +
          '</td>' +
        '</tr>';
      });
      document.getElementById('tabelBody').innerHTML = html;
      document.getElementById('loadingOverlay').style.display = 'none';
    }).catch(() => { document.getElementById('loadingOverlay').style.display = 'none'; });
  }
 
  function cetakStrukLokal(rowNum) {
    let p = dataStorage.find(item => item.rowNum === rowNum);
    if (!p) return alert("Data tidak sinkron!");
 
    let opsi = { year: '2-digit', month: 'numeric', day: 'numeric' };
    let tglSkg = new Date().toLocaleDateString('id-ID', opsi);
 
    document.getElementById('printTanggal').innerText = tglSkg;
    document.getElementById('printPelanggan').innerText = p.nama.toUpperCase();
    document.getElementById('printBarang').innerText = p.barang.toUpperCase();
    document.getElementById('printDiterima').innerText = "CEK SISA"; 
    document.getElementById('printSisa').innerText = "Rp " + Number(p.sisa).toLocaleString('id-ID');
 
    setTimeout(() => { window.print(); }, 200);
  }
 
  function bayar(rowNum) {
    let nominalInput = prompt("Masukkan nominal pembayaran rupiah (Rp):");
    if(nominalInput) {
      let cekAngka = Number(nominalInput);
      if(isNaN(cekAngka) || cekAngka <= 0) return alert("Masukkan nominal angka pembayaran yang valid!");
      
      document.getElementById('loadingOverlay').style.display = 'flex';
      
      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ aksi: "bayarManual", rowNum: rowNum, nominal: nominalInput })
      })
      .then(res => res.json())
      .then(res => {
        muatData();
        let formattedNominal = Number(res.nominal).toLocaleString('id-ID');
        let formattedSisa = Number(res.sisa).toLocaleString('id-ID');
        
        document.getElementById('printTanggal').innerText = res.tgl;
        document.getElementById('printPelanggan').innerText = res.nama.toUpperCase();
        document.getElementById('printBarang').innerText = res.barang.toUpperCase();
        document.getElementById('printDiterima').innerText = "Rp " + formattedNominal;
        document.getElementById('printSisa').innerText = "Rp " + formattedSisa;
        
        document.getElementById('loadingOverlay').style.display = 'none';
        setTimeout(() => { window.print(); }, 300);
      });
    }
  }
 
  function simpan() {
    let hargaInput = document.getElementById('harga').value;
    let sisaInput = document.getElementById('sisaUtang').value;
    let data = {
      rowNum: document.getElementById('editRowNum').value,
      nama: document.getElementById('nama').value,
      alamat: document.getElementById('alamat').value,
      barang: document.getElementById('barang').value,
      totalHarga: hargaInput,
      tipeTenor: document.getElementById('tipeTenor').value,
      tenor: document.getElementById('tenor').value,
      sisaUtang: sisaInput ? sisaInput : hargaInput 
    };
    if(!data.nama || !data.totalHarga) return alert("Nama dan Harga wajib terisi!");
    document.getElementById('btnSimpan').disabled = true;
    document.getElementById('loadingOverlay').style.display = 'flex';
    
    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ aksi: "simpanData", data: data })
    })
    .then(res => res.json())
    .then(res => { 
      alert(res); 
      resetForm(); 
      muatData(); 
    });
  }
 
  function pindahKeEdit(rowNum) {
    let p = dataStorage.find(item => item.rowNum === rowNum);
    if(!p) return;
    document.getElementById('editRowNum').value = rowNum;
    document.getElementById('nama').value = p.nama;
    document.getElementById('alamat').value = p.alamat;
    document.getElementById('barang').value = p.barang;
    document.getElementById('harga').value = p.total;
    document.getElementById('tipeTenor').value = p.tipe;
    document.getElementById('tenor').value = p.tenor;
    document.getElementById('sisaUtang').value = p.sisa;
    document.getElementById('formTitle').innerText = "Ubah Data: " + p.nama.toUpperCase();
    document.getElementById('btnSimpan').innerText = "PERBARUI DATA";
    window.scrollTo({top: 0, behavior: 'smooth'});
  }
 
  function resetForm() {
    document.getElementById('editRowNum').value = "";
    document.querySelectorAll('input').forEach(i => i.value = "");
    document.getElementById('formTitle').innerText = "Registrasi Pelanggan Baru";
    document.getElementById('btnSimpan').innerText = "SIMPAN TRANSAKSI";
    document.getElementById('btnSimpan').disabled = false;
  }
 
  function filterTabel() {
    let input = document.getElementById("cariInput").value.toUpperCase();
    let tr = document.getElementById("tabelBody").getElementsByTagName("tr");
    for (let i = 0; i < tr.length; i++) {
      let td = tr[i].getElementsByTagName("td")[0];
      if(td) {
        tr[i].style.display = (td.innerText.toUpperCase().indexOf(input) > -1) ? "" : "none";
      }
    }
  }
 
  function hapus(rowNum) {
    if(confirm("Hapus data ini secara permanen dari sistem?")) {
      document.getElementById('loadingOverlay').style.display = 'flex';
      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ aksi: "hapusData", rowNum: rowNum })
      })
      .then(res => res.json())
      .then(res => { 
        muatData(); 
        alert(res); 
      });
    }
  }
 
  window.onload = muatData;
</script>
</body>
</html>
