<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiki Kredit Solution - V2.8 Ultra Smart POS</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      --card-radius: 16px;
      --font-main: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
 
    body { 
      background-color: #f8fafc; 
      font-family: var(--font-main); 
      color: #334155;
    }
 
    .navbar-custom { 
      background: var(--primary-gradient); 
      padding: 16px 0;
      box-shadow: 0 4px 20px rgba(30, 60, 114, 0.15);
    }
 
    /* CARD STATISTIK UTAMA */
    .card-stats { 
      border: none; 
      border-radius: var(--card-radius); 
      box-shadow: 0 10px 25px rgba(0,0,0,0.02); 
      background: #ffffff;
      border-left: 6px solid #2563eb;
      transition: transform 0.2s;
    }
    .card-stats:hover { transform: translateY(-2px); }
    .card-stats.success { border-left-color: #16a34a; }
    
    /* PANEL KONTROL */
    .control-panel {
      background: #ffffff;
      border-radius: var(--card-radius);
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.02);
      border: 1px solid #f1f5f9;
    }
    .input-jumbo { 
      padding: 14px 18px; 
      border-radius: 12px !important; 
      font-size: 1rem;
      border: 2px solid #e2e8f0; 
      background-color: #f8fafc;
    }
    .input-jumbo:focus { border-color: #2563eb; background-color: #fff; box-shadow: none; }
    .btn-jumbo { 
      padding: 14px; 
      border-radius: 12px; 
      font-weight: 700; 
      font-size: 1rem;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }
 
    /* KARTU PELANGGAN */
    .loan-card { 
      background: #ffffff; 
      border-radius: var(--card-radius); 
      padding: 24px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.03); 
      border: 1px solid #f1f5f9; 
      margin-bottom: 24px; 
      position: relative;
      overflow: hidden;
    }
    .loan-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 4px; height: 100%;
      background: #2563eb;
    }
    .loan-card.lunas::before { background: #16a34a; }
 
    .info-title { font-size: 0.75rem; color: #64748b; text-transform: uppercase; font-weight: 700; letter-spacing: 0.7px; }
    .info-desc { font-size: 1.1rem; font-weight: 700; color: #1e293b; }
    
    .progress { height: 10px; border-radius: 10px; background-color: #f1f5f9; overflow: hidden; }
 
    .action-grid { 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); 
      gap: 12px; 
      margin-top: 18px; 
      padding-top: 18px; 
      border-top: 1px dashed #e2e8f0; 
    }
    .btn-action-panel { 
      padding: 12px; 
      font-weight: 700; 
      font-size: 0.9rem; 
      border-radius: 12px; 
      border: none; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 8px; 
      transition: all 0.15s ease;
    }
    .btn-action-panel:active { transform: scale(0.96); }
    
    .btn-action-panel.pay { background-color: #16a34a; color: #ffffff; box-shadow: 0 4px 10px rgba(22, 163, 74, 0.15); }
    .btn-action-panel.print { background-color: #475569; color: #ffffff; box-shadow: 0 4px 10px rgba(71, 85, 105, 0.15); }
    .btn-action-panel.edit { background-color: #f59e0b; color: #ffffff; box-shadow: 0 4px 10px rgba(245, 158, 11, 0.15); }
    .btn-action-panel.delete { background-color: #ef4444; color: #ffffff; box-shadow: 0 4px 10px rgba(239, 68, 68, 0.15); }
    .btn-action-panel:disabled { background-color: #e2e8f0 !important; color: #94a3b8 !important; box-shadow: none !important; cursor: not-allowed; transform: none; }
 
    .loading-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: rgba(255,255,255,0.95); 
      display: flex; justify-content: center; align-items: center; 
      z-index: 9999; display: none; 
    }

    .smart-cash-btn {
      font-size: 0.85rem;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid #16a34a;
      background: #fff;
      color: #16a34a;
      font-weight: bold;
      transition: all 0.2s;
    }
    .smart-cash-btn:hover { background: #16a34a; color: #fff; }

    /* AREA STRUK PRINT DESKTOP (KERTAS 58mm) */
    #areaStrukDesktop { display: none; }

    @media print {
      body * { display: none !important; }
      #areaStrukDesktop { 
        display: block !important;
        position: absolute; left: 0; top: 0; width: 54mm !important; 
        margin: 0 !important; padding: 0mm 1mm !important;
        background: #ffffff !important; color: #000000 !important;
        font-family: "Courier New", Courier, monospace !important; 
        font-size: 10pt !important; font-weight: bold !important;
        white-space: pre-wrap !important; line-height: 1.3 !important;
      }
      @page { size: 58mm auto; margin: 0mm !important; }
    }
  </style>
</head>
<body>
 
  <div id="loading" class="loading-overlay">
    <div class="text-center">
      <div class="spinner-border text-primary" role="status" style="width: 3.5rem; height: 3.5rem;"></div>
      <p class="mt-3 fw-bold text-secondary">Sinkronisasi Database Cloud Engine...</p>
    </div>
  </div>
 
  <nav class="navbar navbar-custom shadow-sm mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1 text-white fw-bold fs-4">
        <i class="fa-solid fa-bolt text-warning me-2"></i> Kiki Kredit Solution <span class="badge bg-white/20 text-white fs-6 ms-2">V2.8 Ultra-Smart</span>
      </span>
      <button class="btn btn-outline-light btn-sm fw-bold rounded-pill" onclick="testHubungkanPrinterDirect()">
        <i class="fa-solid fa-print me-1"></i> Hubungkan Bluetooth (Direct)
      </button>
    </div>
  </nav>
 
  <div class="container mb-5">
    
    <div class="row mb-4 g-3">
      <div class="col-6 col-md-6">
        <div class="card card-stats p-3 h-100">
          <span class="info-title">Total Outstanding Piutang</span>
          <h2 class="fw-bold text-primary mb-0 mt-1" id="statTotalPiutang" style="font-size: calc(1.2rem + 0.6vw);">Rp 0</h2>
        </div>
      </div>
      <div class="col-6 col-md-6">
        <div class="card card-stats success p-3 h-100">
          <span class="info-title">Konsumen Aktif</span>
          <h2 class="fw-bold text-success mb-0 mt-1" id="statPelangganAktif" style="font-size: calc(1.2rem + 0.6vw);">0 Jiwa</h2>
        </div>
      </div>
    </div>
 
    <div class="control-panel mb-4">
      <div class="row g-3">
        <div class="col-12 col-md-8">
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 px-3"><i class="fa-solid fa-search text-muted"></i></span>
            <input type="text" id="inputCari" class="form-control input-jumbo border-start-0" placeholder="Cari nama nasabah, alamat atau tipe barang..." oninput="filterDataSistem()">
          </div>
        </div>
        <div class="col-12 col-md-4">
          <button class="btn btn-primary btn-jumbo w-100 shadow-sm" onclick="bukaModalForm()">
            <i class="fa-solid fa-circle-plus me-1"></i> Daftarkan Kredit Baru
          </button>
        </div>
      </div>
    </div>
 
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold text-dark mb-0"><i class="fa-solid fa-database text-secondary me-2"></i> Database Kolektif</h5>
      <span class="badge bg-dark px-3 py-2 rounded-3" id="lblInfoCount">Data Ter-Load: 0</span>
    </div>
    
    <div id="containerDataKonsumen" class="row"></div>
 
  </div>
 
  <div class="modal fade" id="modalForm" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4 border-0 shadow-lg">
        <div class="modal-header border-bottom-0 pt-4 px-4">
          <h5 class="modal-title fw-bold text-dark" id="modalFormTitle">Form Berkas</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="formPelanggan" onsubmit="prosesSimpanData(event)">
          <div class="modal-body px-4">
            <input type="hidden" id="formRowNum">
            <div class="mb-3"><label class="form-label fw-bold small text-muted">Nama Lengkap Konsumen</label><input type="text" id="formNama" class="form-control form-control-lg rounded-3" required></div>
            <div class="mb-3"><label class="form-label fw-bold small text-muted">Alamat Domisili KTP</label><input type="text" id="formAlamat" class="form-control form-control-lg rounded-3" required></div>
            <div class="mb-3"><label class="form-label fw-bold small text-muted">Deskripsi Barang Kredit</label><input type="text" id="formBarang" class="form-control form-control-lg rounded-3" required></div>
            <div class="row">
              <div class="col-6 mb-3"><label class="form-label fw-bold small text-muted">Harga Pokok (Rp)</label><input type="number" id="formTotalHarga" class="form-control form-control-lg rounded-3" required oninput="sinkronSisaUtang()"></div>
              <div class="col-6 mb-3"><label class="form-label fw-bold small text-muted">Sisa Pokok (Rp)</label><input type="number" id="formSisaUtang" class="form-control form-control-lg rounded-3" required></div>
            </div>
            <div class="row">
              <div class="col-6 mb-3">
                <label class="form-label fw-bold small text-muted">Skema Periode</label>
                <select id="formTipeTenor" class="form-select form-select-lg rounded-3"><option value="Bulanan">Bulanan</option><option value="Mingguan">Mingguan</option><option value="Harian">Harian</option></select>
              </div>
              <div class="col-6 mb-3"><label class="form-label fw-bold small text-muted">Tenor Batas Waktu</label><input type="number" id="formTenor" class="form-control form-control-lg rounded-3" required></div>
            </div>
          </div>
          <div class="modal-footer border-top-0 pb-4 px-4"><button type="button" class="btn btn-light rounded-3" data-bs-dismiss="modal">Tutup Berkas</button><button type="submit" class="btn btn-primary px-4 rounded-3 fw-bold">Otorisasi Data</button></div>
        </form>
      </div>
    </div>
  </div>
 
  <div class="modal fade" id="modalBayar" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 380px;">
      <div class="modal-content rounded-4 border-0 shadow-lg">
        <div class="modal-header border-bottom-0 pt-4 px-4">
          <h5 class="modal-title fw-bold text-dark">Validasi Kasir</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="formBayar" onsubmit="prosesBayarManual(event)">
          <div class="modal-body px-4">
            <input type="hidden" id="bayarRowNum">
            <div class="mb-3">
              <label class="form-label small text-muted d-block mb-0">Nama Terkait</label>
              <input type="text" id="bayarNama" class="form-control-plaintext fw-bold text-primary fs-5 p-0" readonly>
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold small text-muted">Nominal Angsuran (Rp)</label>
              <input type="number" id="bayarNominal" class="form-control form-control-lg rounded-3 text-success fw-bold fs-4" required placeholder="0">
            </div>
            <div class="mb-2"><span class="small text-muted fw-bold">QUICK CASH PINTASAN:</span></div>
            <div class="d-flex flex-wrap gap-2 mb-2" id="smartCashContainer"></div>
          </div>
          <div class="modal-footer border-top-0 pb-4 px-4">
            <button type="button" class="btn btn-light rounded-3" data-bs-dismiss="modal">Batal</button>
            <button type="submit" class="btn btn-success w-100 rounded-3 fw-bold py-2 shadow-sm">Posting + Smart Cetak</button>
          </div>
        </form>
      </div>
    </div>
  </div>
 
  <pre id="areaStrukDesktop"></pre>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
 
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzeWIBiIVGYMmLNi-OLD2TkhbX1ab1LDpY4uMTjEGEojHRjtiu1ElqO72bnZWYHoug/exec";
 
    let listPelanggan = [];
    let perangkatKarakteristikPrinter = null; 
    const bootstrapModalForm = new bootstrap.Modal(document.getElementById('modalForm'));
    const bootstrapModalBayar = new bootstrap.Modal(document.getElementById('modalBayar'));
 
    document.addEventListener("DOMContentLoaded", muatDataDashboard);
 
    function tunukkanLoading(show) { document.getElementById('loading').style.display = show ? 'flex' : 'none'; }
    function formatRupiah(angka) { return "Rp " + Number(angka).toLocaleString('id-ID'); }
    function sinkronSisaUtang() { if(!document.getElementById('formRowNum').value) document.getElementById('formSisaUtang').value = document.getElementById('formTotalHarga').value; }
 
    function muatDataDashboard() {
      tunukkanLoading(true);
      fetch(`${API_URL}?action=ambilData`)
        .then(res => res.json())
        .then(res => {
          tunukkanLoading(false);
          if (res.error) return Swal.fire("Sistem Error", res.error, "error");
          
          listPelanggan = res.pelanggan || [];
          document.getElementById('statTotalPiutang').innerText = formatRupiah(res.stats.totalPiutang);
          document.getElementById('statPelangganAktif').innerText = res.stats.aktif + " Orang";
          document.getElementById('lblInfoCount').innerText = "Data Ter-Load: " + listPelanggan.length;
          
          renderDataKeSistemGrid(listPelanggan);
        }).catch(err => { tunukkanLoading(false); Swal.fire("Koneksi Putus", "Gagal memproses konektivitas API.", "error"); });
    }
 
    function renderDataKeSistemGrid(dataArray) {
      const container = document.getElementById('containerDataKonsumen');
      container.innerHTML = dataArray.length === 0 ? '<div class="col-12 text-center text-muted py-5 fs-6 card bg-white border rounded-4 shadow-sm">Pencarian tidak menemukan kecocokan berkas data.</div>' : '';
      
      dataArray.forEach(p => {
        const totalHarga = Number(p.total) || 1;
        const sisaUtang = Number(p.sisa) || 0;
        const persentaseTerbayar = Math.min(100, Math.max(0, ((totalHarga - sisaUtang) / totalHarga) * 100));
 
        const divCol = document.createElement('div');
        divCol.className = "col-12 col-md-6 col-lg-4";
        
        divCol.innerHTML = `
          <div class="loan-card ${p.status === 'LUNAS' ? 'lunas' : ''}">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <div style="max-width: 70%;">
                <span class="info-title d-block">Nama Nasabah</span>
                <span class="info-desc text-truncate d-block" style="font-size: 1.2rem;">${p.nama}</span>
              </div>
              <span class="badge ${p.status === 'AKTIF' ? 'bg-primary' : 'bg-success'} px-3 py-2 rounded-pill fw-bold" style="font-size:0.75rem;">${p.status}</span>
            </div>
            
            <div class="text-muted small mb-3"><i class="fa-solid fa-map-marker-alt text-danger me-1"></i> ${p.alamat}</div>
            
            <div class="p-3 bg-light rounded-3 mb-3" style="font-size: 0.9rem;">
              <div class="row g-2">
                <div class="col-6">
                  <span class="info-title d-block">Kredit Barang</span>
                  <span class="fw-bold text-dark">${p.barang}</span>
                </div>
                <div class="col-6">
                  <span class="info-title d-block">Kontrak Pembelian</span>
                  <span class="fw-bold text-muted">${formatRupiah(p.total)}</span>
                </div>
                <div class="col-6 mt-2">
                  <span class="info-title d-block">Skema Angsuran</span>
                  <span class="fw-bold text-dark">Ke-${p.cicilanKe} <span class="text-muted fw-normal">/ ${p.tenor}x (${p.tipe})</span></span>
                </div>
                <div class="col-6 mt-2">
                  <span class="info-title d-block">Beban Sisa Utang</span>
                  <span class="fw-bold text-danger d-block fs-6">${formatRupiah(p.sisa)}</span>
                </div>
              </div>
 
              <div class="mt-3">
                <div class="d-flex justify-content-between small text-muted mb-1 fw-bold" style="font-size: 0.7rem;">
                  <span>RASIO PELUNASAN</span>
                  <span>${persentaseTerbayar.toFixed(0)}%</span>
                </div>
                <div class="progress">
                  <div class="progress-bar ${p.status === 'LUNAS' ? 'bg-success' : 'bg-primary'}" role="progressbar" style="width: ${persentaseTerbayar}%"></div>
                </div>
              </div>
            </div>
            
            <div class="action-grid">
              <button class="btn-action-panel pay" ${p.status !== 'AKTIF'?'disabled':''} onclick="bukaModalBayar(${p.rowNum}, '${p.nama}', ${p.sisa})">
                <i class="fa-solid fa-receipt"></i> Kasir
              </button>
              <button class="btn-action-panel print" onclick="cetakUlangStruk(${p.rowNum})">
                <i class="fa-solid fa-print"></i> Struk
              </button>
              <button class="btn-action-panel edit" onclick="bukaModalForm(${p.rowNum})">
                <i class="fa-solid fa-user-gear"></i> Mengatur
              </button>
              <button class="btn-action-panel delete" onclick="prosesHapusData(${p.rowNum})">
                <i class="fa-solid fa-trash-can"></i> Hapus
              </button>
            </div>
          </div>
        `;
        container.appendChild(divCol);
      });
    }
 
    function filterDataSistem() {
      const input = document.getElementById('inputCari');
      if (!input) return;
      const kataKunci = input.value.toLowerCase().trim();
      
      const hasilFilter = listPelanggan.filter(p => 
        (p.nama && p.nama.toLowerCase().includes(kataKunci)) || 
        (p.alamat && p.alamat.toLowerCase().includes(kataKunci)) ||
        (p.barang && p.barang.toLowerCase().includes(kataKunci))
      );
      renderDataKeSistemGrid(hasilFilter);
    }
 
    function bukaModalForm(rowNum = null) {
      document.getElementById('formPelanggan').reset();
      document.getElementById('formRowNum').value = rowNum || '';
      document.getElementById('modalFormTitle').innerText = rowNum ? "⚙️ Perbarui Kontrak Manajemen" : "👤 Daftarkan Konsumen Baru";
      if(rowNum) {
        const p = listPelanggan.find(i => i.rowNum === rowNum);
        if(p) {
          document.getElementById('formNama').value = p.nama;
          document.getElementById('formAlamat').value = p.alamat;
          document.getElementById('formBarang').value = p.barang;
          document.getElementById('formTotalHarga').value = p.total;
          document.getElementById('formSisaUtang').value = p.sisa;
          document.getElementById('formTipeTenor').value = p.tipe;
          document.getElementById('formTenor').value = p.tenor;
        }
      }
      bootstrapModalForm.show();
    }
 
    function prosesSimpanData(e) {
      e.preventDefault();
      const payload = {
        action: "simpanData",
        data: {
          rowNum: document.getElementById('formRowNum').value, 
          nama: document.getElementById('formNama').value,
          alamat: document.getElementById('formAlamat').value, 
          barang: document.getElementById('formBarang').value,
          totalHarga: document.getElementById('formTotalHarga').value, 
          sisaUtang: document.getElementById('formSisaUtang').value,
          tipeTenor: document.getElementById('formTipeTenor').value, 
          tenor: document.getElementById('formTenor').value
        }
      };
      bootstrapModalForm.hide(); tunukkanLoading(true);
      irimKeApi(payload);
    }
 
    function bukaModalBayar(rowNum, nama, sisa) {
      document.getElementById('formBayar').reset();
      document.getElementById('bayarRowNum').value = rowNum;
      document.getElementById('bayarNama').value = nama;
      
      const smartCashContainer = document.getElementById('smartCashContainer');
      smartCashContainer.innerHTML = '';
      
      let nominalPintasan = [50000, 100000, 150000, 200000];
      nominalPintasan.forEach(amt => {
        if(amt < sisa) {
          smartCashContainer.innerHTML += `<button type="button" class="smart-cash-btn" onclick="isiSmartCash(${amt})">${amt/1000}K</button>`;
        }
      });
      smartCashContainer.innerHTML += `<button type="button" class="smart-cash-btn btn-success text-white border-0" onclick="isiSmartCash(${sisa})">Lunas (${sisa/1000}K)</button>`;
      
      bootstrapModalBayar.show();
    }

    function isiSmartCash(nominal) {
      document.getElementById('bayarNominal').value = nominal;
    }
 
    function prosesBayarManual(e) {
      e.preventDefault();
      const payload = {
        action: "bayarManual",
        rowNum: document.getElementById('bayarRowNum').value,
        nominal: document.getElementById('bayarNominal').value
      };
      bootstrapModalBayar.hide(); tunukkanLoading(true);
      
      fetch(API_URL, { method: "POST", body: JSON.stringify(payload) })
        .then(res => res.json())
        .then(res => {
          if(res.error) { tunukkanLoading(false); return Swal.fire("Gagal", res.error, "error"); }
          tunukkanLoading(false);
          
          pemicuKertasThermal(res.hasilBayar.tgl, res.hasilBayar.nama, res.hasilBayar.barang, res.hasilBayar.nominal, res.hasilBayar.sisa);
          muatDataDashboard();
        }).catch(() => { tunukkanLoading(false); Swal.fire("Kesalahan Kasir", "Gagal memproses transaksi finansial.", "error"); });
    }
 
    function cetakUlangStruk(rowNum) {
      const p = listPelanggan.find(i => i.rowNum === rowNum);
      if (p) {
        let opsi = { year: '2-digit', month: 'numeric', day: 'numeric' };
        let tglSkg = new Date().toLocaleDateString('id-ID', opsi);
        pemicuKertasThermal(tglSkg, p.nama, p.barang, 0, p.sisa);
      }
    }
 
    function buatBarisStruk(label, value) {
      const LEBAR_KERTAS = 26; 
      const labelStr = String(label);
      const valueStr = String(value);
      const sisaSpasi = LEBAR_KERTAS - (labelStr.length + valueStr.length);
      if (sisaSpasi > 0) {
        return labelStr + " ".repeat(sisaSpasi) + valueStr + "\n";
      }
      return labelStr + "\n" + " ".repeat(LEBAR_KERTAS - valueStr.length) + valueStr + "\n";
    }
 
    /* 🔥 JALUR TERBARU: WEB BLUETOOTH DIRECT DRIVER (TANPA APLIKASI TAMBAHAN JIKA DI CHROME) */
    async function testHubungkanPrinterDirect() {
      try {
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ services: ['000018f0-0000-1000-8000-00805f9b34fb'] }, { namePrefix: 'RPP' }, { namePrefix: 'MP' }, { namePrefix: 'PT' }]
        });
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
        const characteristics = await service.getCharacteristics();
        perangkatKarakteristikPrinter = characteristics[0];
        Swal.fire("Printer Terhubung", "Driver Hardware Bluetooth siap mengirimkan data secara direct.", "success");
      } catch (err) {
        Swal.fire("Informasi", "Menggunakan mode standar system print / tautan eksternal.", "info");
      }
    }

    /* 🔥 V2.8 ULTRA SMART-PRINT ENGINE CONTROLLER */
    async function pemicuKertasThermal(tgl, nama, barang, nominal, sisa) {
      const _nominalDisplay = nominal > 0 ? formatRupiah(nominal) : "- Re-Print -";
      
      let streamTeks = "";
      streamTeks += "   SLIP PEMBAYARAN SAH    \n";
      streamTeks += "  KIKI KREDIT SOLUTION    \n";
      streamTeks += "==========================\n"; 
      streamTeks += buatBarisStruk("Tgl:", tgl);
      streamTeks += buatBarisStruk("Nama:", nama.substring(0, 20));
      streamTeks += buatBarisStruk("Brg:", barang.substring(0, 20));
      streamTeks += "--------------------------\n";
      streamTeks += buatBarisStruk("BAYAR:", _nominalDisplay);
      streamTeks += buatBarisStruk("SISA :", formatRupiah(sisa));
      streamTeks += "--------------------------\n";
      streamTeks += "     * TERIMA KASIH * \n";
      streamTeks += "BUKTI TRANSAKSI YANG VALID\n\n\n\n";

      // 1. Opsi Direct Web Bluetooth (Jika user sudah mem-pair di navigasi atas)
      if (perangkatKarakteristikPrinter) {
        try {
          let encoder = new TextEncoder();
          let dataUint8 = encoder.encode(streamTeks);
          await perangkatKarakteristikPrinter.writeValue(dataUint8);
          return;
        } catch (e) {
          console.log("Direct gagal, beralih ke native driver...");
        }
      }

      // 2. Opsi Android Protocol (`rawbt://`)
      const isAndroid = /Android/i.test(navigator.userAgent);
      if (isAndroid) {
        const rawbtUrl = "rawbt://base64," + btoa(unescape(encodeURIComponent(streamTeks)));
        window.location.href = rawbtUrl;
      } else {
        // 3. Opsi PC / Desktop Cloud Print
        const areaStruk = document.getElementById('areaStrukDesktop');
        areaStruk.textContent = streamTeks;
        window.print();
      }
    }
 
    function prosesHapusData(rowNum) {
      Swal.fire({ 
        title: "Konfirmasi Hapus Data?", 
        text: "Menghapus berakibat hilangnya rekam jejak cicilan konsumen secara permanen!", 
        icon: "warning", 
        showCancelButton: true, 
        confirmButtonColor: "#dc3545", 
        cancelButtonColor: "#6c757d",
        confirmButtonText: "Ya, Hapus Data!" 
      }).then((result) => {
        if (result.isConfirmed) {
          tunukkanLoading(true);
          irimKeApi({ action: "hapusData", rowNum: rowNum });
        }
      });
    }
 
    function irimKeApi(payload) {
      fetch(API_URL, { method: "POST", body: JSON.stringify(payload) })
        .then(res => res.json())
        .then(pesan => { 
          tunukkanLoading(false); 
          Swal.fire("Berhasil", typeof pesan === 'string' ? pesan : "Transaksi Berhasil Di-Posting!", "success"); 
          muatDataDashboard(); 
        })
        .catch(() => { 
          tunukkanLoading(false); 
          Swal.fire("Kesalahan Server", "Gagal mengirimkan instruksi mutasi ke Cloud.", "error"); 
        });
    }
  </script>
