<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiki Kredit Solution - Dashboard Management</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { margin-bottom: 20px; color: #2c3e50; text-align: center; }
        
        /* Stats Cards */
        .stats-container { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
        .card { flex: 1; min-width: 250px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 5px solid #3498db; }
        .card.aktif { border-left-color: #2ecc71; }
        .card h3 { font-size: 14px; color: #7f8c8d; text-transform: uppercase; margin-bottom: 5px; }
        .card p { font-size: 24px; font-weight: bold; color: #2c3e50; }

        /* Form & Actions */
        .action-section { background: white; padding: 20px; border-radius: 10px; margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .action-section h2 { margin-bottom: 15px; font-size: 18px; color: #2c3e50; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
        button { padding: 10px 15px; border: none; border-radius: 5px; background: #3498db; color: white; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #2980b9; }
        button.btn-clear { background: #95a5a6; }
        button.btn-clear:hover { background: #7f8c8d; }

        /* Table Style */
        .table-container { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th { background: #2c3e50; color: white; padding: 12px 15px; }
        td { padding: 12px 15px; border-bottom: 1px solid #eee; vertical-align: middle; }
        tr:hover { background: #f9f9f9; }
        
        /* Badges */
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; display: inline-block; }
        .badge.aktif-bg { background: #e8f5e9; color: #2ecc71; }
        .badge.lunas-bg { background: #ebeff5; color: #95a5a6; }

        /* Action Buttons Table */
        .btn-table { padding: 5px 10px; font-size: 12px; margin-right: 5px; }
        .btn-pay { background: #2ecc71; } .btn-pay:hover { background: #27ae60; }
        .btn-edit { background: #f39c12; } .btn-edit:hover { background: #d35400; }
        .btn-delete { background: #e74c3c; } .btn-delete:hover { background: #c0392b; }

        /* Loading Overlay */
        .loading { text-align: center; padding: 20px; font-weight: bold; color: #7f8c8d; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Kiki Kredit Solution - Panel Utama</h1>

        <div class="stats-container">
            <div class="card">
                <h3>Total Piutang (Aktif)</h3>
                <p id="totalPiutang">Rp 0</p>
            </div>
            <div class="card aktif">
                <h3>Pelanggan Aktif</h3>
                <p id="pelangganAktif">0 Orang</p>
            </div>
        </div>

        <div class="action-section">
            <h2 id="formTitle">Pendaftaran / Kemas Kini Pelanggan</h2>
            <form id="pelangganForm" onsubmit="prosesSimpanData(event)">
                <input type="hidden" id="rowNum">
                <input type="hidden" id="cicilanKe" value="0">
                
                <div class="form-grid">
                    <input type="text" id="nama" placeholder="Nama Penuh Pelanggan" required>
                    <input type="text" id="alamat" placeholder="Alamat" required>
                    <input type="text" id="barang" placeholder="Nama Barang Kredit" required>
                    <input type="number" id="totalHarga" placeholder="Total Harga (Rp)" required oninput="setSisaSamaTotal()">
                    <select id="tipeTenor">
                        <option value="Bulanan">Bulanan</option>
                        <option value="Mingguan">Mingguan</option>
                        <option value="Harian">Harian</option>
                    </select>
                    <input type="number" id="tenor" placeholder="Tenor (Sesi / Kali)" required>
                    <input type="number" id="sisaUtang" placeholder="Sisa Utang (Rp)" required>
                </div>
                <button type="submit" id="btnSubmit">Daftar Pelanggan Baru</button>
                <button type="button" class="btn-clear" onclick="resetForm()">Batal / Kosongkan</button>
                <button type="button" style="background:#8e44ad;" onclick="ambilData()">Refresh Data</button>
            </form>
        </div>

        <h2>Senarai Data Pelanggan</h2>
        <div class="table-container" style="margin-top: 15px;">
            <div id="loadingText" class="loading">Memuatkan data dari Google Sheets...</div>
            <table id="pelangganTable" style="display: none;">
                <thead>
                    <tr>
                        <th>Nama</th>
                        <th>Alamat</th>
                        <th>Barang</th>
                        <th>Total Harga</th>
                        <th>Tenor</th>
                        <th>Cicilan Ke</th>
                        <th>Sisa Utang</th>
                        <th>Status</th>
                        <th>Tindakan</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // URL API Google Apps Script anda
        const API_URL = "https://script.google.com/macros/s/AKfycbw2msfsM4iqNn9n-9cHCf-jy9Ja5FhwjF59ugSAumG3IYt6CbHp1EhlHBaFlWm-Akks/exec";
        let cachePelanggan = [];

        // Isikan automatik nilai sisa utang sama dengan total harga untuk pelanggan baru
        function setSisaSamaTotal() {
            const rowNum = document.getElementById('rowNum').value;
            if (!rowNum) { // Hanya jika daftar pelanggan baharu
                document.getElementById('sisaUtang').value = document.getElementById('totalHarga').value;
            }
        }

        // 1. Fungsi Ambil Data (GET)
        async function ambilData() {
            document.getElementById('loadingText').style.display = "block";
            document.getElementById('pelangganTable').style.display = "none";
            
            try {
                const response = await fetch(`${API_URL}?action=ambilData`);
                const result = await response.json();
                
                if (result.error) {
                    alert("Ralat Sistem: " + result.error);
                    return;
                }

                // Kemas kini kad statistik
                document.getElementById('totalPiutang').innerText = "Rp " + result.stats.totalPiutang.toLocaleString('id-ID');
                document.getElementById('pelangganAktif').innerText = result.stats.aktif + " Orang";
                
                cachePelanggan = result.pelanggan;
                renderTable(result.pelanggan);
                
            } catch (err) {
                console.error(err);
                alert("Gagal menyambung ke server Google Apps Script.");
            } finally {
                document.getElementById('loadingText').style.display = "none";
                document.getElementById('pelangganTable').style.display = "table";
            }
        }

        // Fungsi papar data ke dalam jadual HTML
        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";
            
            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;">Tiada data pelanggan dijumpai.</td></tr>`;
                return;
            }

            data.forEach(p => {
                const tr = document.createElement('tr');
                const statusClass = p.status === "AKTIF" ? "aktif-bg" : "lunas-bg";
                
                tr.innerHTML = `
                    <td><strong>${p.nama}</strong></td>
                    <td>${p.alamat}</td>
                    <td>${p.barang}</td>
                    <td>Rp ${p.total.toLocaleString('id-ID')}</td>
                    <td>${p.tenor} (${p.tipe})</td>
                    <td style="text-align:center;">${p.cicilanKe}</td>
                    <td style="color:${p.sisa > 0 ? '#e74c3c' : '#2ecc71'}; font-weight:bold;">Rp ${p.sisa.toLocaleString('id-ID')}</td>
                    <td><span class="badge ${statusClass}">${p.status}</span></td>
                    <td>
                        ${p.status === "AKTIF" ? `<button class="btn-table btn-pay" onclick="bayarManual(${p.rowNum})">Bayar</button>` : ''}
                        <button class="btn-table btn-edit" onclick="pilihEdit(${p.rowNum})">Edit</button>
                        <button class="btn-table btn-delete" onclick="hapusData(${p.rowNum})">Hapus</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 2. Fungsi Simpan / Kemas Kini Data (POST)
        async function prosesSimpanData(e) {
            e.preventDefault();
            
            const rowNum = document.getElementById('rowNum').value;
            const dataPayload = {
                rowNum: rowNum ? parseInt(rowNum) : 0,
                nama: document.getElementById('nama').value,
                alamat: document.getElementById('alamat').value,
                barang: document.getElementById('barang').value,
                totalHarga: parseInt(document.getElementById('totalHarga').value),
                tipeTenor: document.getElementById('tipeTenor').value,
                tenor: parseInt(document.getElementById('tenor').value),
                cicilanKe: parseInt(document.getElementById('cicilanKe').value || 0),
                sisaUtang: parseInt(document.getElementById('sisaUtang').value)
            };

            const submitBtn = document.getElementById('btnSubmit');
            submitBtn.disabled = true;
            submitBtn.innerText = "Memproses...";

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "simpanData", data: dataPayload })
                });
                const msg = await response.json();
                alert(msg);
                resetForm();
                ambilData();
            } catch (err) {
                console.error(err);
                alert("Gagal menyimpan data.");
            } finally {
                submitBtn.disabled = false;
            }
        }

        // 3. Fungsi Bayar Manual (POST) + Auto Download Slip PDF
        async function bayarManual(rowNum) {
            const nominal = prompt("Masukkan Nominal Pembayaran (Rp):");
            if (nominal === null || nominal.trim() === "") return;
            if (isNaN(nominal) || parseInt(nominal) <= 0) return alert("Nominal tidak sah!");

            try {
                document.getElementById('loadingText').style.display = "block";
                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: "bayarManual",
                        rowNum: rowNum,
                        nominal: parseInt(nominal)
                    })
                });
                const result = await response.json();

                if (result.error) {
                    alert("Ralat Bayar: " + result.error);
                } else {
                    alert(`Bayaran Berjaya!\nNama: ${result.hasilBayar.nama}\nSisa Utang Terkini: Rp ${result.hasilBayar.sisa.toLocaleString('id-ID')}`);
                    
                    // PROSES AUTO-DOWNLOAD SLIP PDF BERASASKAN BASE64
                    const base64Pdf = result.pdf;
                    const downloadLink = document.createElement('a');
                    downloadLink.href = `data:application/pdf;base64,${base64Pdf}`;
                    downloadLink.download = `Slip_${result.hasilBayar.nama.replace(/\s+/g, '_')}.pdf`;
                    document.body.appendChild(downloadLink);
                    downloadLink.click();
                    document.body.removeChild(downloadLink);
                    
                    ambilData(); // Segarkan semula jadual & statistik
                }
            } catch (err) {
                console.error(err);
                alert("Ralat ketika memproses pembayaran.");
            } finally {
                document.getElementById('loadingText').style.display = "none";
            }
        }

        // 4. Fungsi Hapus Data (POST)
        async function hapusData(rowNum) {
            if(!confirm("Adakah anda pasti mahu memadamkan data baris ini secara kekal?")) return;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "hapusData", rowNum: rowNum })
                });
                const msg = await response.json();
                alert(msg);
                ambilData();
            } catch (err) {
                console.error(err);
                alert("Gagal memadam data.");
            }
        }

        // Helper: Pilih data untuk dimasukkan ke borang (Edit Mode)
        function pilihEdit(rowNum) {
            const p = cachePelanggan.find(item => item.rowNum === rowNum);
            if(!p) return;

            document.getElementById('rowNum').value = p.rowNum;
            document.getElementById('nama').value = p.nama;
            document.getElementById('alamat').value = p.alamat;
            document.getElementById('barang').value = p.barang;
            document.getElementById('totalHarga').value = p.total;
            document.getElementById('tipeTenor').value = p.tipe;
            document.getElementById('tenor').value = p.tenor;
            document.getElementById('cicilanKe').value = p.cicilanKe;
            document.getElementById('sisaUtang').value = p.sisa;

            document.getElementById('formTitle').innerText = "Kemas Kini Data: " + p.nama;
            document.getElementById('btnSubmit').innerText = "Simpan Kemas Kini";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Helper: Reset Borang ke asal
        function resetForm() {
            document.getElementById('pelangganForm').reset();
            document.getElementById('rowNum').value = "";
            document.getElementById('cicilanKe').value = "0";
            document.getElementById('formTitle').innerText = "Pendaftaran / Kemas Kini Pelanggan";
            document.getElementById('btnSubmit').innerText = "Daftar Pelanggan Baru";
        }

        // Muat data automatik semasa halaman dibuka pertama kali
        window.onload = ambilData;
    </script>
</body>
</html>
