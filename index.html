<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kiki Kredit Solution - Full Page Thermal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <style>
    /* ============================================================
       1. INTERFACE LAYAR HP - DESAIN KHUSUS PREVIEW TERMAL
       ============================================================ */
    body { 
      background: #555555; 
      padding: 10px; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    /* Kontainer utama menyerupai kertas struk gulungan asli */
    .thermal-page {
      background: #ffffff;
      max-width: 400px;
      margin: 0 auto 30px auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      padding: 20px 15px;
      border-radius: 4px;
    }

    .app-card {
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      max-width: 400px;
      margin: 0 auto 20px auto;
      padding: 15px;
    }

    .form-control-custom {
      border-radius: 8px;
      font-size: 14px;
      border: 2px solid #ced4da;
      padding: 10px;
      height: auto;
      margin-bottom: 10px;
    }
    
    .form-control-custom:focus {
      border-color: #11698e;
      box-shadow: none;
    }

    .btn-action {
      font-size: 13px;
      font-weight: bold;
      padding: 8px 10px;
      border-radius: 6px;
      margin: 2px;
      flex: 1;
      text-align: center;
    }

    #overlay { 
      display: none; 
      position: fixed; 
      top: 0; left: 0; width: 100%; height: 100%; 
      background: rgba(0, 0, 0, 0.7); 
      z-index: 9999; 
      justify-content: center; 
      align-items: center; 
      flex-direction: column; 
      color: white;
    }

    /* ============================================================
       2. GAYA STRUK KIKI KREDIT (PERSIS SEPERTI CONTOH FOTO SUKSES)
       ============================================================ */
    .nota-container {
      width: 100%;
      background: #ffffff;
      color: #000000;
      font-family: 'Courier New', Courier, monospace; 
      font-size: 15px; 
      font-weight: bold;
      line-height: 1.4;
    }
    
    .nota-header { 
      text-align: center; 
      font-size: 17px; 
      font-weight: bold;
      line-height: 1.3; 
      margin-bottom: 4px; 
      text-transform: uppercase;
    }
    
    .nota-garis { 
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      margin: 3px 0; 
      font-size: 15px;
      font-weight: bold;
    }
    .nota-garis::after {
      content: "------------------------------------------"; 
      display: block;
    }
    
    .nota-item-group {
      margin-bottom: 3px;
    }
    
    .nota-label {
      text-align: left;
      font-weight: bold;
      display: block;
    }
    
    .nota-value {
      text-align: left;
      display: block;
      padding-left: 2px;
      margin-bottom: 2px;
    }
    
    .nota-footer {
      text-align: center;
      font-size: 14px;
      margin-top: 6px;
      line-height: 1.3;
    }

    /* ============================================================
       3. ARSITEKTUR ENGINE CETAK OTOMATIS (MURNI TERMAL)
       ============================================================ */
    @media print {
      /* Hilangkan semua panel kontrol kasir, tombol, dan background gelap */
      body { 
        background: #ffffff !important; 
        padding: 0 !important; 
      }
      .app-card, #overlay, .no-print, .header-card { 
        display: none !important; 
      }
      
      /* Set halaman tanpa margin paksa */
      @page { 
        size: auto; 
        margin: 0mm !important; 
      }
      
      .thermal-page {
        box-shadow: none !important;
        margin: 0 !important;
        padding: 5mm 4mm !important; /* Pas untuk ruang cetak mini */
        width: 100% !important;
        max-width: 100% !important;
        border-radius: 0 !important;
      }

      .nota-container {
        font-size: 14px !important;
      }
      .nota-header {
        font-size: 16px !important;
      }
    }
  </style>
</head>
<body>

  <div id="overlay">
    <div class="spinner-border text-light" role="status" style="width: 3rem; height: 3rem;"></div>
    <b class="mt-3 h5">Sinkronisasi Cloud...</b>
  </div>

  <div class="app-card text-center bg-dark text-white border-0 py-3 shadow">
    <h5 class="font-weight-bold mb-0">KIKI KREDIT KASIR TERMAL</h5>
    <small class="text-white-50" id="statInfo">Memuat info piutang...</small>
  </div>

  <div class="thermal-page">
    <div class="nota-container">
      <div class="nota-header">KIKI KREDIT<br>SOLUTION</div>
      
      <div class="nota-garis"></div>
      
      <div class="nota-item-group">
        <div class="nota-label">Tgl:</div>
        <div class="nota-value" id="pTgl">28/5/2026</div>
      </div>
      
      <div class="nota-item-group">
        <div class="nota-label">Nama:</div>
        <div class="nota-value" id="pNama">PILIH PELANGGAN DI BAWAH</div>
      </div>
      
      <div class="nota-item-group">
        <div class="nota-label">Barang:</div>
        <div class="nota-value" id="pBrg">-</div>
      </div>
      
      <div class="nota-garis"></div>
      
      <div class="nota-item-group">
        <div class="nota-label">Bayar:</div>
        <div class="nota-value" id="pBayar">Rp 0</div>
      </div>
      
      <div class="nota-item-group">
        <div class="nota-label">Sisa:</div>
        <div class="nota-value" id="pSisa">Rp 0</div>
      </div>
      
      <div class="nota-garis"></div>
      
      <div class="nota-footer">
        *** TERIMA KASIH ***<br>
        Bukti Pembayaran Sah.
      </div>
    </div>
  </div>

  <div class="app-card shadow-sm no-print">
    <h6 id="formTitle" class="text-primary font-weight-bold mb-2"><i class="fas fa-user-plus mr-1"></i>Pelanggan Baru</h6>
    <input type="hidden" id="editRowNum">
    <input type="text" id="nama" class="form-control form-control-custom" placeholder="Nama Pelanggan">
    <input type="text" id="alamat" class="form-control form-control-custom" placeholder="Alamat">
    <input type="text" id="barang" class="form-control form-control-custom" placeholder="Nama Barang">
    
    <div class="form-row">
      <div class="col-7"><input type="number" id="harga" class="form-control form-control-custom" placeholder="Harga (Rp)" oninput="autoIsiSisa()"></div>
      <div class="col-5"><input type="number" id="tenor" class="form-control form-control-custom" placeholder="Tenor"></div>
    </div>
    
    <div class="form-row">
      <div class="col-7"><input type="number" id="sisaUtang" class="form-control form-control-custom" placeholder="Sisa Utang"></div>
      <div class="col-5">
        <select id="tipeTenor" class="form-control form-control-custom" style="padding: 5px;">
          <option value="Bulanan">Bulanan</option>
          <option value="Mingguan">Mingguan</option>
        </select>
      </div>
    </div>
    
    <button id="btnSimpan" onclick="simpan()" class="btn btn-primary btn-block font-weight-bold py-2 shadow-sm" style="border-radius:8px;">SIMPAN KE SERVER CLOUD</button>
    <button onclick="resetForm()" class="btn btn-light btn-block btn-sm text-muted mt-2 border" style="border-radius:6px;">Reset Form</button>
  </div>

  <div class="app-card shadow-sm no-print">
    <div class="input-group mb-2">
      <div class="input-group-prepend"><span class="input-group-text bg-transparent border-right-0"><i class="fas fa-search text-muted"></i></span></div>
      <input type="text" id="cariInput" class="form-control border-left-0" placeholder="Cari nama..." onkeyup="filterTabel()">
    </div>
    
    <div style="max-height: 350px; overflow-y: auto;">
      <table class="table table-sm table-hover mb-0">
        <tbody id="tabelBody">
          <tr><td class="text-center py-3 text-muted">Menghubungkan ke server...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzrL3ITJ4yHhqblHlEjxQlRv0bQGTk_TYmmqlkBbS6Dk323XE78_jwkB920a4-aB4hb/exec";
  let dataStorage = [];

  function autoIsiSisa() {
    let harga = document.getElementById('harga').value;
    let editRow = document.getElementById('editRowNum').value;
    if(!editRow) { document.getElementById('sisaUtang').value = harga; }
  }

  function muatData() {
    document.getElementById('overlay').style.display = 'flex';
    fetch(SCRIPT_URL + "?aksi=ambilData")
    .then(res => res.text())
    .then(textData => {
      let data = JSON.parse(textData);
      dataStorage = data.pelanggan || [];
      
      let totalPiutang = data.stats && data.stats.totalPiutang ? data.stats.totalPiutang : 0;
      let aktif = data.stats && data.stats.aktif ? data.stats.aktif : 0;
      document.getElementById('statInfo').innerText = "Piutang: Rp " + totalPiutang.toLocaleString('id-ID') + " | Aktif: " + aktif;
      
      let html = "";
      dataStorage.forEach(p => {
        let namaPel = p.nama || "-";
        let barangPel = p.barang || "-";
        let sisaPel = p.sisa || 0;
        let row = p.rowNum;

        html += `<tr class="border-bottom">
          <td class="py-2">
            <div class="d-flex justify-content-between">
              <span class="text-dark font-weight-bold" style="font-size:15px;">${namaPel.toUpperCase()}</span>
              <span class="text-danger font-weight-bold" style="font-size:14px;">Rp ${Number(sisaPel).toLocaleString('id-ID')}</span>
            </div>
            <small class="text-muted d-block mb-1">Barang: ${barangPel} | Tenor: ${p.tenor}x (${p.tipe})</small>
            <div class="d-flex">
              <button onclick="bayar(${row})" class="btn btn-success btn-action"><i class="fas fa-money-bill-wave"></i> Angsur</button>
              <button onclick="loadKeStruk(${row})" class="btn btn-dark btn-action"><i class="fas fa-eye"></i> Lihat</button>
              <button onclick="pindahKeEdit(${row})" class="btn btn-warning text-white btn-action"><i class="fas fa-edit"></i> Edit</button>
              <button onclick="hapus(${row})" class="btn btn-danger btn-action"><i class="fas fa-trash"></i></button>
            </div>
          </td>
        </tr>`;
      });
      document.getElementById('tabelBody').innerHTML = html || "<tr><td class='text-center text-muted py-3'>Tidak ada data</td></tr>";
      document.getElementById('overlay').style.display = 'none';
    }).catch(() => { document.getElementById('overlay').style.display = 'none'; });
  }

  function simpan() {
    let hargaInput = document.getElementById('harga').value;
    let sisaInput = document.getElementById('sisaUtang').value;
    let data = {
      rowNum: document.getElementById('editRowNum').value,
      nama: document.getElementById('nama').value,
      alamat: document.getElementById('alamat').value,
      barang: document.getElementById('barang').value,
      totalHarga: hargaInput,
      tipeTenor: document.getElementById('tipeTenor').value,
      tenor: document.getElementById('tenor').value,
      sisaUtang: sisaInput ? sisaInput : hargaInput
    };
    if(!data.nama || !data.totalHarga) return alert("Nama dan Harga wajib diisi!");
    document.getElementById('overlay').style.display = 'flex';
    fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ aksi: "simpan", data: data }) })
    .then(res => res.text()).then(textData => { 
      alert(JSON.parse(textData)); 
      resetForm(); 
      muatData(); 
    });
  }

  function bayar(rowNum) {
    let nominal = prompt("Masukkan jumlah angsuran pembayaran (Rp):");
    if(!nominal) return;
    document.getElementById('overlay').style.display = 'flex';
    fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ aksi: "bayar", rowNum: rowNum, nominal: nominal }) })
    .then(res => res.text()).then(textData => {
      let res = JSON.parse(textData);
      document.getElementById('pTgl').innerText = res.tgl;
      document.getElementById('pNama').innerText = res.nama.toUpperCase();
      document.getElementById('pBrg').innerText = res.barang.toUpperCase();
      document.getElementById('pBayar').innerText = "Rp " + Number(res.nominal).toLocaleString('id-ID');
      document.getElementById('pSisa').innerText = "Rp " + Number(res.sisa).toLocaleString('id-ID');
      muatData();
      setTimeout(() => { window.print(); }, 400);
    });
  }

  function loadKeStruk(rowNum) {
    let p = dataStorage.find(item => item.rowNum === rowNum);
    if (!p) return;
    document.getElementById('pTgl').innerText = new Date().toLocaleDateString('id-ID');
    document.getElementById('pNama').innerText = p.nama.toUpperCase();
    document.getElementById('pBrg').innerText = p.barang.toUpperCase();
    document.getElementById('pBayar').innerText = "CEK SISA";
    document.getElementById('pSisa').innerText = "Rp " + Number(p.sisa).toLocaleString('id-ID');
    window.scrollTo({top: 0, behavior: 'smooth'});
  }

  function pindahKeEdit(rowNum) {
    let p = dataStorage.find(item => item.rowNum === rowNum);
    if (!p) return;
    document.getElementById('editRowNum').value = p.rowNum;
    document.getElementById('nama').value = p.nama;
    document.getElementById('alamat').value = p.alamat;
    document.getElementById('barang').value = p.barang;
    document.getElementById('harga').value = p.total;
    document.getElementById('tenor').value = p.tenor;
    document.getElementById('tipeTenor').value = p.tipe;
    document.getElementById('sisaUtang').value = p.sisa;
    document.getElementById('formTitle').innerHTML = "<i class='fas fa-edit mr-1'></i>Ubah: " + p.nama.toUpperCase();
    document.getElementById('btnSimpan').innerText = "PERBARUI DATA";
  }

  function resetForm() {
    document.getElementById('editRowNum').value = "";
    document.querySelectorAll('input').forEach(i => i.value = "");
    document.getElementById('formTitle').innerHTML = "<i class='fas fa-user-plus mr-1'></i>Pelanggan Baru";
    document.getElementById('btnSimpan').innerText = "SIMPAN KE SERVER CLOUD";
  }

  function filterTabel() {
    let input = document.getElementById("cariInput").value.toUpperCase();
    let tr = document.getElementById("tabelBody").getElementsByTagName("tr");
    for (let i = 0; i < tr.length; i++) {
      let td = tr[i].getElementsByTagName("span")[0];
      if(td) { tr[i].style.display = (td.innerText.toUpperCase().indexOf(input) > -1) ? "" : "none"; }
    }
  }

  function hapus(rowNum) {
    if(confirm("Hapus data pelanggan ini?")) {
      document.getElementById('overlay').style.display = 'flex';
      fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ aksi: "hapus", rowNum: rowNum }) })
      .then(res => res.text()).then(() => muatData());
    }
  }

  window.onload = muatData;
</script>
</body>
</html>
