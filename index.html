<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>BILLING PS DODI JAYA</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
  <style>
    body { background-color: #f0f2f5; font-family: sans-serif; padding: 15px; }
    .card-ps { border: none; border-radius: 15px; transition: 0.3s; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .timer { font-size: 2.2rem; font-weight: bold; color: #d63031; font-family: monospace; letter-spacing: 2px; }
    .status-badge { font-size: 0.8rem; padding: 5px 15px; border-radius: 50px; font-weight: bold; }
    .jajanan-section { background: #fff9db; padding: 12px; border-radius: 10px; border: 2px dashed #f59f00; margin-top: 15px; }
    .list-jajanan-lokal { font-size: 0.85rem; color: #d63031; margin-top: 5px; font-weight: bold; }
    .ts-wrapper { background: #fff; border-radius: 5px; }
  </style>
</head>
<body>
 
<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-4 mt-2">
    <h2 class="fw-bold text-primary m-0">BILLING PS DODI JAYA</h2>
    <div>
      <button onclick="cetakLaporanBulanan()" class="btn btn-warning fw-bold shadow-sm me-2">📊 Cetak Bulanan</button>
      <button onclick="load()" class="btn btn-dark shadow-sm">🔄 REFRESH DATA</button>
    </div>
  </div>
 
  <div id="content" class="row">
    <div class="text-center mt-5">Memuat Sistem Kasir...</div>
  </div>
</div>
 
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
 
<script>
  // URL JONP Google Apps Script sebagai pengaman jika eksekusi standar diblokir browser
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyuZZn52NlwNehwSV_rbxZXC0318hUgxaX9AvedQEsIn6OKKTiO9JVaCsEWkVEVFtfx/exec";

  let intervals = {};
  let menuGlobal = [];
  let dataPSGlobal = [];
  let tomSelectInstances = {};
 
  // Fungsi jembatan pemanggil server universal agar anti-macet
  function panggilServer(urlParams, callbackSukses) {
    const callbackName = "jsonp_" + Math.round(100000 * Math.random());
    window[callbackName] = (data) => {
      delete window[callbackName];
      var scriptEl = document.getElementById(callbackName);
      if(scriptEl) scriptEl.remove();
      if (data && data.error) alert("Error Server: " + data.error); else callbackSukses(data);
    };
    const script = document.createElement("script");
    script.id = callbackName;
    script.src = GOOGLE_SCRIPT_URL + urlParams + "&callback=" + callbackName;
    script.onerror = () => {
      // Jika JSONP gagal, coba eksekusi lewat google.script.run bawaan Apps Script
      try {
        if(urlParams.includes("getAppData")) {
          google.script.run.withSuccessHandler(callbackSukses).getAppData();
        }
      } catch(e) {
        alert("Gagal terhubung ke server database Google Sheets.");
      }
    };
    document.body.appendChild(script);
  }

  function load() {
    Object.keys(tomSelectInstances).forEach(k => {
      if(tomSelectInstances[k]) tomSelectInstances[k].destroy();
    });
    tomSelectInstances = {};
    
    document.getElementById('content').innerHTML = '<div class="text-center mt-5"><div class="spinner-border text-primary mb-2"></div><br>Memuat Data Terbaru...</div>';
    panggilServer("?action=getAppData", render);
  }
 
  function render(data) {
    Object.keys(intervals).forEach(k => clearInterval(intervals[k]));
    
    menuGlobal = data.menu || [];
    dataPSGlobal = data.ps || [];
    const container = document.getElementById('content');
    container.innerHTML = '';
 
    if(dataPSGlobal.length === 0) {
      container.innerHTML = '<div class="text-center mt-5 text-muted">Tidak ada data Station PS di sheet Dashboard.</div>';
      return;
    }
 
    dataPSGlobal.forEach(item => {
      const isMain = item.status.includes("🔴 MAIN") || item.status.includes("🔴 SEWA") || item.status.includes("MAIN");
      const safeId = item.noPS.replace(/\s+/g, '');

      let options = `<option value="">Cari/Pilih Jajanan...</option>`;
      menuGlobal.forEach(m => {
        if(m && m[0] !== undefined) {
          if(!m[1] || m[1] === 0 || m[1] === "") {
            options += `<option value="" disabled class="fw-bold text-secondary">${m[0]}</option>`;
          } else {
            let hargaClean = m[1].toString().replace(/[^0-9.-]+/g,"");
            let hargaJajan = parseFloat(hargaClean) || 0;
            options += `<option value="${hargaJajan}" data-nama="${m[0]}">${m[0]} (Rp${hargaJajan.toLocaleString('id-ID')})</option>`;
          }
        }
      });
 
      let jamSelesaiTampil = item.selesai || "00:00";
      let riwayatJajananTeks = "";
      
      if (item.selesai && item.selesai.indexOf(" | Jrn:") !== -1) {
        let bagian = item.selesai.split(" | Jrn:");
        jamSelesaiTampil = bagian[0];
        riwayatJajananTeks = bagian[1];
      }
      
      // Ambil jam bersih saja untuk kalkulasi hitung mundur cadangan
      var matchJam = jamSelesaiTampil.match(/(\d{2}):(\d{2})/);
      let jamSelesaiBersih = matchJam ? matchJam[1] + ":" + matchJam[2] : "00:00";
 
      const div = document.createElement('div');
      div.className = 'col-md-4';
      
      let htmlContent = `
        <div class="card card-ps">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center">
              <h4 class="m-0 fw-bold text-dark">${item.noPS}</h4>
              <span class="status-badge ${isMain ? 'bg-danger text-white' : 'bg-success text-white'}">${isMain ? '🔴 MAIN' : '🟢 Tersedia'}</span>
            </div>
            <hr class="my-2">
      `;
 
      if (isMain) {
        let labelCetak = "🖨️ CETAK NOTA SEWA";
        if(item.tipePS === "WiFi" || item.status.toUpperCase().includes("WIFI")) labelCetak = "🖨️ CETAK NOTA WIFI";
        else if(item.tipePS === "PS2" || item.status.toUpperCase().includes("PS2")) labelCetak = "🖨️ CETAK NOTA PS2";
        else if(item.tipePS === "PS4" || item.status.toUpperCase().includes("PS4")) labelCetak = "🖨️ CETAK NOTA PS4";
 
        htmlContent += `
          <div class="text-center timer my-2" id="t-${safeId}">--:--:--</div>
          <p class="text-center text-muted small mb-3">Selesai: <b>${jamSelesaiBersih} WIB</b><br>Total Billing: <b>Rp ${(item.biaya || 0).toLocaleString('id-ID')}</b></p>
          <button onclick="cetakNotaLangsung('${item.noPS}')" class="btn btn-outline-secondary w-100 fw-bold mb-2">${labelCetak}</button>
          <button onclick="stop('${item.noPS}')" class="btn btn-danger w-100 fw-bold mb-2">SELESAI & BAYAR</button>
        `;
      } else {
        htmlContent += `
          <div class="py-2">
            <label class="small text-muted fw-bold mb-1">Pilih Mesin / Layanan:</label>
            <select id="type-${safeId}" class="form-select mb-2">
              <option value="PS3">🎮 PLAYSTATION 3 (Rp5.000/Jam)</option>
              <option value="PS2">🎮 PLAYSTATION 2 (Rp5.000/Jam)</option>
              <option value="PS4">🎮 PLAYSTATION 4 (Rp10.000/Jam)</option>
              <option value="WIFI">📶 SEWA WIFI (Rp5.000/Jam)</option>
            </select>
            
            <label class="small text-muted fw-bold mb-1">Atur Durasi (Jam):</label>
            <div class="input-group mb-3">
              <input type="number" id="h-${safeId}" class="form-control" placeholder="Contoh: 2" min="0.5" step="0.5">
              <button onclick="start('${item.noPS}')" class="btn btn-success px-4 fw-bold">MULAI</button>
            </div>
            <button onclick="cetakKuponAwal('${item.noPS}')" class="btn btn-sm btn-outline-primary w-100 fw-bold mb-1">🎟️ CETAK KUPON DI AWAL</button>
          </div>
        `;
      }
 
      htmlContent += `
        <div class="jajanan-section">
          <label class="small fw-bold text-dark d-block mb-1">🛒 Tambah Jajanan / Snack Kasir:</label>
          <div class="mb-2">
            <select id="m-${safeId}" class="form-select dropdown-pencarian">${options}</select>
          </div>
          <button onclick="pesan('${item.noPS}')" class="btn btn-warning btn-sm w-100 fw-bold text-dark" ${isMain ? '' : 'disabled'}>➕ Masukkan ke Billing</button>
          <div class="list-jajanan-lokal" id="list-jajanan-${safeId}">
            ${riwayatJajananTeks ? 'Terbeli: ' + riwayatJajananTeks : 'Belum belanja jajanan'}
          </div>
        </div>
      `;
 
      htmlContent += '</div></div>';
      div.innerHTML = htmlContent;
      container.appendChild(div);
 
      tomSelectInstances[safeId] = new TomSelect(`#m-${safeId}`, {
        create: false,
        sortField: { field: "text", direction: "asc" },
        placeholder: "Ketik nama jajanan..."
      });
      
      if (isMain && jamSelesaiBersih !== "00:00") {
        runTimerPintar(item.noPS, jamSelesaiBersih);
      }
    });
  }
 
  function runTimerPintar(id, jamSelesaiStr) {
    try {
      var matchJam = jamSelesaiStr.match(/(\d{2}):(\d{2})/);
      if (!matchJam) return;
      const targetJam = parseInt(matchJam[1], 10);
      const targetMenit = parseInt(matchJam[2], 10);
      const safeId = id.replace(/\s+/g, '');
      
      function hitung() {
        const sekarang = new Date();
        const target = new Date();
        target.setHours(targetJam, targetMenit, 0, 0);
        
        // Pengaman anti loncat hari jika melewati jam 12 malam
        if (target.getTime() < sekarang.getTime() && (sekarang.getTime() - target.getTime() > 6 * 60 * 60 * 1000)) {
          target.setDate(target.getDate() + 1);
        }
        
        const diff = target.getTime() - sekarang.getTime();
        const el = document.getElementById('t-' + safeId);
        if (!el) return;
        
        if (diff <= 0) { 
          el.innerHTML = "WAKTU HABIS!"; 
          el.style.color = "orange"; 
          clearInterval(intervals[safeId]);
          return; 
        }
        
        const h = Math.floor(diff / 3600000).toString().padStart(2, '0');
        const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
        const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
        el.innerHTML = h + ':' + m + ':' + s;
      }
      hitung();
      intervals[safeId] = setInterval(hitung, 1000);
    } catch(e) { console.log(e); }
  }
 
  function start(id) {
    const safeId = id.replace(/\s+/g, '');
    const jam = document.getElementById('h-' + safeId).value;
    const tipePS = document.getElementById('type-' + safeId).value;
    if (!jam || parseFloat(jam) <= 0) return alert("Isi durasi waktu terlebih dahulu!");
    
    document.getElementById('content').innerHTML = '<div class="text-center mt-5"><div class="spinner-border text-success"></div><br>Menyimpan Sesi Main...</div>';
    panggilServer(`?action=mulaiMain&id=${id}&jam=${jam}&tipe=${tipePS}`, load);
  }
 
  function pesan(id) {
    const safeId = id.replace(/\s+/g, '');
    const selectEl = document.getElementById('m-' + safeId);
    if(!selectEl || selectEl.value === "") return alert("Silakan pilih jajanan terlebih dahulu!");
    
    const harga = parseFloat(selectEl.value);
    const selectedOption = selectEl.options[selectEl.selectedIndex];
    const namaJajanan = selectedOption.getAttribute('data-nama') || selectedOption.text;
    
    document.getElementById('content').innerHTML = '<div class="text-center mt-5"><div class="spinner-border text-warning"></div><br>Memasukkan Jajanan ke Billing...</div>';
    panggilServer(`?action=tambahJajanan&id=${id}&nama=${encodeURIComponent(namaJajanan)}&harga=${harga}`, load);
  }
 
  function cetakKuponAwal(id) {
    const safeId = id.replace(/\s+/g, '');
    const inputJam = document.getElementById('h-' + safeId).value;
    const tipePS = document.getElementById('type-' + safeId).value;
    if (!inputJam || parseFloat(inputJam) <= 0) return alert("Silakan isi jumlah Jam durasi sewa!");
 
    const durasiJam = parseFloat(inputJam);
    let hargaPerJam = 5000;
    if (tipePS === "PS4") hargaPerJam = 10000;
    
    const totalHargaKupon = durasiJam * hargaPerJam;
    const kodeUnik = "KP-" + Math.floor(1000 + Math.random() * 9000);
    
    let labelHeader = "RENTAL " + tipePS;
    if (tipePS === "WIFI") labelHeader = "SEWA WIFI";
 
    const winKupon = window.open("", "_blank");
    winKupon.document.write('<html><head><title>Kupon</title><style>body{font-family:monospace;width:52mm;font-size:10px;margin:0;padding:5px;}.text-center{text-align:center;}.line{border-top:1px dashed #000;margin:5px 0;}.box{border:1px solid #000;padding:3px;margin:3px 0;font-weight:bold;}</style></head><body><div class="text-center"><b>🎟️ KUPON ' + labelHeader + '</b><br>DODI JAYA GAME SOLUTION</div><div class="line"></div><div class="text-center box">' + kodeUnik + '</div>Layanan: ' + id + '<br>Durasi: ' + durasiJam + ' Jam<br>Total: Rp ' + totalHargaKupon.toLocaleString('id-ID') + '<div class="line"></div><div class="text-center"><b>STATUS: LUNAS DI AWAL</b></div></body></html>');
    winKupon.document.close();
    setTimeout(function(){ winKupon.print(); winKupon.close(); }, 300);
  }
 
  function cetakNotaLangsung(id) {
    const item = dataPSGlobal.find(p => p.noPS === id);
    if (!item) return alert("Data tidak ditemukan!");
    const waktuSekarang = new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' });
    
    let riwayatJajananTeks = "Tidak ada";
    if (item.selesai && item.selesai.indexOf(" | Jrn:") !== -1) {
      riwayatJajananTeks = item.selesai.split(" | Jrn:")[1];
    }
 
    let judulNota = "BILLING RENTAL " + (item.tipePS || "PS");
    if (item.status.toUpperCase().includes("WIFI")) judulNota = "BILLING SEWA WIFI";
 
    const win = window.open("", "_blank");
    win.document.write('<html><head><title>Nota</title><style>body{font-family:monospace;width:52mm;font-size:10px;margin:0;padding:5px;}table{width:100%;font-size:10px;}.line{border-top:1px dashed #000;margin:5px 0;}</style></head><body><div style="text-align:center;"><b>' + judulNota + '</b><br>DODI JAYA GAME SOLUTION</div><div class="line"></div>Waktu Cetak: ' + waktuSekarang + '<br><table><tr><td>Station/Room</td><td>: ' + item.noPS + '</td></tr><tr><td>Durasi sewa</td><td>: ' + item.durasi + ' Jam</td></tr></table><div class="line"></div><b>Rincian Belanja Jajanan:</b><br>' + riwayatJajananTeks + '<div class="line"></div><table><tr><td><b>TOTAL BAYAR</b></td><td style="text-align:right;"><b>Rp ' + item.biaya.toLocaleString('id-ID') + '</b></td></tr></table><div class="line"></div><div style="text-align:center;margin-top:5px;">Terima Kasih Atas Kunjungan Anda!</div></body></html>');
    win.document.close();
    setTimeout(function(){ win.print(); win.close(); }, 300);
  }
 
  function cetakLaporanBulanan() {
    document.getElementById('content').innerHTML = '<div class="text-center mt-5"><div class="spinner-border text-warning"></div><br>Mengunduh Laporan Mingguan/Bulanan...</div>';
    panggilServer("?action=getLaporanBulanan", function(dataLaporan) {
      // Jika data dibungkus dalam objek laporan
      let listLog = dataLaporan.laporan || dataLaporan || [];
      if (listLog.length === 0) {
        alert("Tidak ada data laporan terkini di tab Laporan.");
        load();
        return;
      }
      let total = 0;
      let baris = "";
      listLog.forEach(log => {
        if(log.pemasukan || log[3]) {
          let tgl = log.tanggal || log[0];
          let nPS = log.noPS || log[1];
          let uang = parseFloat(log.pemasukan) || parseFloat(log[3]) || 0;
          total += uang;
          baris += '<tr><td>' + tgl + ' - ' + nPS + '</td><td style="text-align: right;">Rp ' + uang.toLocaleString('id-ID') + '</td></tr>';
        }
      });
 
      const winLaporan = window.open("", "_blank");
      winLaporan.document.write('<html><head><title>Laporan</title><style>body{font-family:monospace;width:52mm;font-size:10px;margin:0;padding:4px;}table{width:100%;font-size:9px;}.line{border-top:1px dashed #000;margin:5px 0;}</style></head><body><div style="text-align:center;"><b>REKAP OMSET BULANAN</b></div><div class="line"></div><table> ' + baris + '</table><div class="line"></div><table><tr><td><b>TOTAL</b></td><td style="text-align:right;"><b>Rp ' + total.toLocaleString('id-ID') + '</b></td></tr></table></body></html>');
      winLaporan.document.close();
      setTimeout(function(){ winLaporan.print(); winLaporan.close(); load(); }, 300);
    });
  }
 
  function stop(id) {
    if (confirm("Selesaikan sesi " + id + " dan simpan laporan?")) {
      document.getElementById('content').innerHTML = '<div class="text-center mt-5"><div class="spinner-border text-danger"></div><br>Menyimpan Omset & Mereset Station...</div>';
      panggilServer(`?action=resetPS&id=${id}`, load);
    }
  }
 
  window.onload = load;
</script>
</body>
</html>
