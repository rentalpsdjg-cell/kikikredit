<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiki Kredit Solution</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; font-family: system-ui, -apple-system, sans-serif; }
    .navbar-custom { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; }
    .card-stats { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .table-container { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .badge-aktif { background-color: #e3f2fd; color: #0d6efd; }
    .badge-lunas { background-color: #e8f5e9; color: #2e7d32; }
    .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.85); display: flex; justify-content: center; align-items: center; z-index: 9999; display: none; }
  </style>
</head>
<body>

  <div id="loading" class="loading-overlay">
    <div class="text-center">
      <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
      <p class="mt-2 fw-bold">Menghubungkan ke Server...</p>
    </div>
  </div>

  <nav class="navbar navbar-custom shadow-sm mb-4">
    <div class="container"><span class="navbar-brand mb-0 h1 text-white"><i class="fa-solid fa-wallet me-2"></i> Kiki Kredit Solution</span></div>
  </nav>

  <div class="container mb-5">
    <div class="row mb-4">
      <div class="col-md-6 mb-3">
        <div class="card card-stats bg-white p-4 d-flex flex-row align-items-center justify-content-between">
          <div>
            <h6 class="text-muted text-uppercase mb-1" style="font-size: 0.8rem;">Total Piutang Aktif</h6>
            <h3 class="fw-bold text-primary mb-0" id="statTotalPiutang">Rp 0</h3>
          </div>
          <div class="bg-primary bg-opacity-10 p-3 rounded-circle text-primary"><i class="fa-solid fa-money-bill-wave fa-2xl"></i></div>
        </div>
      </div>
      <div class="col-md-6 mb-3">
        <div class="card card-stats bg-white p-4 d-flex flex-row align-items-center justify-content-between">
          <div>
            <h6 class="text-muted text-uppercase mb-1" style="font-size: 0.8rem;">Pelanggan Aktif</h6>
            <h3 class="fw-bold text-success mb-0" id="statPelangganAktif">0 Orang</h3>
          </div>
          <div class="bg-success bg-opacity-10 p-3 rounded-circle text-success"><i class="fa-solid fa-users fa-2xl"></i></div>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="fw-bold text-secondary mb-0"><i class="fa-solid fa-list me-2"></i> Manajer Kredit</h4>
      <button class="btn btn-primary" onclick="bukaModalForm()"><i class="fa-solid fa-user-plus me-1"></i> Tambah Baru</button>
    </div>

    <div class="table-container">
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th>Nama</th>
              <th>Alamat</th>
              <th>Barang</th>
              <th>Total</th>
              <th>Tenor</th>
              <th>Cicilan</th>
              <th>Sisa Utang</th>
              <th>Status</th>
              <th class="text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="tabelPelanggan"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modalForm" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="modalFormTitle">Form Pelanggan</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="formPelanggan" onsubmit="prosesSimpanData(event)">
          <div class="modal-body">
            <input type="hidden" id="formRowNum">
            <div class="mb-3"><label class="form-label fw-semibold">Nama</label><input type="text" id="formNama" class="form-control" required></div>
            <div class="mb-3"><label class="form-label fw-semibold">Alamat</label><input type="text" id="formAlamat" class="form-control" required></div>
            <div class="mb-3"><label class="form-label fw-semibold">Barang</label><input type="text" id="formBarang" class="form-control" required></div>
            <div class="row">
              <div class="col-6 mb-3"><label class="form-label fw-semibold">Total Harga</label><input type="number" id="formTotalHarga" class="form-control" required oninput="sinkronSisaUtang()"></div>
              <div class="col-6 mb-3"><label class="form-label fw-semibold">Sisa Utang</label><input type="number" id="formSisaUtang" class="form-control" required></div>
            </div>
            <div class="row">
              <div class="col-6 mb-3">
                <label class="form-label fw-semibold">Tipe</label>
                <select id="formTipeTenor" class="form-select"><option value="Bulanan">Bulanan</option><option value="Mingguan">Mingguan</option><option value="Harian">Harian</option></select>
              </div>
              <div class="col-6 mb-3"><label class="form-label fw-semibold">Tenor (kali)</label><input type="number" id="formTenor" class="form-control" required></div>
            </div>
          </div>
          <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button><button type="submit" class="btn btn-primary">Simpan</button></div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modalBayar" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title fw-bold">Bayar</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <form id="formBayar" onsubmit="prosesBayarManual(event)">
          <div class="modal-body">
            <input type="hidden" id="bayarRowNum">
            <div class="mb-2"><label class="form-label text-muted">Pelanggan</label><input type="text" id="bayarNama" class="form-control-plaintext fw-bold text-primary p-0" readonly></div>
            <div class="mb-3"><label class="form-label fw-semibold">Nominal Pembayaran (Rp)</label><input type="number" id="bayarNominal" class="form-control form-control-lg" required></div>
          </div>
          <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button><button type="submit" class="btn btn-success">Bayar</button></div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    // URL API Google Apps Script milik Anda
    const API_URL = "https://script.google.com/macros/s/AKfycbzeWIBiIVGYMmLNi-OLD2TkhbX1ab1LDpY4uMTjEGEojHRjtiu1ElqO72bnZWYHoug/exec";

    let listPelanggan = [];
    const bootstrapModalForm = new bootstrap.Modal(document.getElementById('modalForm'));
    const bootstrapModalBayar = new bootstrap.Modal(document.getElementById('modalBayar'));

    document.addEventListener("DOMContentLoaded", muatDataDashboard);

    function tunjukkanLoading(show) { document.getElementById('loading').style.display = show ? 'flex' : 'none'; }
    function formatRupiah(angka) { return "Rp " + Number(angka).toLocaleString('id-ID'); }
    function sinkronSisaUtang() { if(!document.getElementById('formRowNum').value) document.getElementById('formSisaUtang').value = document.getElementById('formTotalHarga').value; }

    function muatDataDashboard() {
      tunjukkanLoading(true);
      fetch(`${API_URL}?action=ambilData`)
        .then(res => res.json())
        .then(res => {
          tunjukkanLoading(false);
          if (res.error) return Swal.fire("Error", res.error, "error");
          
          listPelanggan = res.pelanggan;
          document.getElementById('statTotalPiutang').innerText = formatRupiah(res.stats.totalPiutang);
          document.getElementById('statPelangganAktif').innerText = res.stats.aktif + " Orang";
          
          const tbody = document.getElementById('tabelPelanggan');
          tbody.innerHTML = listPelanggan.length === 0 ? '<tr><td colspan="9" class="text-center text-muted">Tidak ada data.</td></tr>' : '';
          
          listPelanggan.forEach(p => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td class="fw-bold">${p.nama}</td>
              <td><small>${p.alamat}</small></td>
              <td>${p.barang}</td>
              <td>${formatRupiah(p.total)}</td>
              <td><small>${p.tenor}x (${p.tipe})</small></td>
              <td class="text-center">${p.cicilanKe}</td>
              <td class="fw-bold text-danger">${formatRupiah(p.sisa)}</td>
              <td><span class="badge ${p.status === 'AKTIF' ? 'badge-aktif' : 'badge-lunas'}">${p.status}</span></td>
              <td class="text-center">
                <button class="btn btn-sm btn-success me-1" ${p.status !== 'AKTIF'?'disabled':''} onclick="bukaModalBayar(${p.rowNum}, '${p.nama}')"><i class="fa-solid fa-hand-holding-dollar"></i></button>
                <button class="btn btn-sm btn-outline-primary me-1" onclick="bukaModalForm(${p.rowNum})"><i class="fa-solid fa-pen-to-square"></i></button>
                <button class="btn btn-sm btn-outline-danger" onclick="prosesHapusData(${p.rowNum})"><i class="fa-solid fa-trash"></i></button>
              </td>`;
            tbody.appendChild(tr);
          });
        }).catch(err => { tunjukkanLoading(false); Swal.fire("Error", "Gagal load data. Pastikan API Apps Script Aktif.", "error"); });
    }

    function bukaModalForm(rowNum = null) {
      document.getElementById('formPelanggan').reset();
      document.getElementById('formRowNum').value = rowNum || '';
      document.getElementById('modalFormTitle').innerText = rowNum ? "Edit Pelanggan" : "Tambah Pelanggan";
      if(rowNum) {
        const p = listPelanggan.find(i => i.rowNum === rowNum);
        if(p) {
          document.getElementById('formNama').value = p.nama; document.getElementById('formAlamat').value = p.alamat;
          document.getElementById('formBarang').value = p.barang; document.getElementById('formTotalHarga').value = p.total;
          document.getElementById('formSisaUtang').value = p.sisa; document.getElementById('formTipeTenor').value = p.tipe;
          document.getElementById('formTenor').value = p.tenor;
        }
      }
      bootstrapModalForm.show();
    }

    function prosesSimpanData(e) {
      e.preventDefault();
      const payload = {
        action: "simpanData",
        data: {
          rowNum: document.getElementById('formRowNum').value, nama: document.getElementById('formNama').value,
          alamat: document.getElementById('formAlamat').value, barang: document.getElementById('formBarang').value,
          totalHarga: document.getElementById('formTotalHarga').value, sisaUtang: document.getElementById('formSisaUtang').value,
          tipeTenor: document.getElementById('formTipeTenor').value, tenor: document.getElementById('formTenor').value
        }
      };
      bootstrapModalForm.hide(); tunjukkanLoading(true);
      irimKeApi(payload);
    }

    function bukaModalBayar(rowNum, nama) {
      document.getElementById('formBayar').reset();
      document.getElementById('bayarRowNum').value = rowNum;
      document.getElementById('bayarNama').value = nama;
      bootstrapModalBayar.show();
    }

    function prosesBayarManual(e) {
      e.preventDefault();
      const payload = {
        action: "bayarManual",
        rowNum: document.getElementById('bayarRowNum').value,
        nominal: document.getElementById('bayarNominal').value
      };
      bootstrapModalBayar.hide(); tunjukkanLoading(true);
      
      fetch(API_URL, { method: "POST", body: JSON.stringify(payload) })
        .then(res => res.json())
        .then(res => {
          if(res.error) { tunjukkanLoading(false); return Swal.fire("Gagal", res.error, "error"); }
          tunjukkanLoading(false);
          Swal.fire("Sukses", "Pembayaran tercatat. Unduhan slip dimulai.", "success");
          
          const a = document.createElement("a");
          a.href = "data:application/pdf;base64," + res.pdf;
          a.download = "Slip_" + res.hasilBayar.nama.replace(/\s+/g, '_') + ".pdf";
          a.click();
          muatDataDashboard();
        }).catch(() => { tunjukkanLoading(false); Swal.fire("Error", "Gagal memproses transaksi.", "error"); });
    }

    function prosesHapusData(rowNum) {
      Swal.fire({ title: "Hapus permanen?", text: "Data tidak bisa dikembalikan!", icon: "warning", showCancelButton: true, confirmButtonColor: "#d33", confirmButtonText: "Ya, Hapus!" }).then((result) => {
        if (result.isConfirmed) {
          tunjukkanLoading(true);
          irimKeApi({ action: "hapusData", rowNum: rowNum });
        }
      });
    }

    function irimKeApi(payload) {
      fetch(API_URL, { method: "POST", body: JSON.stringify(payload) })
        .then(res => res.json())
        .then(pesan => { tunjukkanLoading(false); Swal.fire("Berhasil", typeof pesan === 'string' ? pesan : "Selesai!", "success"); muatDataDashboard(); })
        .catch(() => { tunjukkanLoading(false); Swal.fire("Error", "Gagal mengirim data ke server.", "error"); });
    }
  </script>
</body>
</html>
