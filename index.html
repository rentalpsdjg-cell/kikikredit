<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kiki Kredit Solution - Ultra Modern Bold</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <style>
    /* ============================================================
       1. INTERFACE LAYAR HP KASIR (SUPER MODERN PREMIUM DARK)
       ============================================================ */
    body { 
      background: #0f172a; /* Latar belakang gelap premium murni */
      color: #f1f5f9;
      padding: 10px; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    /* Area struk dibuat transparan, teks hitam pekat murni */
    .thermal-pure-text {
      background: transparent;
      max-width: 360px;
      margin: 15px auto;
      padding: 5px;
      box-sizing: border-box;
    }

    .app-card {
      background: #1e293b; /* Kartu gelap modern */
      border-radius: 16px;
      max-width: 450px;
      margin: 0 auto 15px auto;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1px solid #334155;
    }

    .form-control-custom {
      background: #0f172a !important;
      color: #ffffff !important;
      border-radius: 10px;
      font-size: 16px;
      border: 2px solid #475569;
      padding: 14px;
      height: auto;
      margin-bottom: 12px;
      font-weight: bold;
    }
    .form-control-custom:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }

    .btn-action {
      font-size: 13px;
      font-weight: 900;
      padding: 12px 8px;
      border-radius: 8px;
      margin: 3px;
      flex: 1;
      text-align: center;
      border: none;
      text-transform: uppercase;
    }

    #overlay { 
      display: none; 
      position: fixed; 
      top: 0; left: 0; width: 100%; height: 100%; 
      background: rgba(15, 23, 42, 0.95); 
      z-index: 9999; 
      justify-content: center; 
      align-items: center; 
      flex-direction: column; 
    }

    /* ============================================================
       2. ARSITEKTUR STRUK INLINE VERTICAL (MODERN, TEBAL, IRIT KERTAS)
       ============================================================ */
    .nota-container {
      width: 100%;
      color: #000000 !important; /* Wajib hitam pekat untuk cetak thermal */
      font-family: 'Courier New', Courier, monospace; 
      font-size: 23px; /* Ukuran font raksasa anti sakit mata */
      font-weight: 900; /* Ketebalan maksimal */
      line-height: 1.2;
      background: transparent !important;
    }
    
    .nota-header { 
      text-align: center; 
      font-size: 26px; 
      font-weight: 900;
      line-height: 1.1; 
      margin-bottom: 8px; 
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .nota-garis { 
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      margin: 3px 0; 
      font-size: 23px;
      font-weight: 900;
    }
    .nota-garis::after {
      content: "----------------------"; 
      display: block;
    }
    
    /* Format baru: Label dan isi mengalir rapat ke atas, tidak boros spasi baris */
    .nota-item-group {
      margin-bottom: 5px;
      word-break: break-all;
    }
    
    /* Teks tebal sejajar */
    .nota-label {
      font-weight: 900;
      text-transform: uppercase;
      display: inline;
    }
    
    .nota-value {
      font-weight: 900;
      display: inline;
    }
    
    .nota-footer {
      text-align: center;
      font-size: 19px; 
      margin-top: 12px;
      line-height: 1.2;
      font-weight: 900;
    }

    /* ============================================================
       3. HARDWARE TUNING ENGINE FOR MP58-LITE
       ============================================================ */
    @media print {
      body { 
        background: #ffffff !important; 
        color: #000000 !important;
        padding: 0 !important; 
      }
      .app-card, #overlay, .no-print { 
        display: none !important; 
      }
      
      @page { 
        size: auto; 
        margin: 0mm !important; 
      }
      
      .thermal-pure-text {
        box-shadow: none !important;
        background: transparent !important;
        margin: 0 !important;
        padding: 4mm 1mm !important;
        width: 100% !important;
        max-width: 100% !important;
      }

      .nota-container {
        font-size: 22px !important; /* Mengunci ketebalan font saat print fisik */
        background: transparent !important;
      }
      .nota-header {
        font-size: 25px !important;
      }
      .nota-footer {
        font-size: 18px !important;
      }
    }
  </style>
</head>
<body>

  <div id="overlay">
    <div class="spinner-border text-info" role="status" style="width: 3.5rem; height: 3.5rem;"></div>
    <b class="mt-4 h5 text-info" style="letter-spacing: 1px;">SINKRONISASI SERVER...</b>
  </div>

  <div class="app-card border-0 py-4 text-center shadow no-print" style="background: linear-gradient(135deg, #0284c7, #0369a1) !important;">
    <h3 class="font-weight-bold mb-1 text-white">KIKI KREDIT OS</h3>
    <span class="badge badge-warning font-weight-bold px-3 py-2 mt-2" id="statInfo" style="font-size: 13px;">Menghubungkan ke Cloud...</span>
  </div>

  <div class="thermal-pure-text">
    <div class="nota-container">
      <div class="nota-header">KIKI KREDIT<br>SOLUTION</div>
      
      <div class="nota-garis"></div>
      
      <div class="nota-item-group"><div class="nota-label">TGL: </div><div class="nota-value" id="pTgl">-</div></div>
      <div class="nota-item-group"><div class="nota-label">NAM: </div><div class="nota-value" id="pNama">-</div></div>
      <div class="nota-item-group"><div class="nota-label">BRG: </div><div class="nota-value" id="pBrg">-</div></div>
      
      <div class="nota-garis"></div>
      
      <div class="nota-item-group"><div class="nota-label">BYR: </div><div class="nota-value" id="pBayar">Rp 0</div></div>
      <div class="nota-item-group"><div class="nota-label">SIS: </div><div class="nota-value" id="pSisa">Rp 0</div></div>
      
      <div class="nota-garis"></div>
      
      <div class="nota-footer">
        *** TERIMA KASIH ***<br>
        BUKTI PEMBAYARAN SAH.
      </div>
    </div>
  </div>

  <div class="app-card no-print">
    <h5 id="formTitle" class="text-info font-weight-bold mb-4"><i class="fas fa-user-plus mr-2"></i>Registrasi Pelanggan</h5>
    <input type="hidden" id="editRowNum">
    <input type="text" id="nama" class="form-control form-control-custom" placeholder="Nama Pelanggan">
    <input type="text" id="alamat" class="form-control form-control-custom" placeholder="Alamat Rumah">
    <input type="text" id="barang" class="form-control form-control-custom" placeholder="Nama Barang">
    
    <div class="form-row">
      <div class="col-7"><input type="number" id="harga" class="form-control form-control-custom" placeholder="Harga Total (Rp)" oninput="autoIsiSisa()"></div>
      <div class="col-5"><input type="number" id="tenor" class="form-control form-control-custom" placeholder="Tenor"></div>
    </div>
    
    <div class="form-row">
      <div class="col-7"><input type="number" id="sisaUtang" class="form-control form-control-custom" placeholder="Sisa Utang"></div>
      <div class="col-5">
        <select id="tipeTenor" class="form-control form-control-custom" style="padding: 10px;">
          <option value="Bulanan">Bulanan</option>
          <option value="Mingguan">Mingguan</option>
        </select>
      </div>
    </div>
    
    <button id="btnSimpan" onclick="simpan()" class="btn btn-info btn-block font-weight-bold py-3 shadow" style="border-radius:12px; background: #0284c7; border:none; font-size: 16px; letter-spacing: 1px;">SIMPAN DATA TRANSAKSI</button>
    <button onclick="resetForm()" class="btn btn-outline-secondary btn-block btn-sm mt-3 text-muted" style="border-radius:8px; padding: 10px; font-weight: bold;">BATAL / CLEAN FORM</button>
  </div>

  <div class="app-card no-print">
    <div class="input-group mb-3">
      <div class="input-group-prepend"><span class="input-group-text bg-transparent border-right-0" style="border-color:#475569;"><i class="fas fa-search text-muted"></i></span></div>
      <input type="text" id="cariInput" class="form-control border-left-0 form-control-custom mb-0" placeholder="Ketik nama untuk mencari..." onkeyup="filterTabel()">
    </div>
    
    <div style="max-height: 380px; overflow-y: auto;">
      <table class="table table-sm table-dark table-hover mb-0" style="background: transparent;">
        <tbody id="tabelBody">
          <tr><td class="text-center py-4 text-muted">Menarik data cloud database...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzrL3ITJ4yHhqblHlEjxQlRv0bQGTk_TYmmqlkBbS6Dk323XE78_jwkB920a4-aB4hb/exec";
  let dataStorage = [];

  function autoIsiSisa() {
    let harga = document.getElementById('harga').value;
    let editRow = document.getElementById('editRowNum').value;
    if(!editRow) { document.getElementById('sisaUtang').value = harga; }
  }

  function muatData() {
    document.getElementById('overlay').style.display = 'flex';
    fetch(SCRIPT_URL + "?aksi=ambilData")
    .then(res => res.text())
    .then(textData => {
      let data = JSON.parse(textData);
      dataStorage = data.pelanggan || [];
      
      let totalPiutang = data.stats && data.stats.totalPiutang ? data.stats.totalPiutang : 0;
      let aktif = data.stats && data.stats.aktif ? data.stats.aktif : 0;
      document.getElementById('statInfo').innerText = "Total Piutang: Rp " + totalPiutang.toLocaleString('id-ID') + " | Aktif: " + aktif;
      
      let html = "";
      dataStorage.forEach(p => {
        let namaPel = p.nama || "-";
        let barangPel = p.barang || "-";
        let sisaPel = p.sisa || 0;
        let row = p.rowNum;

        html += `<tr class="border-bottom" style="border-color: #334155 !important;">
          <td class="py-3">
            <div class="d-flex justify-content-between mb-1">
              <span class="text-white font-weight-bold" style="font-size:16px; letter-spacing:0.5px;">${namaPel.toUpperCase()}</span>
              <span class="text-warning font-weight-bold" style="font-size:15px;">Rp ${Number(sisaPel).toLocaleString('id-ID')}</span>
            </div>
            <small class="text-muted d-block mb-3" style="font-size:13px;">Barang: ${barangPel} | Tenor: ${p.tenor}x (${p.tipe})</small>
            <div class="d-flex">
              <button onclick="bayar(${row})" class="btn-action btn-success"><i class="fas fa-money-bill-wave mr-1"></i> Angsur</button>
              <button onclick="eksekusiCetakLangsung(${row})" class="btn-action btn-info" style="background-color: #0284c7;"><i class="fas fa-print mr-1"></i> CETAK</button>
              <button onclick="pindahKeEdit(${row})" class="btn-action btn-warning text-dark"><i class="fas fa-edit mr-1"></i> Edit</button>
              <button onclick="hapus(${row})" class="btn-action btn-danger"><i class="fas fa-trash"></i></button>
            </div>
          </td>
        </tr>`;
      });
      document.getElementById('tabelBody').innerHTML = html || "<tr><td class='text-center text-muted py-3'>Tidak ada data</td></tr>";
      document.getElementById('overlay').style.display = 'none';
    }).catch(() => { document.getElementById('overlay').style.display = 'none'; });
  }

  function simpan() {
    let hargaInput = document.getElementById('harga').value;
    let sisaInput = document.getElementById('sisaUtang').value;
    let data = {
      rowNum: document.getElementById('editRowNum').value,
      nama: document.getElementById('nama').value,
      alamat: document.getElementById('alamat').value,
      barang: document.getElementById('barang').value,
      totalHarga: hargaInput,
      tipeTenor: document.getElementById('tipeTenor').value,
      tenor: document.getElementById('tenor').value,
      sisaUtang: sisaInput ? sisaInput : hargaInput
    };
    if(!data.nama || !data.totalHarga) return alert("Nama dan Harga wajib diisi!");
    document.getElementById('overlay').style.display = 'flex';
    fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ aksi: "simpan", data: data }) })
    .then(res => res.text()).then(textData => { 
      alert(JSON.parse(textData)); 
      resetForm(); 
      muatData(); 
    });
  }

  function bayar(rowNum) {
    let nominal = prompt("Masukkan jumlah angsuran pembayaran (Rp):");
    if(!nominal) return;
    document.getElementById('overlay').style.display = 'flex';
    fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ aksi: "bayar", rowNum: rowNum, nominal: nominal }) })
    .then(res => res.text()).then(textData => {
      let res = JSON.parse(textData);
      document.getElementById('pTgl').innerText = res.tgl;
      document.getElementById('pNama').innerText = res.nama.toUpperCase();
      document.getElementById('pBrg').innerText = res.barang.toUpperCase();
      document.getElementById('pBayar').innerText = "Rp " + Number(res.nominal).toLocaleString('id-ID');
      document.getElementById('pSisa').innerText = "Rp " + Number(res.sisa).toLocaleString('id-ID');
      muatData();
      
      setTimeout(() => { window.print(); }, 400);
    });
  }

  function eksekusiCetakLangsung(rowNum) {
    let p = dataStorage.find(item => item.rowNum === rowNum);
    if (!p) return;
    
    document.getElementById('pTgl').innerText = new Date().toLocaleDateString('id-ID');
    document.getElementById('pNama').innerText = p.nama.toUpperCase();
    document.getElementById('pBrg').innerText = p.barang.toUpperCase();
    document.getElementById('pBayar').innerText = "CEK SISA";
    document.getElementById('pSisa').innerText = "Rp " + Number(p.sisa).toLocaleString('id-ID');
    
    setTimeout(() => { window.print(); }, 300);
  }

  function pindahKeEdit(rowNum) {
    let p = dataStorage.find(item => item.rowNum === rowNum);
    if (!p) return;
    document.getElementById('editRowNum').value = p.rowNum;
    document.getElementById('nama').value = p.nama;
    document.getElementById('alamat').value = p.alamat;
    document.getElementById('barang').value = p.barang;
    document.getElementById('harga').value = p.total;
    document.getElementById('tenor').value = p.tenor;
    document.getElementById('tipeTenor').value = p.tipe;
    document.getElementById('sisaUtang').value = p.sisa;
    document.getElementById('formTitle').innerHTML = "<i class='fas fa-edit mr-2'></i>Ubah Data: " + p.nama.toUpperCase();
    document.getElementById('btnSimpan').innerText = "PERBARUI DATA TRANSAKSI";
  }

  function resetForm() {
    document.getElementById('editRowNum').value = "";
    document.querySelectorAll('input').forEach(i => i.value = "");
    document.getElementById('formTitle').innerHTML = "<i class='fas fa-user-plus mr-2'></i>Registrasi Pelanggan";
    document.getElementById('btnSimpan').innerText = "SIMPAN DATA TRANSAKSI";
  }

  function filterTabel() {
    let input = document.getElementById("cariInput").value.toUpperCase();
    let tr = document.getElementById("tabelBody").getElementsByTagName("tr");
    for (let i = 0; i < tr.length; i++) {
      let td = tr[i].getElementsByTagName("span")[0];
      if(td) { tr[i].style.display = (td.innerText.toUpperCase().indexOf(input) > -1) ? "" : "none"; }
    }
  }

  function hapus(rowNum) {
    if(confirm("Hapus data pelanggan ini dari database cloud?")) {
      document.getElementById('overlay').style.display = 'flex';
      fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ aksi: "hapus", rowNum: rowNum }) })
      .then(res => res.text()).then(() => muatData());
    }
  }

  window.onload = muatData;
</script>
</body>
</html>
