<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiki Kredit Solution - Ultra POS v6.5</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --accent-color: #3b82f6;
      --success-color: #10b981;
      --card-radius: 20px;
    }
 
    body { 
      background: #f1f5f9; 
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #1e293b;
      margin: 0; padding: 0;
    }
 
    .navbar-custom { 
      background: var(--bg-gradient); 
      padding: 18px 0;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
 
    /* DASHBOARD CARD STATS */
    .card-stats { 
      border: none; 
      border-radius: var(--card-radius); 
      box-shadow: 0 10px 25px rgba(0,0,0,0.02); 
      background: var(--card-bg);
      border-top: 4px solid var(--accent-color);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 24px;
    }
    .card-stats:hover { transform: translateY(-4px); box-shadow: 0 15px 30px rgba(0,0,0,0.06); }
    .card-stats.success { border-top-color: var(--success-color); }
    
    /* PANEL KONTROL */
    .control-panel {
      background: var(--card-bg);
      border-radius: var(--card-radius);
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.02);
      border: 1px solid rgba(0,0,0,0.03);
    }
    .input-jumbo { 
      padding: 14px 20px; 
      border-radius: 14px !important; 
      font-size: 1rem;
      border: 2px solid #cbd5e1; 
      background-color: #f8fafc;
      transition: all 0.2s;
    }
    .input-jumbo:focus { border-color: var(--accent-color); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); background-color: #fff; }
    .btn-jumbo { 
      padding: 14px; 
      border-radius: 14px; 
      font-weight: 700; 
      font-size: 1rem;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
    }
 
    /* KARTU NASABAH LUXURY STYLE */
    .loan-card { 
      background: var(--card-bg); 
      border-radius: var(--card-radius); 
      padding: 24px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.03); 
      border: 1px solid #e2e8f0; 
      margin-bottom: 24px; 
      position: relative;
      transition: all 0.3s ease;
    }
    .loan-card:hover { transform: translateY(-4px); box-shadow: 0 16px 35px rgba(0,0,0,0.07); }
 
    .info-title { font-size: 0.75rem; color: #64748b; text-transform: uppercase; font-weight: 700; letter-spacing: 0.75px; }
    .info-desc { font-size: 1.25rem; font-weight: 800; color: #0f172a; }
    
    .progress { height: 10px; border-radius: 20px; background-color: #f1f5f9; overflow: hidden; }
 
    /* ACTION PANEL BUTTONS */
    .action-grid { 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); 
      gap: 12px; 
      margin-top: 20px; 
      padding-top: 20px; 
      border-top: 1px dashed #e2e8f0; 
    }
    .btn-action-panel { 
      padding: 12px; 
      font-weight: 700; 
      font-size: 0.9rem; 
      border-radius: 12px; 
      border: none; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 8px; 
      transition: all 0.2s ease;
    }
    .btn-action-panel:active { transform: scale(0.96); }
    
    .btn-action-panel.pay { background: #e6f4ea; color: var(--success-color); }
    .btn-action-panel.pay:hover { background: var(--success-color); color: #fff; }
    .btn-action-panel.print { background: #f1f5f9; color: #475569; }
    .btn-action-panel.print:hover { background: #cbd5e1; color: #0f172a; }
    .btn-action-panel.edit { background: #fef3c7; color: #d97706; }
    .btn-action-panel.edit:hover { background: #f59e0b; color: #fff; }
    .btn-action-panel.delete { background: #fee2e2; color: #ef4444; }
    .btn-action-panel.delete:hover { background: #ef4444; color: #fff; }
    .btn-action-panel:disabled { background: #f1f5f9 !important; color: #94a3b8 !important; cursor: not-allowed; transform: none; }
 
    .loading-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(8px);
      display: flex; justify-content: center; align-items: center; 
      z-index: 9999; display: none; 
    }
  </style>
</head>
<body>

  <div id="app-body-wrapper">
    <div id="loading" class="loading-overlay">
      <div class="bg-white p-4 rounded-4 shadow-lg text-center" style="max-width: 280px;">
        <div class="spinner-border text-primary" role="status" style="width: 2.5rem; height: 2.5rem;"></div>
        <p class="mt-3 fw-bold text-secondary mb-0">Sinkronisasi Database Cloud...</p>
      </div>
    </div>
   
    <nav class="navbar navbar-custom mb-4">
      <div class="container">
        <span class="navbar-brand mb-0 h1 text-white fw-bold fs-4">
          <i class="fa-solid fa-bolt text-warning me-2"></i> Kiki Kredit <span class="badge bg-primary fs-6 ms-2 fw-bold">v6.5 Raw Injection</span>
        </span>
      </div>
    </nav>
   
    <div class="container mb-5">
      <div class="row mb-4 g-3">
        <div class="col-6">
          <div class="card card-stats h-100">
            <span class="info-title">Total Outstanding</span>
            <h2 class="fw-bold text-primary mb-0 mt-1" id="statTotalPiutang" style="font-size: calc(1.2rem + 0.6vw);">Rp 0</h2>
          </div>
        </div>
        <div class="col-6">
          <div class="card card-stats success h-100">
            <span class="info-title">Konsumen Aktif</span>
            <h2 class="fw-bold text-success mb-0 mt-1" id="statPelangganAktif" style="font-size: calc(1.2rem + 0.6vw);">0 Jiwa</h2>
          </div>
        </div>
      </div>
   
      <div class="control-panel mb-4">
        <div class="row g-3">
          <div class="col-12 col-md-8">
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 px-3"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
              <input type="text" id="inputCari" class="form-control input-jumbo border-start-0" placeholder="Cari nama, alamat atau tipe barang..." oninput="filterDataSistem()">
            </div>
          </div>
          <div class="col-12 col-md-4">
            <button class="btn btn-primary btn-jumbo w-100 shadow-sm" onclick="bukaModalForm()">
              <i class="fa-solid fa-plus me-1"></i> Daftarkan Kredit Baru
            </button>
          </div>
        </div>
      </div>
   
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold text-dark mb-0"><i class="fa-solid fa-folder-open text-secondary me-2"></i> Koleksi Berkas</h5>
        <span class="badge bg-dark px-3 py-2 rounded-3" id="lblInfoCount">Data Ter-Load: 0</span>
      </div>
      
      <div id="containerDataKonsumen" class="row"></div>
    </div>
   
    <div class="modal fade" id="modalForm" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 border-0 shadow-lg">
          <div class="modal-header border-bottom-0 pt-4 px-4">
            <h5 class="modal-title fw-bold text-dark" id="modalFormTitle">Form Berkas</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <form id="formPelanggan" onsubmit="prosesSimpanData(event)">
            <div class="modal-body px-4">
              <input type="hidden" id="formRowNum">
              <div class="mb-3">
                <label class="form-label fw-bold small text-muted">Nama Lengkap Konsumen</label>
                <input type="text" id="formNama" class="form-control form-control-lg rounded-3" required>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold small text-muted">Alamat Domisili KTP</label>
                <input type="text" id="formAlamat" class="form-control form-control-lg rounded-3" required>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold small text-muted">Deskripsi Barang Kredit</label>
                <input type="text" id="formBarang" class="form-control form-control-lg rounded-3" required>
              </div>
              <div class="row">
                <div class="col-6 mb-3">
                  <label class="form-label fw-bold small text-muted">Harga Pokok (Rp)</label>
                  <input type="number" id="formTotalHarga" class="form-control form-control-lg rounded-3" required oninput="sinkronSisaUtang()">
                </div>
                <div class="col-6 mb-3">
                  <label class="form-label fw-bold small text-muted">Sisa Pokok (Rp)</label>
                  <input type="number" id="formSisaUtang" class="form-control form-control-lg rounded-3" required>
                </div>
              </div>
              <div class="row">
                <div class="col-6 mb-3">
                  <label class="form-label fw-bold small text-muted">Skema Periode</label>
                  <select id="formTipeTenor" class="form-select form-select-lg rounded-3">
                    <option value="Bulanan">Bulanan</option>
                    <option value="Mingguan">Mingguan</option>
                    <option value="Harian">Harian</option>
                  </select>
                </div>
                <div class="col-6 mb-3">
                  <label class="form-label fw-bold small text-muted">Tenor Batas Waktu</label>
                  <input type="number" id="formTenor" class="form-control form-control-lg rounded-3" required>
                </div>
              </div>
            </div>
            <div class="modal-footer border-top-0 pb-4 px-4">
              <button type="button" class="btn btn-light rounded-3" data-bs-dismiss="modal">Tutup Berkas</button>
              <button type="submit" class="btn btn-primary px-4 rounded-3 fw-bold">Otorisasi Data</button>
            </div>
          </form>
        </div>
      </div>
    </div>
   
    <div class="modal fade" id="modalBayar" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content rounded-4 border-0 shadow-lg">
          <div class="modal-header border-bottom-0 pt-4 px-4">
            <h5 class="modal-title fw-bold text-dark">Validasi Kasir</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <form id="formBayar" onsubmit="prosesBayarManual(event)">
            <div class="modal-body px-4">
              <input type="hidden" id="bayarRowNum">
              <div class="mb-3">
                <label class="form-label small text-muted d-block mb-0">Nama Terkait</label>
                <input type="text" id="bayarNama" class="form-control-plaintext fw-bold text-primary fs-5 p-0" readonly>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold small text-muted">Nominal Angsuran (Rp)</label>
                <input type="number" id="bayarNominal" class="form-control form-control-lg rounded-3 text-success fw-bold fs-4" required placeholder="0">
              </div>
            </div>
            <div class="modal-footer border-top-0 pb-4 px-4">
              <button type="button" class="btn btn-light rounded-3" data-bs-dismiss="modal">Batal</button>
              <button type="submit" class="btn btn-success w-100 rounded-3 fw-bold py-2">Posting Pembayaran</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
 
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzeWIBiIVGYMmLNi-OLD2TkhbX1ab1LDpY4uMTjEGEojHRjtiu1ElqO72bnZWYHoug/exec";
 
    let listPelanggan = [];
    const bootstrapModalForm = new bootstrap.Modal(document.getElementById('modalForm'));
    const bootstrapModalBayar = new bootstrap.Modal(document.getElementById('modalBayar'));
 
    document.addEventListener("DOMContentLoaded", muatDataDashboard);
 
    function tunukkanLoading(show) { document.getElementById('loading').style.display = show ? 'flex' : 'none'; }
    function formatRupiah(angka) { return "Rp " + Number(angka).toLocaleString('id-ID'); }
    function sinkronSisaUtang() { if(!document.getElementById('formRowNum').value) document.getElementById('formSisaUtang').value = document.getElementById('formTotalHarga').value; }
 
    function muatDataDashboard() {
      tunukkanLoading(true);
      fetch(`${API_URL}?action=ambilData`)
        .then(res => res.json())
        .then(res => {
          tunukkanLoading(false);
          if (res.error) return Swal.fire("Sistem Error", res.error, "error");
          listPelanggan = res.pelanggan || [];
          document.getElementById('statTotalPiutang').innerText = formatRupiah(res.stats.totalPiutang);
          document.getElementById('statPelangganAktif').innerText = res.stats.aktif + " Orang";
          document.getElementById('lblInfoCount').innerText = "Data Ter-Load: " + listPelanggan.length;
          renderDataKeSistemGrid(listPelanggan);
        }).catch(() => { tunukkanLoading(false); Swal.fire("Koneksi Putus", "Gagal memproses konektivitas API.", "error"); });
    }
 
    function renderDataKeSistemGrid(dataArray) {
      const container = document.getElementById('containerDataKonsumen');
      container.innerHTML = dataArray.length === 0 ? '<div class="col-12 text-center text-muted py-5 card bg-white border-0 shadow-sm">Pencarian tidak menemukan berkas data.</div>' : '';
      
      dataArray.forEach(p => {
        const totalHarga = Number(p.total) || 1;
        const sisaUtang = Number(p.sisa) || 0;
        const persentaseTerbayar = Math.min(100, Math.max(0, ((totalHarga - sisaUtang) / totalHarga) * 100));
 
        const divCol = document.createElement('div');
        divCol.className = "col-12 col-md-6 col-lg-4";
        divCol.innerHTML = `
          <div class="loan-card">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <div style="max-width: 70%;">
                <span class="info-title d-block">Nama Nasabah</span>
                <span class="info-desc text-truncate d-block">${p.nama}</span>
              </div>
              <span class="badge ${p.status === 'AKTIF' ? 'bg-primary' : 'bg-success'} px-3 py-2 rounded-pill fw-bold">${p.status}</span>
            </div>
            <div class="text-muted small mb-3"><i class="fa-solid fa-location-dot text-danger me-1"></i> ${p.alamat}</div>
            <div class="p-3 bg-light rounded-3 mb-3" style="font-size: 0.9rem;">
              <div class="row g-2">
                <div class="col-6"><span class="info-title d-block">Barang</span><span class="fw-bold">${p.barang}</span></div>
                <div class="col-6"><span class="info-title d-block">Total Kontrak</span><span class="fw-bold">${formatRupiah(p.total)}</span></div>
                <div class="col-6 mt-2"><span class="info-title d-block">Tenor</span><span class="fw-bold">Ke-${p.cicilanKe} <span class="text-muted fw-normal">/ ${p.tenor}x</span></span></div>
                <div class="col-6 mt-2"><span class="info-title d-block">Sisa Utang</span><span class="fw-bold text-danger">${formatRupiah(p.sisa)}</span></div>
              </div>
              <div class="mt-3">
                <div class="d-flex justify-content-between small text-muted mb-1 fw-bold" style="font-size: 0.7rem;">
                  <span>RASIO PELUNASAN</span><span>${persentaseTerbayar.toFixed(0)}%</span>
                </div>
                <div class="progress">
                  <div class="progress-bar ${p.status === 'LUNAS' ? 'bg-success' : 'bg-primary'}" role="progressbar" style="width: ${persentaseTerbayar}%"></div>
                </div>
              </div>
            </div>
            <div class="action-grid">
              <button class="btn-action-panel pay" ${p.status !== 'AKTIF'?'disabled':''} onclick="bukaModalBayar(${p.rowNum}, '${p.nama}')"><i class="fa-solid fa-cash-register"></i> Kasir</button>
              <button class="btn-action-panel print" onclick="cetakUrangStruk(${p.rowNum})"><i class="fa-solid fa-print"></i> Struk</button>
              <button class="btn-action-panel edit" onclick="bukaModalForm(${p.rowNum})"><i class="fa-solid fa-pen-to-square"></i> Ubah</button>
              <button class="btn-action-panel delete" onclick="prosesHapusData(${p.rowNum})"><i class="fa-solid fa-trash"></i> Hapus</button>
            </div>
          </div>
        `;
        container.appendChild(divCol);
      });
    }
 
    function filterDataSistem() {
      const kataKunci = document.getElementById('inputCari').value.toLowerCase().trim();
      const hasilFilter = listPelanggan.filter(p => 
        (p.nama && p.nama.toLowerCase().includes(kataKunci)) || 
        (p.alamat && p.alamat.toLowerCase().includes(kataKunci)) ||
        (p.barang && p.barang.toLowerCase().includes(kataKunci))
      );
      renderDataKeSistemGrid(hasilFilter);
    }
 
    function bukaModalForm(rowNum = null) {
      document.getElementById('formPelanggan').reset();
      document.getElementById('formRowNum').value = rowNum || '';
      document.getElementById('modalFormTitle').innerText = rowNum ? "⚙️ Perbarui Kontrak" : "👤 Daftarkan Konsumen Baru";
      if(rowNum) {
        const p = listPelanggan.find(i => i.rowNum === rowNum);
        if(p) {
          document.getElementById('formNama').value = p.nama;
          document.getElementById('formAlamat').value = p.alamat;
          document.getElementById('formBarang').value = p.barang;
          document.getElementById('formTotalHarga').value = p.total;
          document.getElementById('formSisaUtang').value = p.sisa;
          document.getElementById('formTipeTenor').value = p.tipe;
          document.getElementById('formTenor').value = p.tenor;
        }
      }
      bootstrapModalForm.show();
    }
 
    function prosesSimpanData(e) {
      e.preventDefault();
      const payload = {
        action: "simpanData",
        data: {
          rowNum: document.getElementById('formRowNum').value, 
          nama: document.getElementById('formNama').value,
          alamat: document.getElementById('formAlamat').value, 
          barang: document.getElementById('formBarang').value,
          totalHarga: document.getElementById('formTotalHarga').value, 
          sisaUtang: document.getElementById('formSisaUtang').value,
          tipeTenor: document.getElementById('formTipeTenor').value, 
          tenor: document.getElementById('formTenor').value
        }
      };
      bootstrapModalForm.hide(); tunukkanLoading(true); kirimKeApi(payload);
    }
 
    function bukaModalBayar(rowNum, nama) {
      document.getElementById('formBayar').reset();
      document.getElementById('bayarRowNum').value = rowNum;
      document.getElementById('bayarNama').value = nama;
      bootstrapModalBayar.show();
    }
 
    function prosesBayarManual(e) {
      e.preventDefault();
      const payload = {
        action: "bayarManual",
        rowNum: document.getElementById('bayarRowNum').value,
        nominal: document.getElementById('bayarNominal').value
      };
      bootstrapModalBayar.hide(); tunukkanLoading(true);
      
      fetch(API_URL, { method: "POST", body: JSON.stringify(payload) })
        .then(res => res.json())
        .then(res => {
          if(res.error) { tunukkanLoading(false); return Swal.fire("Gagal", res.error, "error"); }
          tunukkanLoading(false);
          pemicuKertasThermal(res.hasilBayar.tgl, res.hasilBayar.nama, res.hasilBayar.barang, res.hasilBayar.nominal, res.hasilBayar.sisa);
          muatDataDashboard();
        }).catch(() => { tunukkanLoading(false); Swal.fire("Kesalahan Kasir", "Gagal memproses transaksi.", "error"); });
    }
 
    function cetakUrangStruk(rowNum) {
      const p = listPelanggan.find(i => i.rowNum === rowNum);
      if (p) {
        let tglSkg = new Date().toLocaleDateString('id-ID', { year: '2-digit', month: 'numeric', day: 'numeric' });
        pemicuKertasThermal(tglSkg, p.nama, p.barang, 0, p.sisa);
      }
    }
 
    function buatBarisStruk(label, value) {
      const LEBAR_KERTAS = 26; 
      const labelStr = String(label); const valueStr = String(value);
      const sisaSpasi = LEBAR_KERTAS - (labelStr.length + valueStr.length);
      return sisaSpasi > 0 ? labelStr + " ".repeat(sisaSpasi) + valueStr + "\n" : labelStr + "\n" + " ".repeat(LEBAR_KERTAS - valueStr.length) + valueStr + "\n";
    }
 
    /* =========================================================================
       🔥 ENGINE TERBARU v6.5: DIRECT RAW-TEXT INJECTION (ANTI-BLOKIR & INSTAN)
       ========================================================================= */
    function pemicuKertasThermal(tgl, nama, barang, nominal, sisa) {
      const _nominalDisplay = nominal > 0 ? formatRupiah(nominal) : "- Re-Print -";
      
      let streamTeks = "";
      streamTeks += "   SLIP PEMBAYARAN SAH    \n";
      streamTeks += "  KIKI KREDIT SOLUTION    \n";
      streamTeks += "==========================\n"; 
      streamTeks += buatBarisStruk("Tgl:", tgl);
      streamTeks += buatBarisStruk("Nama:", nama.substring(0, 20));
      streamTeks += buatBarisStruk("Brg:", barang.substring(0, 20));
      streamTeks += "--------------------------\n";
      streamTeks += buatBarisStruk("BAYAR:", _nominalDisplay);
      streamTeks += buatBarisStruk("SISA :", formatRupiah(sisa));
      streamTeks += "--------------------------\n";
      streamTeks += "     * TERIMA KASIH * \n";
      streamTeks += "BUKTI TRANSAKSI YANG VALID"; 
 
      // Hapus sisa iframe lama jika ada
      const sisaIframe = document.getElementById('siluman-printer-v65');
      if (sisaIframe) sisaIframe.remove();
 
      // Buat sandboxing iframe baru untuk memaksa sistem HP memicu jendela print preview
      const iframe = document.createElement('iframe');
      iframe.id = 'siluman-printer-v65';
      iframe.style.position = 'fixed';
      iframe.style.bottom = '0';
      iframe.style.right = '0';
      iframe.style.width = '0px';
      iframe.style.height = '0px';
      iframe.style.border = 'none';
      document.body.appendChild(iframe);
 
      const doc = iframe.contentWindow.document;
      doc.write(`
        <html>
        <head>
          <style>
            @media print {
              html, body { margin: 0 !important; padding: 0 !important; width: 58mm !important; background: #fff; }
              @page { size: 58mm auto; margin: 0mm !important; }
              pre {
                font-family: "Courier New", Courier, monospace !important;
                font-size: 10pt !important;
                font-weight: 900 !important;
                line-height: 1.3 !important;
                color: #000 !important;
                white-space: pre !important;
                margin: 0 !important;
                padding: 2mm !important;
              }
            }
            body { margin: 0; padding: 0; background: #fff; }
            pre { font-family: "Courier New", Courier, monospace; font-size: 10pt; font-weight: 900; white-space: pre; }
          </style>
        </head>
        <body>
          <pre>${streamTeks}</pre>
        </body>
        </html>
      `);
      doc.close();
 
      // Eksekusi trigger cetak langsung ke hardware
      setTimeout(() => {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
      }, 250);
    }
 
    function prosesHapusData(rowNum) {
      Swal.fire({ 
        title: "Hapus Berkas Kontrak?", 
        icon: "warning", 
        showCancelButton: true, 
        confirmButtonColor: "#ef4444", 
        cancelButtonColor: "#64748b",
        confirmButtonText: "Ya, Hapus!" 
      }).then((result) => {
        if (result.isConfirmed) {
          tunukkanLoading(true);
          kirimKeApi({ action: "hapusData", rowNum: rowNum });
        }
      });
    }
 
    function kirimKeApi(payload) {
      fetch(API_URL, { method: "POST", body: JSON.stringify(payload) })
        .then(res => res.json())
        .then(pesan => { 
          tunukkanLoading(false); 
          Swal.fire("Berhasil", typeof pesan === 'string' ? pesan : "Sistem Berhasil Dimutasi!", "success"); 
          muatDataDashboard(); 
        })
        .catch(() => { tunukkanLoading(false); Swal.fire("Kesalahan Server", "Gagal terkoneksi ke Cloud.", "error"); });
    }
  </script>
</body>
</html>
