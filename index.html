<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiki Kredit Solution - Smart Dashboard v5 (Genius Edition)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #f1f5f9; color: #1e293b; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header-app { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #cbd5e1; padding-bottom: 15px; }
        .header-app h1 { font-size: 24px; color: #0f172a; }
        .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); border-top: 5px solid #2563eb; position: relative; }
        .card.aktif { border-top-color: #10b981; }
        .card h3 { font-size: 13px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
        .card p { font-size: 26px; font-weight: 700; color: #0f172a; }
        .action-section { background: white; padding: 20px; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); }
        .action-section h2 { margin-bottom: 15px; font-size: 16px; color: #334155; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 15px; }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; background-color: #f8fafc; transition: all 0.2s; }
        input:focus, select:focus { background-color: #fff; border-color: #2563eb; outline: 2px solid #dbeafe; }
        .smart-calc { font-size: 13px; color: #2563eb; font-weight: 600; grid-column: 1 / -1; margin-top: -5px; padding-left: 2px; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        button { padding: 10px 18px; border: none; border-radius: 6px; color: white; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: #2563eb; } .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { background: #64748b; } .btn-secondary:hover { background: #475569; }
        .btn-purple { background: #7c3aed; } .btn-purple:hover { background: #6d28d9; }
        .filter-section { display: flex; gap: 15px; margin-bottom: 15px; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 4px rgb(0 0 0 / 0.02); flex-wrap: wrap; align-items: center; }
        .search-box { flex: 1; min-width: 200px; }
        .filter-box { width: 150px; }
        .table-container { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th { background: #0f172a; color: white; padding: 14px 16px; font-weight: 600; }
        td { padding: 14px 16px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        tr:hover { background: #f8fafc; }
        .badge { padding: 4px 10px; border-radius: 9999px; font-size: 11px; font-weight: 600; display: inline-block; }
        .badge.aktif-bg { background: #dcfce7; color: #16a34a; }
        .badge.lunas-bg { background: #f1f5f9; color: #64748b; }
        .btn-table { padding: 6px 10px; font-size: 12px; border-radius: 4px; font-weight: bold; }
        .btn-pay { background: #10b981; } .btn-pay:hover { background: #059669; }
        .btn-edit { background: #f59e0b; } .btn-edit:hover { background: #d97706; }
        .btn-delete { background: #ef4444; } .btn-delete:hover { background: #dc2626; }
        .btn-print { background: #6366f1; } .btn-print:hover { background: #4f46e5; }
        .loading { text-align: center; padding: 30px; font-weight: 600; color: #64748b; font-size: 15px; }
        
        /* HIGH-PERFORMANCE PRINTER ENGINE ENVIRONMENT (COURIER MONOSPACE) */
        @media print {
            body * { display: none !important; }
            #areaCetakStruk, #areaCetakStruk * { display: block !important; visibility: visible !important; }
            #areaCetakStruk { position: absolute; left: 0; top: 0; width: 58mm; padding: 0; margin: 0; background: white; color: black; font-family: 'Courier New', Courier, monospace; font-size: 10pt; line-height: 1.2; }
            .print-center { text-align: center; font-weight: bold; }
            .print-line { border-top: 1px dashed #000; margin: 4px 0; display: block !important; height: 1px; }
            .print-double { border-top: 3px double #000; margin: 4px 0; display: block !important; height: 3px; }
            .print-row { display: flex !important; justify-content: space-between; font-weight: bold; }
            .print-row span { display: inline-block !important; }
        }
    </style>
</head>
<body>

    <div id="areaCetakStruk" style="display: none;"></div>

    <div class="container">
        <div class="header-app">
            <h1><b>Kiki Kredit Solution</b></h1>
            <button class="btn-purple" onclick="ambilData()"><b>Segarkan Data</b></button>
        </div>

        <div class="stats-container">
            <div class="card">
                <h3><b>Total Sisa Piutang</b></h3>
                <p id="totalPiutang"><b>Rp 0</b></p>
            </div>
            <div class="card aktif">
                <h3><b>Total Pelanggan Aktif</b></h3>
                <p id="pelangganAktif"><b>0 Orang</b></p>
            </div>
        </div>

        <div class="action-section">
            <h2 id="formTitle"><b>Pendaftaran Pelanggan Baru</b></h2>
            <form id="pelangganForm" onsubmit="prosesSimpanData(event)">
                <input type="hidden" id="rowNum">
                <input type="hidden" id="cicilanKe" value="0">
                
                <div class="form-grid">
                    <input type="text" id="nama" placeholder="Nama Lengkap" required>
                    <input type="text" id="alamat" placeholder="Alamat Rumah" required>
                    <input type="text" id="barang" placeholder="Nama Barang Kredit" required>
                    <input type="number" id="totalHarga" placeholder="Total Harga (Rp)" required oninput="hitungSimulasiOtomatis()">
                    <select id="tipeTenor" onchange="hitungSimulasiOtomatis()">
                        <option value="Bulanan"><b>Bulanan</b></option>
                        <option value="Mingguan"><b>Mingguan</b></option>
                        <option value="Harian"><b>Harian</b></option>
                    </select>
                    <input type="number" id="tenor" placeholder="Tenor (Sesi Kali)" required oninput="hitungSimulasiOtomatis()">
                    <input type="number" id="sisaUtang" placeholder="Sisa Utang Awal (Rp)" required>
                    
                    <div id="simulasiHasil" class="smart-calc"><b>Estimasi Angsuran: Rp 0 / sesi</b></div>
                </div>
                <div class="btn-group">
                    <button type="submit" id="btnSubmit" class="btn-primary"><b>Simpan Data</b></button>
                    <button type="button" class="btn-secondary" onclick="resetForm()"><b>Batalkan / Reset</b></button>
                </div>
            </form>
        </div>

        <div class="filter-section">
            <div class="search-box">
                <input type="text" id="inputCari" placeholder="Cari nama pelanggan atau nama barang..." oninput="jalankanFilterSmart()">
            </div>
            <div class="filter-box">
                <select id="filterStatus" onchange="jalankanFilterSmart()">
                    <option value="SEMUA"><b>Semua Status</b></option>
                    <option value="AKTIF"><b>Aktif</b></option>
                    <option value="LUNAS"><b>Lunas</b></option>
                </select>
            </div>
        </div>

        <div class="table-container">
            <div id="loadingText" class="loading"><b>Menghubungkan ke basis data Google Sheets...</b></div>
            <table id="pelangganTable" style="display: none;">
                <thead>
                    <tr>
                        <th><b>Pelanggan</b></th>
                        <th><b>Alamat</b></th>
                        <th><b>Barang</b></th>
                        <th><b>Total Kredit</b></th>
                        <th><b>Tenor</b></th>
                        <th><b>Cicilan Ke</b></th>
                        <th><b>Sisa Utang</b></th>
                        <th><b>Status</b></th>
                        <th style="width: 250px; text-align: center;"><b>Aksi</b></th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbw2msfsM4iqNn9n-9cHCf-jy9Ja5FhwjF59ugSAumG3IYt6CbHp1EhlHBaFlWm-Akks/exec";
        let masterDataPelanggan = [];

        // SANITIZER ALGORITHM: Menjamin output 100% huruf text kasir standar (Hapus segala bentuk Emoji)
        function bersihkanTeks(str) {
            if (!str) return '';
            return str.toString().replace(/[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD00-\uDFFF]/g, "").trim();
        }

        function hitungSimulasiOtomatis() {
            const totalHarga = parseInt(document.getElementById('totalHarga').value) || 0;
            const tenor = parseInt(document.getElementById('tenor').value) || 0;
            const tipeTenor = document.getElementById('tipeTenor').value;
            const rowNum = document.getElementById('rowNum').value;

            if (!rowNum) {
                document.getElementById('sisaUtang').value = totalHarga;
            }

            if (totalHarga > 0 && tenor > 0) {
                const angsuran = Math.ceil(totalHarga / tenor);
                document.getElementById('simulasiHasil').innerHTML = `<b>Estimasi Angsuran: Rp ${angsuran.toLocaleString('id-ID')} / ${tipeTenor.toLowerCase()}</b>`;
            } else {
                document.getElementById('simulasiHasil').innerHTML = `<b>Estimasi Angsuran: Rp 0</b>`;
            }
        }

        async function ambilData() {
            document.getElementById('loadingText').style.display = "block";
            document.getElementById('pelangganTable').style.display = "none";
            
            try {
                const response = await fetch(`${API_URL}?action=ambilData`);
                const result = await response.json();
                
                if (result.error) {
                    alert("Gagal memuat: " + result.error);
                    return;
                }

                document.getElementById('totalPiutang').innerHTML = "<b>Rp " + result.stats.totalPiutang.toLocaleString('id-ID') + "</b>";
                document.getElementById('pelangganAktif').innerHTML = "<b>" + result.stats.aktif + " Orang</b>";
                
                masterDataPelanggan = result.pelanggan;
                jalankanFilterSmart();
                
            } catch (err) {
                console.error(err);
                alert("Gagal terhubung ke Google Sheets API.");
            } finally {
                document.getElementById('loadingText').style.display = "none";
                document.getElementById('pelangganTable').style.display = "table";
            }
        }

        function jalankanFilterSmart() {
            const kataKunci = document.getElementById('inputCari').value.toLowerCase().trim();
            const statusDipilih = document.getElementById('filterStatus').value;

            const dataTerfilter = masterDataPelanggan.filter(p => {
                const cocokKataKunci = p.nama.toLowerCase().includes(kataKunci) || p.barang.toLowerCase().includes(kataKunci);
                const cocokStatus = (statusDipilih === "SEMUA") || (p.status === statusDipilih);
                return cocokKataKunci && cocokStatus;
            });

            renderTabelHtml(dataTerfilter);
        }

        function renderTabelHtml(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";
            
            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; color:#64748b; padding:30px;"><b>Tidak ada data pelanggan yang cocok.</b></td></tr>`;
                return;
            }

            data.forEach(p => {
                const tr = document.createElement('tr');
                const statusClass = p.status === "AKTIF" ? "aktif-bg" : "lunas-bg";
                
                tr.innerHTML = `
                    <td><strong><b>${p.nama}</b></strong></td>
                    <td><span style="color:#64748b; font-size:13px;"><b>${p.alamat}</b></span></td>
                    <td><b>${p.barang}</b></td>
                    <td><b>Rp ${p.total.toLocaleString('id-ID')}</b></td>
                    <td><b>${p.tenor}x (${p.tipe})</b></td>
                    <td style="text-align:center; font-weight:600;"><b>${p.cicilanKe}</b></td>
                    <td style="color:${p.sisa > 0 ? '#ef4444' : '#10b981'}; font-weight:bold;"><b>Rp ${p.sisa.toLocaleString('id-ID')}</b></td>
                    <td><span class="badge ${statusClass}"><b>${p.status}</b></span></td>
                    <td>
                        <div style="display:flex; gap:6px; justify-content: center;">
                            ${p.status === "AKTIF" ? `<button class="btn-table btn-pay" onclick="bayarManual(${p.rowNum}, ${p.sisa})"><b>Bayar</b></button>` : ''}
                            <button class="btn-table btn-edit" onclick="isiFormUntukEdit(${p.rowNum})"><b>Edit</b></button>
                            <button class="btn-table btn-print" onclick="cetakStrukLokal(${p.rowNum}, null, null)"><b>Struk</b></button>
                            <button class="btn-table btn-delete" onclick="hapusData(${p.rowNum})"><b>Hapus</b></button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function prosesSimpanData(e) {
            e.preventDefault();
            const rowNum = document.getElementById('rowNum').value;
            const payload = {
                rowNum: rowNum ? parseInt(rowNum) : 0,
                nama: bersihkanTeks(document.getElementById('nama').value),
                alamat: bersihkanTeks(document.getElementById('alamat').value),
                barang: bersihkanTeks(document.getElementById('barang').value),
                totalHarga: parseInt(document.getElementById('totalHarga').value),
                tipeTenor: document.getElementById('tipeTenor').value,
                tenor: parseInt(document.getElementById('tenor').value),
                cicilanKe: parseInt(document.getElementById('cicilanKe').value || 0),
                sisaUtang: parseInt(document.getElementById('sisaUtang').value)
            };

            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerHTML = "<b>Memproses...</b>";

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "simpanData", data: payload })
                });
                const responseMessage = await response.json();
                alert(responseMessage);
                resetForm();
                ambilData();
            } catch (err) {
                alert("Gagal melakukan sinkronisasi data ke cloud server.");
            } finally {
                btn.disabled = false;
            }
        }

        async function bayarManual(rowNum, sisaUtangMaksimal) {
            const inputNominal = prompt(`Masukkan Nominal Bayar Tunai (Maksimal Rp ${sisaUtangMaksimal.toLocaleString('id-ID')}):`);
            if (inputNominal === null || inputNominal.trim() === "") return;
            
            const nominal = parseInt(inputNominal);
            if (isNaN(nominal) || nominal <= 0) return alert("Nominal pembayaran tidak valid!");
            if (nominal > sisaUtangMaksimal) return alert("Pembayaran melebihi sisa utang!");

            try {
                document.getElementById('loadingText').style.display = "block";
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "bayarManual", rowNum: rowNum, nominal: nominal })
                });
                const result = await response.json();

                if (result.error) {
                    alert("Kesalahan transaksi: " + result.error);
                } else {
                    if(confirm(`Pembayaran Berhasil!\nPelanggan: ${result.hasilBayar.nama}\nSisa Utang: Rp ${result.hasilBayar.sisa.toLocaleString('id-ID')}\n\nApakah Anda ingin mencetak Struk Pembayaran sekarang?`)) {
                        cetakStrukLokal(rowNum, nominal, result.hasilBayar.sisa);
                    }
                    
                    const downloadLink = document.createElement('a');
                    downloadLink.href = `data:application/pdf;base64,${result.pdf}`;
                    downloadLink.download = `Slip_${result.hasilBayar.nama.replace(/\s+/g, '_')}.pdf`;
                    downloadLink.click();
                    
                    ambilData();
                }
            } catch (err) {
                alert("Koneksi gagal saat mengirim data transaksi.");
            } finally {
                document.getElementById('loadingText').style.display = "none";
            }
        }

        // REKAYASA ENGINE CETAK: Format murni teks tebal berskala mikro (Pas di kertas thermal kasir)
        function cetakStrukLokal(rowNum, nominalBayarSekarang = null, sisaUtangTerbaru = null) {
            const p = masterDataPelanggan.find(item => item.rowNum === rowNum);
            if(!p) return alert("Data pelanggan tidak valid!");

            const tanggalSkg = new Date().toLocaleDateString('id-ID', { year: 'numeric', month: '2-digit', day: '2-digit' });
            const areaStruk = document.getElementById('areaCetakStruk');
            
            const cetakBayar = nominalBayarSekarang !== null ? `Rp ${parseInt(nominalBayarSekarang).toLocaleString('id-ID')}` : "-";
            const cetakSisa = sisaUtangTerbaru !== null ? parseInt(sisaUtangTerbaru) : p.sisa;
            const cetakCicilan = nominalBayarSekarang !== null ? (p.cicilanKe + 1) : p.cicilanKe;

            areaStruk.innerHTML = `
                <div class="print-center">
                    <strong><b>SLIP NOTA RESMI</b></strong><br>
                    <strong><b>KIKI KREDIT SOLUTION</b></strong>
                    <div class="print-double"></div>
                </div>
                <div class="print-row"><span><b>Tgl Nota</b></span> <span><b>: ${tanggalSkg}</b></span></div>
                <div class="print-row"><span><b>Nama</b></span> <span><b>: ${bersihkanTeks(p.nama)}</b></span></div>
                <div class="print-row"><span><b>Alamat</b></span> <span><b>: ${bersihkanTeks(p.alamat)}</b></span></div>
                <div class="print-line"></div>
                <div class="print-row"><span><b>Kredit</b></span> <span><b>: ${bersihkanTeks(p.barang)}</b></span></div>
                <div class="print-row"><span><b>Total Pokok</b></span> <span><b>: Rp ${p.total.toLocaleString('id-ID')}</b></span></div>
                <div class="print-row"><span><b>Tenor</b></span> <span><b>: ${p.tenor}x (${p.tipe})</b></span></div>
                <div class="print-row"><span><b>Cicilan Ke</b></span> <span><b>: ${cetakCicilan}</b></span></div>
                <div class="print-line"></div>
                <div class="print-row"><span><b>Jml Bayar</b></span> <span><b>: ${cetakBayar}</b></span></div>
                <div class="print-row"><span><b>SISA UTANG</b></span> <span><b>: Rp ${cetakSisa.toLocaleString('id-ID')}</b></span></div>
                <div class="print-row"><span><b>Status</b></span> <span><b>: ${cetakSisa <= 0 ? 'LUNAS' : 'AKTIF'}</b></span></div>
                <div class="print-line"></div>
                <div class="print-center" style="margin-top:8px;">
                    <b>*** Terima Kasih ***</b><br>
                    <b>Simpan struk ini sebagai</b><br>
                    <b>bukti transaksi yang sah.</b>
                </div>
            `;

            // Memberi jeda 300ms agar engine browser memetakan DOM teks murni sebelum dialog print muncul
            setTimeout(() => {
                window.print();
            }, 300);
        }

        async function hapusData(rowNum) {
            if(!confirm("Hapus records data pelanggan ini secara permanen dari Google Sheets?")) return;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "hapusData", rowNum: rowNum })
                });
                const msg = await response.json();
                alert(msg);
                ambilData();
            } catch (err) {
                alert("Gagal menghapus baris data.");
            }
        }

        function isiFormUntukEdit(rowNum) {
            const p = masterDataPelanggan.find(item => item.rowNum === rowNum);
            if(!p) return;

            document.getElementById('rowNum').value = p.rowNum;
            document.getElementById('nama').value = p.nama;
            document.getElementById('alamat').value = p.alamat;
            document.getElementById('barang').value = p.barang;
            document.getElementById('totalHarga').value = p.total;
            document.getElementById('tipeTenor').value = p.tipe;
            document.getElementById('tenor').value = p.tenor;
            document.getElementById('cicilanKe').value = p.cicilanKe;
            document.getElementById('sisaUtang').value = p.sisa;

            document.getElementById('formTitle').innerHTML = "<b>Mode Edit Data: " + p.nama + "</b>";
            document.getElementById('btnSubmit').innerHTML = "<b>Simpan Perubahan</b>";
            hitungSimulasiOtomatis();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('pelangganForm').reset();
            document.getElementById('rowNum').value = "";
            document.getElementById('cicilanKe').value = "0";
            document.getElementById('formTitle').innerHTML = "<b>Pendaftaran Pelanggan Baru</b>";
            document.getElementById('btnSubmit').innerHTML = "<b>Simpan Data</b>";
            hitungSimulasiOtomatis();
        }

        window.onload = ambilData;
    </script>
</body>
</html>
