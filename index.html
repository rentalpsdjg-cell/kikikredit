<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kiki Kredit Mobile v10</title>
    <style>
        :root {
            --bg-app: #f6f8fb;
            --surface: #ffffff;
            --text-dark: #1e293b;
            --text-gray: #94a3b8;
            --primary: #4f46e5;
            --primary-light: #eef2ff;
            --success: #10b981;
            --success-light: #dcfce7;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border-color: #f1f5f9;
            --shadow-sm: 0 2px 8px rgba(148, 163, 184, 0.08);
            --shadow-md: 0 10px 30px rgba(15, 23, 42, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-app); color: var(--text-dark); font-size: 14px; padding-bottom: 80px; }
        .container { padding: 16px; max-width: 480px; margin: 0 auto; }

        /* Top Bar Modern */
        .app-bar { display: flex; justify-content: space-between; align-items: center; background: var(--surface); padding: 14px 16px; border-radius: 16px; box-shadow: var(--shadow-sm); margin-bottom: 16px; }
        .app-bar h1 { font-size: 16px; font-weight: 800; color: var(--text-dark); display: flex; align-items: center; gap: 6px; }
        .sync-badge { font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 700; background: var(--success-light); color: var(--success); }
        .btn-sync-icon { background: var(--primary-light); color: var(--primary); border: none; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; }

        /* Dashboard Horizontal Scroll / Mini Card Widgets */
        .stats-scroller { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 16px; padding-bottom: 4px; scrollbar-width: none; }
        .stats-scroller::-webkit-scrollbar { display: none; }
        .stat-bubble { background: var(--surface); padding: 12px 16px; border-radius: 14px; min-width: 130px; flex: 1; box-shadow: var(--shadow-sm); border: 1px solid #f8fafc; }
        .stat-bubble h3 { font-size: 10px; color: var(--text-gray); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
        .stat-bubble p { font-size: 14px; font-weight: 700; color: var(--text-dark); }

        /* Filter & Search Bar */
        .search-container { display: flex; gap: 8px; margin-bottom: 16px; }
        .search-input { flex: 1; background: var(--surface); border: 1px solid var(--border-color); padding: 10px 14px; border-radius: 12px; font-size: 13px; color: var(--text-dark); box-shadow: var(--shadow-sm); outline: none; }
        .filter-select { background: var(--surface); border: 1px solid var(--border-color); padding: 0 10px; border-radius: 12px; font-size: 13px; color: var(--text-dark); box-shadow: var(--shadow-sm); outline: none; font-weight: 600; }

        /* Modern Customer Cards (Pengganti Tabel Besar) */
        .cards-feed { display: flex; flex-direction: column; gap: 12px; }
        .customer-card { background: var(--surface); padding: 16px; border-radius: 16px; box-shadow: var(--shadow-sm); border: 1px solid #f8fafc; position: relative; overflow: hidden; }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .cust-name { font-size: 15px; font-weight: 700; color: var(--text-dark); }
        .cust-address { font-size: 11px; color: var(--text-gray); margin-top: 1px; }
        .status-tag { font-size: 10px; padding: 3px 8px; border-radius: 6px; font-weight: 800; text-transform: uppercase; }
        .tag-aktif { background: var(--success-light); color: var(--success); }
        .tag-lunas { background: #f1f5f9; color: #475569; }
        
        .card-body { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; background: #f8fafc; padding: 10px; border-radius: 10px; margin-bottom: 12px; }
        .info-label { font-size: 10px; color: var(--text-gray); text-transform: uppercase; }
        .info-val { font-size: 12px; font-weight: 600; color: var(--text-dark); }
        .info-val.danger { color: var(--danger); font-weight: 700; }

        .card-actions { display: flex; gap: 6px; }
        .btn-mobile { flex: 1; padding: 10px; border: none; border-radius: 10px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; }
        .btn-m-pay { background: var(--primary); color: white; }
        .btn-m-menu { background: #f1f5f9; color: #475569; max-width: 50px; font-size: 14px; }

        /* FLOATING ACTION BUTTON (FAB) */
        .fab-add { position: fixed; bottom: 20px; right: 20px; width: 56px; height: 56px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 4px 16px rgba(79, 70, 229, 0.4); border: none; z-index: 99; cursor: pointer; }

        /* MODERN BOTTOM SHEET MODAL (Formulir & Pilihan Bayar) */
        .bottom-sheet { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); display: none; align-items: flex-end; justify-content: center; z-index: 1000; animation: fadeIn 0.2s ease; }
        .sheet-content { background: var(--surface); width: 100%; max-width: 480px; border-radius: 24px 24px 0 0; padding: 20px; box-shadow: var(--shadow-md); animation: slideUp 0.2s cubic-bezier(0.1, 0.7, 0.1, 1); max-height: 90vh; overflow-y: auto; }
        .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border-color); }
        .sheet-header h3 { font-size: 15px; font-weight: 700; }
        .btn-close-sheet { background: none; border: none; font-size: 18px; color: var(--text-gray); cursor: pointer; }

        /* Form Controls */
        .form-flex { display: flex; flex-direction: column; gap: 12px; }
        .input-group { display: flex; flex-direction: column; gap: 4px; }
        .input-group label { font-size: 11px; font-weight: 700; color: var(--text-gray); text-transform: uppercase; }
        .input-group input, .input-group select { background: #f8fafc; border: 1px solid var(--border-color); padding: 10px 14px; border-radius: 10px; font-size: 13px; color: var(--text-dark); outline: none; width: 100%; }
        .input-group input:focus { border-color: var(--primary); background: var(--surface); }
        .live-banner { background: #f5f3ff; padding: 10px 14px; border-radius: 8px; border-left: 3px solid var(--primary); font-size: 12px; font-weight: 700; color: var(--primary); text-align: center; }

        /* Smart Pay Quick Buttons Grid */
        .pay-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
        .btn-coin { background: #f8fafc; border: 1px solid var(--border-color); padding: 12px 8px; border-radius: 10px; font-weight: 700; font-size: 13px; color: #334155; text-align: center; }
        .btn-coin:disabled { opacity: 0.3; }
        .btn-coin-lunas { grid-column: span 3; background: var(--text-dark); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 13px; text-align: center; margin-top: 4px; }

        /* Menu Opsi Lainnya Sheet */
        .opt-row { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 13px; margin-bottom: 8px; cursor: pointer; }
        .opt-edit { background: #fffbeb; color: var(--warning); }
        .opt-print { background: #eef2ff; color: #6366f1; }
        .opt-del { background: #fee2e2; color: var(--danger); }

        .loader { text-align: center; padding: 30px; font-weight: 700; color: var(--text-gray); font-size: 12px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(100px); } to { transform: translateY(0); } }

        /* THERMAL HARDWARE PRINT OVERRIDES */
        @page { size: auto; margin: 0 !important; }
        @media print {
            html, body { background: transparent !important; margin: 0 !important; padding: 0 !important; }
            body * { display: none !important; }
            #areaCetakStruk, #areaCetakStruk * { display: block !important; visibility: visible !important; }
            #areaCetakStruk { position: absolute; left: 0; top: 0; width: 44mm; color: #000 !important; font-family: 'Courier New', monospace; font-size: 8pt; line-height: 1.1; }
            .p-center { text-align: center; font-weight: bold; }
            .p-line { border-top: 1px dashed #000; margin: 3px 0; height: 1px; }
            .p-row { display: flex; justify-content: space-between; font-weight: bold; }
        }
    </style>
</head>
<body>

    <div id="areaCetakStruk" style="display: none;"></div>

    <button class="fab-add" onclick="bukaFormTambah()">＋</button>

    <div id="paySheet" class="bottom-sheet" onclick="tutupSheet('paySheet')">
        <div class="sheet-content" onclick="event.stopPropagation()">
            <div class="sheet-header">
                <h3 id="paySheetNama">💸 Bayar Kilat</h3>
                <button class="btn-close-sheet" onclick="tutupSheet('paySheet')">✕</button>
            </div>
            <p style="font-size:12px; color:var(--text-gray); margin-bottom:12px;">Sisa Tagihan Akun: <strong id="paySheetSisa" style="color:var(--danger)">Rp 0</strong></p>
            <div class="pay-grid" id="payButtonContainer"></div>
        </div>
    </div>

    <div id="actionSheet" class="bottom-sheet" onclick="tutupSheet('actionSheet')">
        <div class="sheet-content" onclick="event.stopPropagation()">
            <div class="sheet-header">
                <h3 id="actionSheetTitle">Opsi Manajemen</h3>
                <button class="btn-close-sheet" onclick="tutupSheet('actionSheet')">✕</button>
            </div>
            <div id="actionOptionsContainer"></div>
        </div>
    </div>

    <div id="formSheet" class="bottom-sheet" onclick="tutupSheet('formSheet')">
        <div class="sheet-content" onclick="event.stopPropagation()">
            <div class="sheet-header">
                <h3 id="formTitle">📝 Tambah Pelanggan Baru</h3>
                <button class="btn-close-sheet" onclick="tutupSheet('formSheet')">✕</button>
            </div>
            <form id="pelangganForm" class="form-flex" onsubmit="simpanDataKeSistem(event)">
                <input type="hidden" id="rowNum">
                <input type="hidden" id="cicilanKe" value="0">
                
                <div class="input-group">
                    <label>Nama Pelanggan</label>
                    <input type="text" id="nama" placeholder="Nama lengkap" required oninput="kapitalisasiSmart(this)">
                </div>
                <div class="input-group">
                    <label>Alamat Tinggal</label>
                    <input type="text" id="alamat" placeholder="Alamat lengkap" required oninput="kapitalisasiSmart(this)">
                </div>
                <div class="input-group">
                    <label>Nama Barang Pembiayaan</label>
                    <input type="text" id="barang" placeholder="Nama & tipe barang" required oninput="kapitalisasiSmart(this)">
                </div>
                <div class="input-group">
                    <label>Harga Jual Total (Rp)</label>
                    <input type="number" id="totalHarga" placeholder="Nominal angka" required oninput="kalkulasiOtomatisTenor()">
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                    <div class="input-group">
                        <label>Siklus</label>
                        <select id="tipeTenor" onchange="kalkulasiOtomatisTenor()">
                            <option value="Bulanan">🗓️ Bulanan</option>
                            <option value="Mingguan">⏳ Mingguan</option>
                            <option value="Harian">☀️ Harian</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Tenor (Sesi)</label>
                        <input type="number" id="tenor" placeholder="Kali" required oninput="kalkulasiOtomatisTenor()">
                    </div>
                </div>
                <div class="input-group">
                    <label>Sisa Penyesuaian Utang (Rp)</label>
                    <input type="number" id="sisaUtang" required>
                </div>
                <div id="textAngsuran" class="live-banner">Angsuran: Rp 0</div>
                <button type="submit" id="btnSubmit" class="btn-mobile btn-m-pay" style="padding:14px; font-size:13px;">💾 <b>Simpan Data Pelanggan</b></button>
            </form>
        </div>
    </div>

    <div class="container">
        <div class="app-bar">
            <h1>⚡ Kiki Kredit Mobile</h1>
            <div style="display:flex; align-items:center; gap:8px;">
                <span id="syncIndicator" class="sync-badge">Sinkron</span>
                <button class="btn-sync-icon" onclick="ambilDataDariCloud()">🔄</button>
            </div>
        </div>

        <div class="stats-scroller">
            <div class="stat-bubble">
                <h3>Total Piutang</h3>
                <p id="totalPiutang" style="color:var(--danger)">Rp 0</p>
            </div>
            <div class="stat-bubble">
                <h3>Aktif</h3>
                <p id="pelangganAktif">0 Org</p>
            </div>
            <div class="stat-bubble">
                <h3>Kelancaran</h3>
                <p id="rasioPelunasan">0%</p>
            </div>
        </div>

        <div class="search-container">
            <input type="text" id="inputCari" class="search-input" placeholder="🔍 Cari Nama, Alamat, atau Barang..." oninput="jalankanPencarianLokal()">
            <select id="filterStatus" class="filter-select" onchange="jalankanPencarianLokal()">
                <option value="SEMUA">🌐 Semua</option>
                <option value="AKTIF">🟢 Aktif</option>
                <option value="LUNAS">⚪ Lunas</option>
            </select>
        </div>

        <div id="loadingText" class="loader">⏳ Menghubungkan ke Cloud Server...</div>
        <div id="cardsFeed" class="cards-feed"></div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbw2msfsM4iqNn9n-9cHCf-jy9Ja5FhwjF59ugSAumG3IYt6CbHp1EhlHBaFlWm-Akks/exec";
        let cacheDataLokal = [];

        function kapitalisasiSmart(input) {
            let kata = input.value.split(" ");
            for (let i = 0; i < kata.length; i++) {
                if (kata[i].length > 0) kata[i] = kata[i][0].toUpperCase() + kata[i].substr(1);
            }
            input.value = kata.join(" ");
        }

        function bersihkanSimbol(str) {
            if (!str) return '';
            return str.toString().replace(/[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]/g, "").trim();
        }

        function kalkulasiOtomatisTenor() {
            const totalHarga = parseInt(document.getElementById('totalHarga').value) || 0;
            const tenor = parseInt(document.getElementById('tenor').value) || 0;
            const tipeTenor = document.getElementById('tipeTenor').value;
            const rowNum = document.getElementById('rowNum').value;

            if (!rowNum) document.getElementById('sisaUtang').value = totalHarga;

            if (totalHarga > 0 && tenor > 0) {
                const angsuran = Math.ceil(totalHarga / tenor);
                document.getElementById('textAngsuran').innerText = `Angsuran: Rp ${angsuran.toLocaleString('id-ID')} / ${tipeTenor.toLowerCase()}`;
            } else {
                document.getElementById('textAngsuran').innerText = `Angsuran: Rp 0`;
            }
        }

        function bukaSheet(id) { document.getElementById(id).style.display = "flex"; }
        function tutupSheet(id) { document.getElementById(id).style.display = "none"; }

        async function ambilDataDariCloud() {
            const ind = document.getElementById('syncIndicator');
            ind.innerText = "Memuat..."; ind.style.background = "#fffbeb"; ind.style.color = "#d97706";
            document.getElementById('loadingText').style.display = "block";
            document.getElementById('cardsFeed').innerHTML = "";

            try {
                const response = await fetch(`${API_URL}?action=ambilData`);
                const result = await response.json();
                
                document.getElementById('totalPiutang').innerText = "Rp " + result.stats.totalPiutang.toLocaleString('id-ID');
                document.getElementById('pelangganAktif').innerText = result.stats.aktif + " Org";
                
                const total = result.pelanggan.length;
                const lunas = result.pelanggan.filter(x => x.status === "LUNAS").length;
                document.getElementById('rasioPelunasan').innerText = total > 0 ? Math.round((lunas / total) * 100) + "%" : "0%";

                cacheDataLokal = result.pelanggan;
                jalankanPencarianLokal();

                ind.innerText = "Sinkron"; ind.style.background = "var(--success-light)"; ind.style.color = "var(--success)";
            } catch (err) {
                ind.innerText = "Gagal"; ind.style.background = "#fee2e2"; ind.style.color = "var(--danger)";
            } finally {
                document.getElementById('loadingText').style.display = "none";
            }
        }

        function jalankanPencarianLokal() {
            const keyword = document.getElementById('inputCari').value.toLowerCase().trim();
            const status = document.getElementById('filterStatus').value;

            const terfilter = cacheDataLokal.filter(p => {
                const cocokTeks = p.nama.toLowerCase().includes(keyword) || p.barang.toLowerCase().includes(keyword) || p.alamat.toLowerCase().includes(keyword);
                const cocokStatus = (status === "SEMUA" || p.status === status);
                return cocokTeks && cocokStatus;
            });
            buatRenderCards(terfilter);
        }

        function buatRenderCards(data) {
            const feed = document.getElementById('cardsFeed');
            feed.innerHTML = "";

            if(data.length === 0) {
                feed.innerHTML = `<div class="loader">Data tidak cocok / kosong.</div>`;
                return;
            }

            data.forEach(p => {
                const card = document.createElement('div');
                card.className = "customer-card";
                card.innerHTML = `
                    <div class="card-header">
                        <div>
                            <div class="cust-name">${p.nama}</div>
                            <div class="cust-address">📍 ${p.alamat}</div>
                        </div>
                        <span class="status-tag ${p.status === 'AKTIF' ? 'tag-aktif' : 'tag-lunas'}">${p.status}</span>
                    </div>
                    <div class="card-body">
                        <div><div class="info-label">Barang</div><div class="info-val">${p.barang}</div></div>
                        <div><div class="info-label">Total Jual</div><div class="info-val">Rp ${p.total.toLocaleString('id-ID')}</div></div>
                        <div><div class="info-label">Sesi Cicilan</div><div class="info-val">${p.cicilanKe} / ${p.tenor}x (${p.tipe[0]})</div></div>
                        <div><div class="info-label">Sisa Utang</div><div class="info-val ${p.sisa > 0 ? 'danger' : ''}">Rp ${p.sisa.toLocaleString('id-ID')}</div></div>
                    </div>
                    <div class="card-actions">
                        ${p.status === 'AKTIF' ? `<button class="btn-mobile btn-m-pay" onclick="bukaModalBayarSmart(${p.rowNum})">💸 Bayar Sesi</button>` : ''}
                        <button class="btn-mobile btn-m-menu" onclick="bukaMenuOpsiLainnya(${p.rowNum})">⚡ Menu</button>
                    </div>
                `;
                feed.appendChild(card);
            });
        }

        function bukaModalBayarSmart(rowNum) {
            const p = cacheDataLokal.find(x => x.rowNum === rowNum);
            if(!p) return;

            document.getElementById('paySheetNama').innerText = `💸 Bayar: ${p.nama}`;
            document.getElementById('paySheetSisa').innerText = `Rp ${p.sisa.toLocaleString('id-ID')}`;

            const container = document.getElementById('payButtonContainer');
            container.innerHTML = "";

            const listNominal = [50000, 100000, 150000, 200000, 300000, 500000];
            listNominal.forEach(nominal => {
                const btn = document.createElement('button');
                btn.className = "btn-coin";
                btn.innerText = `${(nominal/1000)}K`;
                if(p.sisa < nominal) btn.disabled = true;
                btn.setAttribute("onclick", `eksekusiBayarOtomatis(${p.rowNum}, ${nominal}, ${p.sisa})`);
                container.appendChild(btn);
            });

            const btnLunas = document.createElement('button');
            btnLunas.className = "btn-coin-lunas";
            btnLunas.innerText = `🎯 Bayar Sisa Lunas (Rp ${p.sisa.toLocaleString('id-ID')})`;
            btnLunas.setAttribute("onclick", `eksekusiBayarOtomatis(${p.rowNum}, ${p.sisa}, ${p.sisa})`);
            container.appendChild(btnLunas);

            bukaSheet('paySheet');
        }

        function bukaMenuOpsiLainnya(rowNum) {
            const p = cacheDataLokal.find(x => x.rowNum === rowNum);
            if(!p) return;

            document.getElementById('actionSheetTitle').innerText = `${p.nama}`;
            const container = document.getElementById('actionOptionsContainer');
            container.innerHTML = `
                <div class="opt-row opt-edit" onclick="tutupSheet('actionSheet'); isiDataKeFormulir(${p.rowNum});">✏️ Edit Profil & Piutang</div>
                <div class="opt-row opt-print" onclick="tutupSheet('actionSheet'); printStrukKasir(${p.rowNum}, null, null);">🖨️ Cetak Ulang Struk Kasir</div>
                <div class="opt-row opt-del" onclick="tutupSheet('actionSheet'); hapusBarisPelanggan(${p.rowNum});">🗑️ Hapus Rekor Pelanggan</div>
            `;
            bukaSheet('actionSheet');
        }

        function bukaFormTambah() {
            resetFormulir();
            bukaSheet('formSheet');
        }

        async function eksekusiBayarOtomatis(rowNum, nominal, maksimalSisa) {
            tutupSheet('paySheet');
            document.getElementById('loadingText').style.display = "block";

            try {
                const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "bayarManual", rowNum: rowNum, nominal: nominal }) });
                const result = await response.json();
                
                if (result.error) return alert(result.error);
                
                if(confirm(`Berhasil Masuk Rp ${nominal.toLocaleString('id-ID')}! Cetak nota thermal?`)) {
                    printStrukKasir(rowNum, nominal, result.hasilBayar.sisa);
                }
                const link = document.createElement('a'); link.href = `data:application/pdf;base64,${result.pdf}`; link.download = `Nota_${result.hasilBayar.nama}.pdf`; link.click();
                ambilDataDariCloud();
            } catch (err) {
                alert("Gangguan konektivitas.");
            }
        }

        async function simpanDataKeSistem(e) {
            e.preventDefault();
            tutupSheet('formSheet');
            document.getElementById('loadingText').style.display = "block";

            const payload = {
                rowNum: parseInt(document.getElementById('rowNum').value || 0),
                nama: bersihkanSimbol(document.getElementById('nama').value),
                alamat: bersihkanSimbol(document.getElementById('alamat').value),
                barang: bersihkanSimbol(document.getElementById('barang').value),
                totalHarga: parseInt(document.getElementById('totalHarga').value),
                tipeTenor: document.getElementById('tipeTenor').value,
                tenor: parseInt(document.getElementById('tenor').value),
                cicilanKe: parseInt(document.getElementById('cicilanKe').value || 0),
                sisaUtang: parseInt(document.getElementById('sisaUtang').value)
            };

            try {
                const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "simpanData", data: payload }) });
                alert(await response.json());
                ambilDataDariCloud();
            } catch (err) { alert("Error Server."); }
        }

        function printStrukKasir(rowNum, nominalBayar = null, sisaBaru = null) {
            const p = cacheDataLokal.find(x => x.rowNum === rowNum);
            if(!p) return;

            const tanggal = new Date().toLocaleDateString('id-ID', { year: '2-digit', month: '2-digit', day: '2-digit' });
            const sisaAkhir = sisaBaru !== null ? parseInt(sisaBaru) : p.sisa;
            const hitungCicilan = nominalBayar !== null ? (p.cicilanKe + 1) : p.cicilanKe;

            document.getElementById('areaCetakStruk').innerHTML = `
                <div class="p-center"><strong>KIKI KREDIT SOLUTION</strong><div class="p-line"></div></div>
                <div class="p-row"><span>Tgl: ${tanggal}</span> <span>Ke: ${hitungCicilan}x</span></div>
                <div class="p-row"><span>Nama: ${bersihkanSimbol(p.nama.substring(0,14))}</span></div>
                <div class="p-row"><span>Brg : ${bersihkanSimbol(p.barang.substring(0,14))}</span></div>
                <div class="p-line"></div>
                <div class="p-row"><span>Total Jual</span> <span>: Rp ${p.total.toLocaleString('id-ID')}</span></div>
                <div class="p-row"><span>Bayar Sesi</span> <span>: Rp ${(nominalBayar || 0).toLocaleString('id-ID')}</span></div>
                <div class="p-row"><span>SISA UTANG</span> <span>: Rp ${sisaAkhir.toLocaleString('id-ID')}</span></div>
                <div class="p-line"></div>
                <div class="p-center">** STRUK VALID **</div>
            `;
            setTimeout(() => { window.print(); }, 200);
        }

        async function hapusBarisPelanggan(rowNum) {
            if(!confirm("Hapus data pelanggan ini?")) return;
            document.getElementById('loadingText').style.display = "block";
            try {
                await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "hapusData", rowNum: rowNum }) });
                ambilDataDariCloud();
            } catch (err) { alert("Gagal."); }
        }

        function isiDataKeFormulir(rowNum) {
            const p = cacheDataLokal.find(x => x.rowNum === rowNum);
            if(!p) return;
            document.getElementById('rowNum').value = p.rowNum;
            document.getElementById('nama').value = p.nama;
            document.getElementById('alamat').value = p.alamat;
            document.getElementById('barang').value = p.barang;
            document.getElementById('totalHarga').value = p.total;
            document.getElementById('tipeTenor').value = p.tipe;
            document.getElementById('tenor').value = p.tenor;
            document.getElementById('cicilanKe').value = p.cicilanKe;
            document.getElementById('sisaUtang').value = p.sisa;
            
            document.getElementById('formTitle').innerText = "✏️ Ubah Data Pelanggan";
            kalkulasiOtomatisTenor();
            bukaSheet('formSheet');
        }

        function resetFormulir() {
            document.getElementById('pelangganForm').reset();
            document.getElementById('rowNum').value = "";
            document.getElementById('cicilanKe').value = "0";
            document.getElementById('formTitle').innerText = "📝 Tambah Pelanggan Baru";
            kalkulasiOtomatisTenor();
        }

        window.onload = ambilDataDariCloud;
    </script>
</body>
</html>
