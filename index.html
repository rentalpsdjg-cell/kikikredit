<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiki Kredit v5</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #f1f5f9; color: #1e293b; padding: 15px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header-app { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #cbd5e1; padding-bottom: 10px; }
        .header-app h1 { font-size: 20px; color: #0f172a; }
        .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); border-top: 5px solid #2563eb; }
        .card.aktif { border-top-color: #10b981; }
        .card h3 { font-size: 12px; color: #64748b; text-transform: uppercase; margin-bottom: 5px; }
        .card p { font-size: 22px; font-weight: 700; color: #0f172a; }
        .action-section { background: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); }
        .action-section h2 { margin-bottom: 12px; font-size: 15px; color: #334155; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 12px; }
        input, select { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; background-color: #f8fafc; }
        input:focus, select:focus { background-color: #fff; border-color: #2563eb; outline: none; }
        .smart-calc { font-size: 12px; color: #2563eb; font-weight: 600; grid-column: 1 / -1; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
        button { padding: 8px 14px; border: none; border-radius: 6px; color: white; font-weight: 600; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; }
        .btn-primary { background: #2563eb; }
        .btn-secondary { background: #64748b; }
        .btn-purple { background: #7c3aed; }
        .filter-section { display: flex; gap: 10px; margin-bottom: 15px; background: white; padding: 12px; border-radius: 10px; box-shadow: 0 2px 4px rgb(0 0 0 / 0.02); flex-wrap: wrap; }
        .search-box { flex: 1; min-width: 180px; }
        .filter-box { width: 130px; }
        .table-container { background: white; border-radius: 10px; overflow-x: auto; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #0f172a; color: white; padding: 12px; font-weight: 600; }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; }
        tr:hover { background: #f8fafc; }
        .badge { padding: 3px 8px; border-radius: 9999px; font-size: 10px; font-weight: 600; }
        .badge.aktif-bg { background: #dcfce7; color: #16a34a; }
        .badge.lunas-bg { background: #f1f5f9; color: #64748b; }
        .btn-table { padding: 4px 8px; font-size: 11px; border-radius: 4px; font-weight: bold; margin-right: 2px; }
        .btn-pay { background: #10b981; }
        .btn-edit { background: #f59e0b; }
        .btn-delete { background: #ef4444; }
        .btn-print { background: #6366f1; }
        .loading { text-align: center; padding: 20px; font-weight: 600; color: #64748b; }
        
        /* FIX TOTAL: MENGHAPUS SEMUA WHITE SPACE, MARGIN, DAN BACKGROUND */
        @page {
            size: auto;
            margin: 0 !important;
        }
        @media print {
            html, body {
                background: transparent !important;
                background-color: transparent !important;
                margin: 0 !important;
                padding: 0 !important;
                height: auto !important;
            }
            body * { 
                display: none !important; 
            }
            #areaCetakStruk, #areaCetakStruk * { 
                display: block !important; 
                visibility: visible !important; 
                background: transparent !important;
                box-shadow: none !important;
            }
            #areaCetakStruk { 
                position: absolute; 
                left: 0; 
                top: 0; 
                width: 44mm; 
                padding: 0 !important; 
                margin: 0 !important; 
                color: #000 !important; 
                font-family: 'Courier New', monospace; 
                font-size: 8pt; 
                line-height: 1.1; 
            }
            .print-center { text-align: center; font-weight: bold; }
            .print-line { border-top: 1px dashed #000; margin: 3px 0; display: block !important; height: 1px; }
            .print-double { border-top: 2px double #000; margin: 3px 0; display: block !important; height: 2px; }
            .print-row { display: flex !important; justify-content: space-between; font-weight: bold; white-space: nowrap; }
        }
    </style>
</head>
<body>

    <div id="areaCetakStruk" style="display: none;"></div>

    <div class="container">
        <div class="header-app">
            <h1><b>Kiki Kredit Solution</b></h1>
            <button class="btn-purple" onclick="ambilData()"><b>Segarkan</b></button>
        </div>

        <div class="stats-container">
            <div class="card">
                <h3><b>Sisa Piutang</b></h3>
                <p id="totalPiutang"><b>Rp 0</b></p>
            </div>
            <div class="card aktif">
                <h3><b>Pelanggan Aktif</b></h3>
                <p id="pelangganAktif"><b>0 Orang</b></p>
            </div>
        </div>

        <div class="action-section">
            <h2 id="formTitle"><b>Tambah Pelanggan</b></h2>
            <form id="pelangganForm" onsubmit="prosesSimpanData(event)">
                <input type="hidden" id="rowNum">
                <input type="hidden" id="cicilanKe" value="0">
                
                <div class="form-grid">
                    <input type="text" id="nama" placeholder="Nama" required>
                    <input type="text" id="alamat" placeholder="Alamat" required>
                    <input type="text" id="barang" placeholder="Barang" required>
                    <input type="number" id="totalHarga" placeholder="Harga (Rp)" required oninput="hitungSimulasiOtomatis()">
                    <select id="tipeTenor" onchange="hitungSimulasiOtomatis()">
                        <option value="Bulanan">Bulanan</option>
                        <option value="Mingguan">Mingguan</option>
                        <option value="Harian">Harian</option>
                    </select>
                    <input type="number" id="tenor" placeholder="Tenor (Sesi)" required oninput="hitungSimulasiOtomatis()">
                    <input type="number" id="sisaUtang" placeholder="Sisa Utang Awal (Rp)" required>
                    
                    <div id="simulasiHasil" class="smart-calc"><b>Angsuran: Rp 0</b></div>
                </div>
                <div class="btn-group">
                    <button type="submit" id="btnSubmit" class="btn-primary"><b>Simpan</b></button>
                    <button type="button" class="btn-secondary" onclick="resetForm()"><b>Reset</b></button>
                </div>
            </form>
        </div>

        <div class="filter-section">
            <div class="search-box">
                <input type="text" id="inputCari" placeholder="Cari nama / barang..." oninput="jalankanFilterSmart()">
            </div>
            <div class="filter-box">
                <select id="filterStatus" onchange="jalankanFilterSmart()">
                    <option value="SEMUA">Semua</option>
                    <option value="AKTIF">Aktif</option>
                    <option value="LUNAS">Lunas</option>
                </select>
            </div>
        </div>

        <div class="table-container">
            <div id="loadingText" class="loading"><b>Memuat data...</b></div>
            <table id="pelangganTable" style="display: none;">
                <thead>
                    <tr>
                        <th><b>Nama</b></th>
                        <th><b>Alamat</b></th>
                        <th><b>Barang</b></th>
                        <th><b>Total</b></th>
                        <th><b>Tenor</b></th>
                        <th><b>Ke</b></th>
                        <th><b>Sisa</b></th>
                        <th><b>Status</b></th>
                        <th style="text-align: center;"><b>Aksi</b></th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbw2msfsM4iqNn9n-9cHCf-jy9Ja5FhwjF59ugSAumG3IYt6CbHp1EhlHBaFlWm-Akks/exec";
        let masterDataPelanggan = [];

        function bersihkanTeks(str) {
            if (!str) return '';
            return str.toString().replace(/[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD00-\uDFFF]/g, "").trim();
        }

        function hitungSimulasiOtomatis() {
            const totalHarga = parseInt(document.getElementById('totalHarga').value) || 0;
            const tenor = parseInt(document.getElementById('tenor').value) || 0;
            const tipeTenor = document.getElementById('tipeTenor').value;
            const rowNum = document.getElementById('rowNum').value;

            if (!rowNum) document.getElementById('sisaUtang').value = totalHarga;

            if (totalHarga > 0 && tenor > 0) {
                const angsuran = Math.ceil(totalHarga / tenor);
                document.getElementById('simulasiHasil').innerHTML = `<b>Angsuran: Rp ${angsuran.toLocaleString('id-ID')} / ${tipeTenor.toLowerCase()}</b>`;
            } else {
                document.getElementById('simulasiHasil').innerHTML = `<b>Angsuran: Rp 0</b>`;
            }
        }

        async function ambilData() {
            document.getElementById('loadingText').style.display = "block";
            document.getElementById('pelangganTable').style.display = "none";
            try {
                const response = await fetch(`${API_URL}?action=ambilData`);
                const result = await response.json();
                if (result.error) return alert("Gagal: " + result.error);

                document.getElementById('totalPiutang').innerHTML = "<b>Rp " + result.stats.totalPiutang.toLocaleString('id-ID') + "</b>";
                document.getElementById('pelangganAktif').innerHTML = "<b>" + result.stats.aktif + " Orang</b>";
                masterDataPelanggan = result.pelanggan;
                jalankanFilterSmart();
            } catch (err) {
                alert("Koneksi Google Sheets gagal.");
            } finally {
                document.getElementById('loadingText').style.display = "none";
                document.getElementById('pelangganTable').style.display = "table";
            }
        }

        function jalankanFilterSmart() {
            const kataKunci = document.getElementById('inputCari').value.toLowerCase().trim();
            const statusDipilih = document.getElementById('filterStatus').value;
            const dataTerfilter = masterDataPelanggan.filter(p => {
                return (p.nama.toLowerCase().includes(kataKunci) || p.barang.toLowerCase().includes(kataKunci)) && (statusDipilih === "SEMUA" || p.status === statusDipilih);
            });
            renderTabelHtml(dataTerfilter);
        }

        function renderTabelHtml(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";
            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; color:#64748b; padding:20px;"><b>Data kosong.</b></td></tr>`;
                return;
            }
            data.forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${p.nama}</b></td>
                    <td><span style="color:#64748b; font-size:12px;"><b>${p.alamat}</b></span></td>
                    <td><b>${p.barang}</b></td>
                    <td><b>Rp ${p.total.toLocaleString('id-ID')}</b></td>
                    <td><b>${p.tenor}x (${p.tipe[0]})</b></td>
                    <td style="text-align:center;"><b>${p.cicilanKe}</b></td>
                    <td style="color:${p.sisa > 0 ? '#ef4444' : '#10b981'}; font-weight:bold;"><b>Rp ${p.sisa.toLocaleString('id-ID')}</b></td>
                    <td><span class="badge ${p.status === "AKTIF" ? "aktif-bg" : "lunas-bg"}"><b>${p.status}</b></span></td>
                    <td>
                        <div style="display:flex; justify-content: center;">
                            ${p.status === "AKTIF" ? `<button class="btn-table btn-pay" onclick="bayarManual(${p.rowNum}, ${p.sisa})"><b>Bayar</b></button>` : ''}
                            <button class="btn-table btn-edit" onclick="isiFormUntukEdit(${p.rowNum})"><b>Edit</b></button>
                            <button class="btn-table btn-print" onclick="cetakStrukLokal(${p.rowNum}, null, null)"><b>Struk</b></button>
                            <button class="btn-table btn-delete" onclick="hapusData(${p.rowNum})"><b>Hapus</b></button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function prosesSimpanData(e) {
            e.preventDefault();
            const rowNum = document.getElementById('rowNum').value;
            const payload = {
                rowNum: rowNum ? parseInt(rowNum) : 0,
                nama: bersihkanTeks(document.getElementById('nama').value),
                alamat: bersihkanTeks(document.getElementById('alamat').value),
                barang: bersihkanTeks(document.getElementById('barang').value),
                totalHarga: parseInt(document.getElementById('totalHarga').value),
                tipeTenor: document.getElementById('tipeTenor').value,
                tenor: parseInt(document.getElementById('tenor').value),
                cicilanKe: parseInt(document.getElementById('cicilanKe').value || 0),
                sisaUtang: parseInt(document.getElementById('sisaUtang').value)
            };
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true; btn.innerHTML = "<b>Proses...</b>";
            try {
                const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "simpanData", data: payload }) });
                alert(await response.json());
                resetForm(); ambilData();
            } catch (err) {
                alert("Gagal sinkronisasi data.");
            } finally {
                btn.disabled = false;
            }
        }

        async function bayarManual(rowNum, sisaUtangMaksimal) {
            const inputNominal = prompt(`Nominal Bayar (Maks Rp ${sisaUtangMaksimal.toLocaleString('id-ID')}):`);
            if (!inputNominal) return;
            const nominal = parseInt(inputNominal);
            if (isNaN(nominal) || nominal <= 0 || nominal > sisaUtangMaksimal) return alert("Nominal salah!");

            try {
                document.getElementById('loadingText').style.display = "block";
                const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "bayarManual", rowNum: rowNum, nominal: nominal }) });
                const result = await response.json();
                if (result.error) {
                    alert("Gagal: " + result.error);
                } else {
                    if(confirm("Bayar Berhasil! Cetak struk?")) cetakStrukLokal(rowNum, nominal, result.hasilBayar.sisa);
                    const dl = document.createElement('a'); dl.href = `data:application/pdf;base64,${result.pdf}`; dl.download = `Slip_${result.hasilBayar.nama}.pdf`; dl.click();
                    ambilData();
                }
            } catch (err) {
                alert("Koneksi transaksi gagal.");
            } finally {
                document.getElementById('loadingText').style.display = "none";
            }
        }

        function cetakStrukLokal(rowNum, nominalBayarSekarang = null, sisaUtangTerbaru = null) {
            const p = masterDataPelanggan.find(item => item.rowNum === rowNum);
            if(!p) return alert("Data tidak ada!");

            const tgl = new Date().toLocaleDateString('id-ID', { year: '2-digit', month: '2-digit', day: '2-digit' });
            const areaStruk = document.getElementById('areaCetakStruk');
            const cBayar = nominalBayarSekarang !== null ? `Rp ${parseInt(nominalBayarSekarang).toLocaleString('id-ID')}` : "-";
            const cSisa = sisaUtangTerbaru !== null ? parseInt(sisaUtangTerbaru) : p.sisa;
            const cCicilan = nominalBayarSekarang !== null ? (p.cicilanKe + 1) : p.cicilanKe;

            areaStruk.innerHTML = `
                <div class="print-center">
                    <strong><b>KIKI KREDIT SOLUTION</b></strong>
                    <div class="print-double"></div>
                </div>
                <div class="print-row"><span><b>Tgl: ${tgl}</b></span> <span><b>Ckl: ${cCicilan}x</b></span></div>
                <div class="print-row"><span><b>Nama: ${bersihkanTeks(p.nama.substring(0,14))}</b></span></div>
                <div class="print-row"><span><b>Brg : ${bersihkanTeks(p.barang.substring(0,14))}</b></span></div>
                <div class="print-line"></div>
                <div class="print-row"><span><b>Total Pokok</b></span> <span><b>: Rp ${p.total.toLocaleString('id-ID')}</b></span></div>
                <div class="print-row"><span><b>Bayar Sesi</b></span> <span><b>: ${cBayar}</b></span></div>
                <div class="print-row"><span><b>SISA UTANG</b></span> <span><b>: Rp ${cSisa.toLocaleString('id-ID')}</b></span></div>
                <div class="print-row"><span><b>Status</b></span> <span><b>: ${cSisa <= 0 ? 'LUNAS' : 'AKTIF'}</b></span></div>
                <div class="print-line"></div>
                <div class="print-center" style="margin-top:5px;">
                    <b>** TERIMA KASIH **</b>
                </div>
            `;
            setTimeout(() => { window.print(); }, 200);
        }

        async function hapusData(rowNum) {
            if(!confirm("Hapus permanen?")) return;
            try {
                const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "hapusData", rowNum: rowNum }) });
                alert(await response.json()); ambilData();
            } catch (err) { alert("Gagal hapus."); }
        }

        function isiFormUntukEdit(rowNum) {
            const p = masterDataPelanggan.find(item => item.rowNum === rowNum);
            if(!p) return;
            document.getElementById('rowNum').value = p.rowNum;
            document.getElementById('nama').value = p.nama;
            document.getElementById('alamat').value = p.alamat;
            document.getElementById('barang').value = p.barang;
            document.getElementById('totalHarga').value = p.total;
            document.getElementById('tipeTenor').value = p.tipe;
            document.getElementById('tenor').value = p.tenor;
            document.getElementById('cicilanKe').value = p.cicilanKe;
            document.getElementById('sisaUtang').value = p.sisa;
            document.getElementById('formTitle').innerHTML = "<b>Edit: " + p.nama + "</b>";
            document.getElementById('btnSubmit').innerHTML = "<b>Ubah</b>";
            hitungSimulasiOtomatis();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('pelangganForm').reset();
            document.getElementById('rowNum').value = "";
            document.getElementById('cicilanKe').value = "0";
            document.getElementById('formTitle').innerHTML = "<b>Tambah Pelanggan</b>";
            document.getElementById('btnSubmit').innerHTML = "<b>Simpan</b>";
            hitungSimulasiOtomatis();
        }

        window.onload = ambilData;
    </script>
</body>
</html>
