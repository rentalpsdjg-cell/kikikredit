<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiki Kredit Compact Smart v9</title>
    <style>
        :root {
            --bg-app: #f8fafc;
            --surface: #ffffff;
            --text-dark: #0f172a;
            --text-gray: #64748b;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border-color: #e2e8f0;
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-app); color: var(--text-dark); padding: 16px; font-size: 13px; }
        .container { max-width: 1400px; margin: 0 auto; }
        
        /* Top Navigation Bar Mini */
        .app-header { display: flex; justify-content: space-between; align-items: center; background: var(--surface); padding: 12px 18px; border-radius: var(--radius-lg); box-shadow: 0 1px 2px rgba(0,0,0,0.02); margin-bottom: 16px; border: 1px solid var(--border-color); }
        .app-header h1 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .status-pill { font-size: 10px; background: #eef2ff; color: var(--primary); padding: 2px 8px; border-radius: 20px; font-weight: 600; }

        /* Dashboard & Form Layout Grid split (Mencegah Layar Memanjang) */
        .main-layout { display: grid; grid-template-columns: 340px 1fr; gap: 16px; align-items: start; }
        @media (max-width: 900px) { .main-layout { grid-template-columns: 1fr; } }

        /* Left Column: Form & Stats Container */
        .side-panel { display: flex; flex-direction: column; gap: 16px; }
        
        .metrics-mini { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .metric-card { background: var(--surface); padding: 12px; border-radius: var(--radius-md); border: 1px solid var(--border-color); }
        .metric-card.full { grid-column: span 2; }
        .metric-card h3 { font-size: 10px; color: var(--text-gray); text-transform: uppercase; margin-bottom: 2px; letter-spacing: 0.02em; }
        .metric-card p { font-size: 16px; font-weight: 700; }

        /* Compact Form Design */
        .form-card { background: var(--surface); padding: 16px; border-radius: var(--radius-lg); border: 1px solid var(--border-color); }
        .form-card h2 { font-size: 13px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        .form-flex { display: flex; flex-direction: column; gap: 10px; }
        
        .input-box { display: flex; flex-direction: column; gap: 2px; }
        .input-box label { font-size: 10px; font-weight: 600; color: var(--text-gray); text-transform: uppercase; }
        input, select { width: 100%; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 12px; font-weight: 500; background-color: #f8fafc; color: var(--text-dark); transition: all 0.15s; }
        input:focus, select:focus { background-color: var(--surface); border-color: var(--primary); outline: none; box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.08); }
        
        .live-calc-banner { background: #f5f3ff; padding: 10px; border-radius: 6px; border-left: 3px solid var(--primary); display: flex; justify-content: space-between; font-weight: 600; color: var(--primary); font-size: 11px; }

        .btn-container { display: flex; gap: 6px; margin-top: 4px; }
        button { padding: 8px 14px; border: none; border-radius: 6px; color: white; font-weight: 600; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; transition: all 0.15s; }
        button:active { transform: scale(0.98); }
        .btn-indigo { background: var(--primary); width: 100%; justify-content: center; }
        .btn-indigo:hover { background: var(--primary-hover); }
        .btn-slate { background: var(--text-gray); }
        .btn-refresh { background: #7c3aed; padding: 6px 12px; font-size: 12px; }

        /* Right Column: Search Controls & Data Table */
        .data-panel { background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border-color); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .search-filter-bar { display: flex; gap: 10px; width: 100%; }
        .search-input-wrapper { flex: 1; }

        /* Compact Table Design */
        .table-holder { overflow-x: auto; width: 100%; border: 1px solid var(--border-color); border-radius: var(--radius-md); }
        table { width: 100%; border-collapse: collapse; min-width: 850px; }
        th { background: #0f172a; color: white; padding: 10px 12px; font-weight: 600; text-align: left; font-size: 11px; text-transform: uppercase; }
        td { padding: 10px 12px; border-bottom: 1px solid var(--border-color); font-size: 12px; vertical-align: middle; }
        .row-hover:hover { background-color: #f8fafc; }
        
        .status-tag { padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: 700; text-transform: uppercase; }
        .tag-active { background: #dcfce7; color: #16a34a; }
        .tag-done { background: #f1f5f9; color: #475569; }

        .action-flex { display: flex; gap: 4px; }
        .btn-action { padding: 4px 8px; font-size: 11px; border-radius: 4px; font-weight: 700; color: white; border: none; }
        .btn-action-pay { background: var(--success); }
        .btn-action-print { background: #6366f1; }
        .btn-action-edit { background: var(--warning); }
        .btn-action-del { background: #fff; color: var(--danger); border: 1px solid #fee2e2; }
        .btn-action-del:hover { background: #fee2e2; }

        /* SMART POP-UP OVERLAY MODAL (Solusi agar tidak memanjang) */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); display: none; align-items: center; justify-content: center; z-index: 1000; animation: fadeIn 0.15s ease; }
        .modal-content { background: var(--surface); padding: 20px; border-radius: var(--radius-lg); width: 100%; max-width: 400px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); border: 1px solid var(--border-color); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        .modal-header h3 { font-size: 13px; font-weight: 700; }
        .modal-grid-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .btn-quick-money { background: #ffffff; color: #334155; border: 1px solid #cbd5e1; font-size: 12px; padding: 8px; border-radius: 6px; font-weight: 600; }
        .btn-quick-money:hover:not(:disabled) { background: #eff6ff; border-color: var(--primary); color: var(--primary); }
        .btn-quick-money:disabled { opacity: 0.35; cursor: not-allowed; }
        .btn-quick-lunas { background: #0f172a; color: white; border: none; font-size: 12px; padding: 10px; border-radius: 6px; grid-column: span 2; font-weight: 700; width: 100%; text-align: center; margin-top: 4px; }
        .btn-quick-lunas:hover { background: #1e293b; }
        
        .loader-text { text-align: center; padding: 30px; font-weight: 600; color: var(--text-gray); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* PRINTER THERMAL STRICT MANAGEMENT */
        @page { size: auto; margin: 0 !important; }
        @media print {
            html, body { background: transparent !important; margin: 0 !important; padding: 0 !important; height: auto !important; }
            body * { display: none !important; }
            #areaCetakStruk, #areaCetakStruk * { display: block !important; visibility: visible !important; background: transparent !important; }
            #areaCetakStruk { position: absolute; left: 0; top: 0; width: 44mm; padding: 0 !important; margin: 0 !important; color: #000 !important; font-family: 'Courier New', monospace; font-size: 8pt; line-height: 1.1; }
            .print-center { text-align: center; font-weight: bold; }
            .print-line { border-top: 1px dashed #000; margin: 3px 0; display: block !important; height: 1px; }
            .print-double { border-top: 2px double #000; margin: 3px 0; display: block !important; height: 2px; }
            .print-row { display: flex !important; justify-content: space-between; font-weight: bold; }
        }
    </style>
</head>
<body>

    <div id="areaCetakStruk" style="display: none;"></div>

    <div id="smartPayModal" class="modal-overlay" onclick="tutupModalBayar()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modalTargetNama">💸 Pembayaran Instan</h3>
                <button style="background:none; color:var(--text-gray); font-size:16px; padding:0;" onclick="tutupModalBayar()">✕</button>
            </div>
            <div style="margin-bottom: 12px; font-size:12px; color:var(--text-gray);">
                Sisa Tagihan Akun: <strong id="modalTargetSisa" style="color:var(--danger)">Rp 0</strong>
            </div>
            <div class="modal-grid-buttons" id="modalButtonContainer">
                </div>
        </div>
    </div>

    <div class="container">
        <div class="app-header">
            <h1>⚡ Kiki Kredit Compact <span id="syncIndicator" class="status-pill">Sinkron</span></h1>
            <button class="btn-refresh" onclick="ambilDataDariCloud()">🔄 <b>Sinkron Cloud</b></button>
        </div>

        <div class="main-layout">
            
            <div class="side-panel">
                <div class="metrics-mini">
                    <div class="metric-card full">
                        <h3>Total Sisa Piutang</h3>
                        <p id="totalPiutang" style="color: var(--danger)">Rp 0</p>
                    </div>
                    <div class="metric-card">
                        <h3>Aktif</h3>
                        <p id="pelangganAktif">0 Org</p>
                    </div>
                    <div class="metric-card">
                        <h3>Lunas</h3>
                        <p id="rasioPelunasan">0%</p>
                    </div>
                </div>

                <div class="form-card">
                    <h2 id="formTitle">📝 Formulir Pelanggan</h2>
                    <form id="pelangganForm" class="form-flex" onsubmit="simpanDataKeSistem(event)">
                        <input type="hidden" id="rowNum">
                        <input type="hidden" id="cicilanKe" value="0">
                        
                        <div class="input-box">
                            <label>Nama Pelanggan</label>
                            <input type="text" id="nama" placeholder="Nama lengkap" required oninput="kapitalisasiSmart(this)">
                        </div>
                        <div class="input-box">
                            <label>Alamat Rumah</label>
                            <input type="text" id="alamat" placeholder="Alamat rumah" required oninput="kapitalisasiSmart(this)">
                        </div>
                        <div class="input-box">
                            <label>Nama Barang</label>
                            <input type="text" id="barang" placeholder="Nama tipe barang" required oninput="kapitalisasiSmart(this)">
                        </div>
                        <div class="input-box">
                            <label>Harga Jual Pembiayaan (Rp)</label>
                            <input type="number" id="totalHarga" placeholder="Angka nominal" required oninput="kalkulasiOtomatisTenor()">
                        </div>
                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                            <div class="input-box">
                                <label>Siklus</label>
                                <select id="tipeTenor" onchange="kalkulasiOtomatisTenor()">
                                    <option value="Bulanan">Bulanan</option>
                                    <option value="Mingguan">Mingguan</option>
                                    <option value="Harian">Harian</option>
                                </select>
                            </div>
                            <div class="input-box">
                                <label>Tenor (Sesi)</label>
                                <input type="number" id="tenor" placeholder="Kali" required oninput="kalkulasiOtomatisTenor()">
                            </div>
                        </div>
                        <div class="input-box">
                            <label>Sisa Penyesuaian Saldo (Rp)</label>
                            <input type="number" id="sisaUtang" placeholder="Otomatis mengikuti harga" required>
                        </div>
                        
                        <div id="simulasiHasil" class="live-calc-banner">
                            <span>Angsuran: <b id="textAngsuran">Rp 0</b></span>
                        </div>
                        
                        <div class="btn-container">
                            <button type="submit" id="btnSubmit" class="btn-indigo">💾 <b>Simpan Rekor</b></button>
                            <button type="button" class="btn-slate" onclick="resetFormulir()">🧹</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="data-panel">
                <div class="search-filter-bar">
                    <div class="search-input-wrapper">
                        <input type="text" id="inputCari" placeholder="🔍 Masukkan kata kunci untuk menyaring data pelanggan..." oninput="jalankanPencarianLokal()">
                    </div>
                    <div style="width: 120px;">
                        <select id="filterStatus" onchange="jalankanPencarianLokal()">
                            <option value="SEMUA">🌐 Semua</option>
                            <option value="AKTIF">🟢 Aktif</option>
                            <option value="LUNAS">⚪ Lunas</option>
                        </select>
                    </div>
                </div>

                <div class="table-holder">
                    <div id="loadingText" class="loader-text">⏳ Sinkronisasi data sistem...</div>
                    <table id="pelangganTable" style="display: none;">
                        <thead>
                            <tr>
                                <th>Pelanggan</th>
                                <th>Alamat</th>
                                <th>Barang</th>
                                <th>Total Pokok</th>
                                <th>Tenor</th>
                                <th>Ke</th>
                                <th>Sisa Piutang</th>
                                <th>Status</th>
                                <th style="text-align: center;">Tindakan</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbw2msfsM4iqNn9n-9cHCf-jy9Ja5FhwjF59ugSAumG3IYt6CbHp1EhlHBaFlWm-Akks/exec";
        let cacheDataLokal = [];

        function kapitalisasiSmart(input) {
            let kata = input.value.split(" ");
            for (let i = 0; i < kata.length; i++) {
                if (kata[i].length > 0) kata[i] = kata[i][0].toUpperCase() + kata[i].substr(1);
            }
            input.value = kata.join(" ");
        }

        function bersihkanSimbol(str) {
            if (!str) return '';
            return str.toString().replace(/[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]/g, "").trim();
        }

        function kalkulasiOtomatisTenor() {
            const totalHarga = parseInt(document.getElementById('totalHarga').value) || 0;
            const tenor = parseInt(document.getElementById('tenor').value) || 0;
            const tipeTenor = document.getElementById('tipeTenor').value;
            const rowNum = document.getElementById('rowNum').value;

            if (!rowNum) document.getElementById('sisaUtang').value = totalHarga;

            if (totalHarga > 0 && tenor > 0) {
                const angsuran = Math.ceil(totalHarga / tenor);
                document.getElementById('textAngsuran').innerText = `Rp ${angsuran.toLocaleString('id-ID')} / ${tipeTenor.toLowerCase()}`;
            } else {
                document.getElementById('textAngsuran').innerText = `Rp 0`;
            }
        }

        async function ambilDataDariCloud() {
            const ind = document.getElementById('syncIndicator');
            ind.innerText = "🔄 Memuat...";
            ind.style.background = "#fffbeb"; ind.style.color = "#d97706";
            document.getElementById('loadingText').style.display = "block";
            document.getElementById('pelangganTable').style.display = "none";

            try {
                const response = await fetch(`${API_URL}?action=ambilData`);
                const result = await response.json();
                
                document.getElementById('totalPiutang').innerHTML = "<b>Rp " + result.stats.totalPiutang.toLocaleString('id-ID') + "</b>";
                document.getElementById('pelangganAktif').innerHTML = "<b>" + result.stats.aktif + " Org</b>";
                
                const total = result.pelanggan.length;
                const lunas = result.pelanggan.filter(x => x.status === "LUNAS").length;
                document.getElementById('rasioPelunasan').innerText = total > 0 ? Math.round((lunas / total) * 100) + "%" : "0%";

                cacheDataLokal = result.pelanggan;
                jalankanPencarianLokal();

                ind.innerText = "🟢 Sinkron";
                ind.style.background = "#dcfce7"; ind.style.color = "#16a34a";
            } catch (err) {
                ind.innerText = "🔴 Gagal";
                ind.style.background = "#fee2e2"; ind.style.color = "#ef4444";
            } finally {
                document.getElementById('loadingText').style.display = "none";
                document.getElementById('pelangganTable').style.display = "table";
            }
        }

        function jalankanPencarianLokal() {
            const keyword = document.getElementById('inputCari').value.toLowerCase().trim();
            const status = document.getElementById('filterStatus').value;

            const terfilter = cacheDataLokal.filter(p => {
                const cocokTeks = p.nama.toLowerCase().includes(keyword) || p.barang.toLowerCase().includes(keyword) || p.alamat.toLowerCase().includes(keyword);
                const cocokStatus = (status === "SEMUA" || p.status === status);
                return cocokTeks && cocokStatus;
            });
            buatRenderTabel(terfilter);
        }

        function buatRenderTabel(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";

            data.forEach(p => {
                const tr = document.createElement('tr');
                tr.className = "row-hover";
                tr.innerHTML = `
                    <td><strong>${p.nama}</strong></td>
                    <td><span style="color:var(--text-gray); font-size:11px;">${p.alamat}</span></td>
                    <td><span>${p.barang}</span></td>
                    <td><b>Rp ${p.total.toLocaleString('id-ID')}</b></td>
                    <td><b>${p.tenor}x</b></td>
                    <td style="text-align:center;"><b>${p.cicilanKe}</b></td>
                    <td style="color:${p.sisa > 0 ? 'var(--danger)' : 'var(--success)'}; font-weight:700;">Rp ${p.sisa.toLocaleString('id-ID')}</td>
                    <td><span class="status-tag ${p.status === 'AKTIF' ? 'tag-active' : 'tag-done'}">${p.status}</span></td>
                    <td>
                        <div class="action-flex">
                            ${p.status === "AKTIF" ? `<button class="btn-action btn-action-pay" onclick="bukaModalBayarSmart(${p.rowNum})">💸 Bayar</button>` : ''}
                            <button class="btn-action btn-action-print" onclick="printStrukKasir(${p.rowNum}, null, null)">🖨️</button>
                            <button class="btn-action btn-action-edit" onclick="isiDataKeFormulir(${p.rowNum})">✏️</button>
                            <button class="btn-action btn-action-del" onclick="hapusBarisPelanggan(${p.rowNum})">🗑️</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // CONTROL POP-UP MODAL OVERLAY SMART COIN BUTTONS
        function bukaModalBayarSmart(rowNum) {
            const p = cacheDataLokal.find(x => x.rowNum === rowNum);
            if(!p) return;

            document.getElementById('modalTargetNama').innerText = `💸 Bayar: ${p.nama}`;
            document.getElementById('modalTargetSisa').innerText = `Rp ${p.sisa.toLocaleString('id-ID')}`;

            const container = document.getElementById('modalButtonContainer');
            container.innerHTML = "";

            const listNominal = [50000, 100000, 150000, 200000, 300000, 500000];
            listNominal.forEach(nominal => {
                const btn = document.createElement('button');
                btn.className = "btn-quick-money";
                btn.innerText = `💵 ${(nominal/1000)}K`;
                if(p.sisa < nominal) btn.disabled = true;
                btn.setAttribute("onclick", `eksekusiBayarOtomatis(${p.rowNum}, ${nominal}, ${p.sisa})`);
                container.appendChild(btn);
            });

            const btnLunas = document.createElement('button');
            btnLunas.className = "btn-quick-lunas";
            btnLunas.innerText = `🎯 Bayar Sisa Lunas (Rp ${p.sisa.toLocaleString('id-ID')})`;
            btnLunas.setAttribute("onclick", `eksekusiBayarOtomatis(${p.rowNum}, ${p.sisa}, ${p.sisa})`);
            container.appendChild(btnLunas);

            document.getElementById('smartPayModal').style.display = "flex";
        }

        function tutupModalBayar() {
            document.getElementById('smartPayModal').style.display = "none";
        }

        async function eksekusiBayarOtomatis(rowNum, nominal, maksimalSisa) {
            if (nominal <= 0 || nominal > maksimalSisa) return alert("Penyimpangan aturan keuangan.");
            tutupModalBayar();

            try {
                document.getElementById('loadingText').style.display = "block";
                const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "bayarManual", rowNum: rowNum, nominal: nominal }) });
                const result = await response.json();
                
                if (result.error) {
                    alert("Error: " + result.error);
                } else {
                    if(confirm(`Berhasil Dibayar Rp ${nominal.toLocaleString('id-ID')}! Cetak struk thermal?`)) {
                        printStrukKasir(rowNum, nominal, result.hasilBayar.sisa);
                    }
                    const link = document.createElement('a'); link.href = `data:application/pdf;base64,${result.pdf}`; link.download = `Nota_${result.hasilBayar.nama}.pdf`; link.click();
                    ambilDataDariCloud();
                }
            } catch (err) {
                alert("Gangguan koneksi pembayaran data.");
            } finally {
                document.getElementById('loadingText').style.display = "none";
            }
        }

        async function simpanDataKeSistem(e) {
            e.preventDefault();
            const rowNum = document.getElementById('rowNum').value;
            const payload = {
                rowNum: rowNum ? parseInt(rowNum) : 0,
                nama: bersihkanSimbol(document.getElementById('nama').value),
                alamat: bersihkanSimbol(document.getElementById('alamat').value),
                barang: bersihkanSimbol(document.getElementById('barang').value),
                totalHarga: parseInt(document.getElementById('totalHarga').value),
                tipeTenor: document.getElementById('tipeTenor').value,
                tenor: parseInt(document.getElementById('tenor').value),
                cicilanKe: parseInt(document.getElementById('cicilanKe').value || 0),
                sisaUtang: parseInt(document.getElementById('sisaUtang').value)
            };

            const btn = document.getElementById('btnSubmit');
            btn.disabled = true; btn.innerHTML = "⏳ Memproses...";

            try {
                const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "simpanData", data: payload }) });
                alert(await response.json());
                resetFormulir();
                ambilDataDariCloud();
            } catch (err) {
                alert("Komunikasi awan bermasalah.");
            } finally {
                btn.disabled = false;
            }
        }

        function printStrukKasir(rowNum, nominalBayar = null, sisaBaru = null) {
            const p = cacheDataLokal.find(x => x.rowNum === rowNum);
            if(!p) return alert("Rekor data salah.");

            const tanggal = new Date().toLocaleDateString('id-ID', { year: '2-digit', month: '2-digit', day: '2-digit' });
            const containerStruk = document.getElementById('areaCetakStruk');
            const nominalBayarText = nominalBayar !== null ? `Rp ${parseInt(nominalBayar).toLocaleString('id-ID')}` : "-";
            const sisaAkhir = sisaBaru !== null ? parseInt(sisaBaru) : p.sisa;
            const hitungCicilan = nominalBayar !== null ? (p.cicilanKe + 1) : p.cicilanKe;

            containerStruk.innerHTML = `
                <div class="print-center">
                    <strong><b>KIKI KREDIT SOLUTION</b></strong>
                    <div class="print-double"></div>
                </div>
                <div class="print-row"><span><b>Tgl: ${tanggal}</b></span> <span><b>Ke: ${hitungCicilan}x</b></span></div>
                <div class="print-row"><span><b>Nama: ${bersihkanSimbol(p.nama.substring(0,14))}</b></span></div>
                <div class="print-row"><span><b>Brg : ${bersihkanSimbol(p.barang.substring(0,14))}</b></span></div>
                <div class="print-line"></div>
                <div class="print-row"><span><b>Total Pokok</b></span> <span><b>: Rp ${p.total.toLocaleString('id-ID')}</b></span></div>
                <div class="print-row"><span><b>Bayar Sesi</b></span> <span><b>: ${nominalBayarText}</b></span></div>
                <div class="print-row"><span><b>SISA UTANG</b></span> <span><b>: Rp ${sisaAkhir.toLocaleString('id-ID')}</b></span></div>
                <div class="print-row"><span><b>Status</b></span> <span><b>: ${sisaAkhir <= 0 ? 'LUNAS' : 'AKTIF'}</b></span></div>
                <div class="print-line"></div>
                <div class="print-center" style="margin-top:4px;"><b>** STRUK VALID **</b></div>
            `;
            setTimeout(() => { window.print(); }, 200);
        }

        async function hapusBarisPelanggan(rowNum) {
            if(!confirm("Hapus permanen data pelanggan ini?")) return;
            try {
                const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "hapusData", rowNum: rowNum }) });
                alert(await response.json());
                ambilDataDariCloud();
            } catch (err) { alert("Penghapusan ditolak cloud."); }
        }

        function isiDataKeFormulir(rowNum) {
            const p = cacheDataLokal.find(x => x.rowNum === rowNum);
            if(!p) return;
            document.getElementById('rowNum').value = p.rowNum;
            document.getElementById('nama').value = p.nama;
            document.getElementById('alamat').value = p.alamat;
            document.getElementById('barang').value = p.barang;
            document.getElementById('totalHarga').value = p.total;
            document.getElementById('tipeTenor').value = p.tipe;
            document.getElementById('tenor').value = p.tenor;
            document.getElementById('cicilanKe').value = p.cicilanKe;
            document.getElementById('sisaUtang').value = p.sisa;
            
            document.getElementById('formTitle').innerHTML = "✏️ Edit: " + p.nama;
            document.getElementById('btnSubmit').innerHTML = "🔄 <b>Perbarui Data</b>";
            
            kalkulasiOtomatisTenor();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            document.getElementById('nama').focus();
        }

        function resetFormulir() {
            document.getElementById('pelangganForm').reset();
            document.getElementById('rowNum').value = "";
            document.getElementById('cicilanKe').value = "0";
            document.getElementById('formTitle').innerHTML = "📝 Formulir Pelanggan";
            document.getElementById('btnSubmit').innerHTML = "💾 <b>Simpan Rekor</b>";
            kalkulasiOtomatisTenor();
        }

        window.onload = ambilDataDariCloud;
    </script>
</body>
</html>
