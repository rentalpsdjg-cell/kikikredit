<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kiki Kredit Solution - Full Bold Print Engine</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    /* ============================================================
       1. ANTARMUKA LAYAR KASIR HP (DARK MODE - MODERN & BERSIH)
       ============================================================ */
    body { 
      background: #0f172a; 
      color: #f1f5f9; 
      font-family: 'Segoe UI', sans-serif; 
      padding: 12px; 
      font-size: 14px;
    }
    
    .card { 
      background: #1e293b; 
      border-radius: 12px; 
      border: 1px solid #334155; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.2); 
      margin-bottom: 15px; 
    }
    
    .header-card { 
      background: linear-gradient(135deg, #0284c7, #0369a1); 
      color: white; 
      padding: 20px; 
      border-radius: 12px; 
    }
    
    .form-control-custom {
      background: #0f172a !important;
      color: #ffffff !important;
      border-radius: 8px;
      font-size: 15px;
      border: 2px solid #475569;
      padding: 10px 12px;
      height: auto;
      margin-bottom: 10px;
      font-weight: bold;
    }
    .form-control-custom:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }
    
    .btn-sm-custom { 
      font-size: 13px; 
      padding: 8px 12px; 
      margin: 3px 2px; 
      font-weight: bold; 
      border-radius: 8px; 
    }
    
    #overlay { 
      display: none; 
      position: fixed; 
      top:0; left:0; width:100%; height:100%; 
      background: rgba(15, 23, 42, 0.9); 
      z-index:9999; 
      justify-content: center; 
      align-items: center; 
      flex-direction: column; 
    }

    /* SEMBUNYIKAN PREVIEW STRUK DI LAYAR HP KASIR */
    #strukCetak { display: none !important; }
 
    /* ============================================================
       2. ARSITEKTUR STRUK CETAK FISIK THERMAL (MURNI TEKS TEBAL VERTIKAL)
       ============================================================ */
    @media print {
      body * { display: none !important; }
      html, body { height: auto; overflow: visible; background: #fff; margin: 0; padding: 0; }
      
      #strukCetak, #strukCetak * { display: block !important; }
      @page { size: 58mm auto; margin: 0mm; }
      
      .nota-container {
        width: 100%;
        padding: 6mm 2mm;
        font-family: 'Courier New', Courier, monospace;
        font-size: 22px !important; 
        font-weight: 900 !important; 
        color: #000 !important;
        line-height: 1.2;
        background: transparent !important;
      }
      
      .nota-header { 
        text-align: center; 
        margin-bottom: 8px; 
        font-size: 24px !important; 
        font-weight: 900 !important; 
        line-height: 1.1;
      }
      
      .nota-garis { 
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        margin: 5px 0; 
        font-size: 22px !important;
        font-weight: 900 !important;
      }
      .nota-garis::after {
        content: "----------------------"; 
        display: block;
      }
      
      .nota-item-row { 
        margin-bottom: 5px; 
        word-break: break-all;
      }
      .nota-label { 
        font-weight: 900 !important; 
        text-transform: uppercase; 
        display: inline;
      }
      .nota-value { 
        font-weight: 900 !important; 
        display: inline;
      }
      
      .nota-footer { 
        text-align: center; 
        margin-top: 15px; 
        font-size: 19px !important; 
        font-weight: 900 !important; 
        line-height: 1.2;
      }
    }

    /* Style cadangan murni untuk download PDF WA */
    .nota-pdf-wa {
      width: 56mm;
      padding: 4mm 2mm;
      font-family: 'Courier New', Courier, monospace;
      font-size: 16px;
      color: #000;
      line-height: 1.3;
      background: #fff;
    }
  </style>
</head>
<body>

  <div id="overlay">
    <div class="spinner-border text-info" role="status" style="width: 3rem; height: 3rem;"></div>
    <b class="mt-3 text-info">SINKRONISASI DATABASE...</b>
  </div>

  <div id="strukCetak">
    <div class="nota-container" id="notaPdfArea">
      <div class="nota-header">SLIP PEMBAYARAN<br>KIKI KREDIT Solution</div>
      
      <div class="nota-garis"></div>
      
      <div class="nota-item-row"><div class="nota-label">TGL: </div><div class="nota-value" id="pTgl">-</div></div>
      <div class="nota-item-row"><div class="nota-label">NAM: </div><div class="nota-value" id="pNama">-</div></div>
      <div class="nota-item-row"><div class="nota-label">BRG: </div><div class="nota-value" id="pBrg">-</div></div>
      
      <div class="nota-garis"></div>
      
      <div class="nota-item-row"><div class="nota-label">BYR: </div><div class="nota-value" id="pBayar">Rp 0</div></div>
      <div class="nota-item-row"><div class="nota-label">SIS: </div><div class="nota-value" id="pSisa">Rp 0</div></div>
      
      <div class="nota-garis"></div>
      
      <div class="nota-footer">
        *** TERIMA KASIH ***<br>
        BUKTI PEMBAYARAN SAH.
      </div>
    </div>
  </div>

  <div class="header-card text-center mb-3">
    <h4 class="font-weight-bold"><i class="fas fa-store mr-2"></i>USAHA KIKI KREDIT</h4>
    <div class="row mt-3">
      <div class="col-6 border-right">
        <small class="font-weight-bold text-white-50">TOTAL PIUTANG</small>
        <h5 id="statPiutang" class="font-weight-bold">Rp 0</h5>
      </div>
      <div class="col-6">
        <small class="font-weight-bold text-white-50">PELANGGAN AKTIF</small>
        <h5 id="statAktif" class="font-weight-bold">0</h5>
      </div>
    </div>
  </div>

  <div class="card p-3">
    <b id="formTitle" class="text-info mb-3" style="font-size: 16px;"><i class="fas fa-user-plus mr-2"></i>Registrasi Pelanggan Baru</b>
    <input type="hidden" id="editRowNum">
    
    <input type="text" id="nama" class="form-control form-control-custom" placeholder="Nama Pelanggan">
    <input type="text" id="alamat" class="form-control form-control-custom" placeholder="Alamat">
    <input type="text" id="barang" class="form-control form-control-custom" placeholder="Nama Barang Kredit">
    
    <div class="form-row">
      <div class="col-7"><input type="number" id="harga" class="form-control form-control-custom" placeholder="Harga Total (Rp)"></div>
      <div class="col-5"><input type="number" id="tenor" class="form-control form-control-custom" placeholder="Tenor (Kali)"></div>
    </div>
    
    <div class="form-row">
      <div class="col-7">
        <small class="text-muted d-block mb-1 font-weight-bold">Sisa Utang (Bisa manual):</small>
        <input type="number" id="sisaUtang" class="form-control form-control-custom" placeholder="Rp 0">
      </div>
      <div class="col-5">
        <small class="text-muted d-block mb-1 font-weight-bold">Tipe Tenor:</small>
        <select id="tipeTenor" class="form-control form-control-custom" style="padding:10px;">
          <option value="Bulanan">Tenor Bulanan</option>
          <option value="Mingguan">Tenor Mingguan</option>
        </select>
      </div>
    </div>
    
    <button id="btnSimpan" onclick="simpan()" class="btn btn-info btn-block font-weight-bold py-2 mt-2 shadow" style="background:#0284c7; border:none;">SIMPAN TRANSAKSI</button>
    <button onclick="resetForm()" class="btn btn-secondary btn-block mt-1 py-2">Batal</button>
  </div>

  <div class="card p-2 mb-2">
    <input type="text" id="cariInput" class="form-control form-control-custom mb-0" placeholder="🔍 Cari nama pelanggan..." onkeyup="filterTabel()">
  </div>
  
  <div class="card p-2">
    <div class="table-responsive">
      <table class="table table-sm table-dark table-hover mb-0" style="background: transparent;">
        <tbody id="tabelBody">
          <tr><td class="text-center py-4 text-muted">Sinkronisasi database...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

<script>
  // JALUR DRIVER MACRO UTAMA YANG BARU
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwVC24h3ax58HSK6DS4NSY5O7w-R_9mn8kUQ9ZokV0vvQZXNJF8p8Gh_JQal5JLNP0r/exec";

  let dataStorage = [];

  function muatData() {
    document.getElementById('overlay').style.display = 'flex';
    fetch(SCRIPT_URL + "?aksi=ambilData")
    .then(res => res.json())
    .then(data => {
      dataStorage = data.pelanggan || [];
      
      let totalPiutang = data.stats && data.stats.totalPiutang ? data.stats.totalPiutang : 0;
      let aktif = data.stats && data.stats.aktif ? data.stats.aktif : 0;
      
      document.getElementById('statPiutang').innerText = "Rp " + totalPiutang.toLocaleString('id-ID');
      document.getElementById('statAktif').innerText = aktif;
      
      let html = "";
      dataStorage.forEach(p => {
        let namaPel = p.nama || "-";
        let barangPel = p.barang || "-";
        let sisaPel = p.sisa || 0;
        let statusPel = p.status || "AKTIF";
        let tenorPel = p.tenor || "0";
        let tipePel = p.tipe || "Bulanan";
        let row = p.rowNum;

        html += `<tr style="border-bottom: 1px solid #334155 !important;"><td class="py-3 px-2">
          <span class="font-weight-bold h6 d-inline-block mb-1" style="color: #38bdf8;">${namaPel.toUpperCase()}</span> 
          <span class="badge ${statusPel==='LUNAS'?'badge-success':'badge-danger'} p-1">${statusPel}</span><br>
          <div class="text-muted mb-1" style="font-size:13px;">${barangPel} | Sisa: <b class="text-warning">Rp ${Number(sisaPel).toLocaleString('id-ID')}</b></div>
          <div class="text-muted mb-2" style="font-size:12px;">Tenor: ${tenorPel} (${tipePel})</div>
          <div class="d-flex flex-wrap">
            <button onclick="bayar(${row})" class="btn btn-success btn-sm btn-sm-custom">Bayar</button>
            <button onclick="cetakLokal(${row})" class="btn btn-info btn-sm btn-sm-custom" style="background:#0284c7; border:none;">Cetak</button>
            <button onclick="unduhPdfLokal(${row})" class="btn btn-secondary btn-sm btn-sm-custom">PDF</button>
            <button onclick="pindahKeEdit(${row})" class="btn btn-warning text-dark btn-sm btn-sm-custom">✏️</button>
            <button onclick="hapus(${row})" class="btn btn-danger btn-sm btn-sm-custom">🗑️</button>
          </div>
        </td></tr>`;
      });
      document.getElementById('tabelBody').innerHTML = html || "<tr><td class='text-center py-3 text-muted'>Belum ada data / Sheets Kosong</td></tr>";
      document.getElementById('overlay').style.display = 'none';
    }).catch((err) => { 
      console.error(err);
      document.getElementById('tabelBody').innerHTML = "<tr><td class='text-center py-3 text-danger font-weight-bold'>Terjadi kesalahan koneksi database</td></tr>";
      document.getElementById('overlay').style.display = 'none'; 
    });
  }

  function simpan() {
    let hargaInput = document.getElementById('harga').value;
    let sisaInput = document.getElementById('sisaUtang').value;
    let data = {
      rowNum: document.getElementById('editRowNum').value,
      nama: document.getElementById('nama').value,
      alamat: document.getElementById('alamat').value,
      barang: document.getElementById('barang').value,
      totalHarga: hargaInput,
      tipeTenor: document.getElementById('tipeTenor').value,
      tenor: document.getElementById('tenor').value,
      sisaUtang: sisaInput ? sisaInput : hargaInput
    };
    if(!data.nama || !data.totalHarga) return alert("Nama dan Harga wajib diisi!");
    document.getElementById('overlay').style.display = 'flex';
    fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ aksi: "simpan", data: data }) })
    .then(res => res.json()).then(res => { alert(res); resetForm(); muatData(); });
  }

  function bayar(rowNum) {
    let nominal = prompt("Masukkan jumlah bayar (Rp):");
    if(!nominal) return;
    let cekAngka = Number(nominal);
    if(isNaN(cekAngka) || cekAngka <= 0) return alert("Nominal angka bayar tidak valid!");

    document.getElementById('overlay').style.display = 'flex';
    fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ aksi: "bayar", rowNum: rowNum, nominal: nominal }) })
    .then(res => res.json()).then(res => {
      document.getElementById('pTgl').innerText = res.tgl;
      document.getElementById('pNama').innerText = res.nama.toUpperCase();
      document.getElementById('pBrg').innerText = res.barang.toUpperCase();
      document.getElementById('pBayar').innerText = "Rp " + Number(res.nominal).toLocaleString('id-ID');
      document.getElementById('pSisa').innerText = "Rp " + Number(res.sisa).toLocaleString('id-ID');
      muatData();
      setTimeout(() => { window.print(); }, 400);
    });
  }

  function findPelanggan(rowNum) {
    return dataStorage.find(item => item.rowNum === rowNum);
  }

  function cetakLokal(rowNum) {
    let p = findPelanggan(rowNum);
    if (!p) return;

    let opsi = { year: '2-digit', month: 'numeric', day: 'numeric' };
    document.getElementById('pTgl').innerText = new Date().toLocaleDateString('id-ID', opsi);
    document.getElementById('pNama').innerText = p.nama.toUpperCase();
    document.getElementById('pBrg').innerText = p.barang.toUpperCase();
    document.getElementById('pBayar').innerText = "CEK SISA";
    document.getElementById('pSisa').innerText = "Rp " + Number(p.sisa).toLocaleString('id-ID');
    
    setTimeout(() => { window.print(); }, 200);
  }

  function unduhPdfLokal(rowNum) {
    let p = findPelanggan(rowNum);
    if (!p) return;
    
    let opsiTgl = { year: '2-digit', month: 'numeric', day: 'numeric' };
    document.getElementById('pTgl').innerText = new Date().toLocaleDateString('id-ID', opsiTgl);
    document.getElementById('pNama').innerText = p.nama.toUpperCase();
    document.getElementById('pBrg').innerText = p.barang.toUpperCase();
    document.getElementById('pBayar').innerText = "CEK BERKALA";
    document.getElementById('pSisa').innerText = "Rp " + Number(p.sisa).toLocaleString('id-ID');
    
    let element = document.getElementById('notaPdfArea');
    
    // Set style kontainer menjadi bersih putih khusus saat render PDF WA
    element.className = "nota-pdf-wa";
    
    let opsi = {
      margin:       2,
      filename:     'Slip_' + p.nama.replace(/\s+/g, '_') + '.pdf',
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  { scale: 2, background: '#fff' },
      jsPDF:        { unit: 'mm', format: [58, 90], orientation: 'portrait' }
    };
    
    html2pdf().set(opsi).from(element).save().then(() => {
      // Kembalikan ke style print utama setelah render selesai
      element.className = "nota-container";
    });
  }

  function pindahKeEdit(rowNum) {
    let p = findPelanggan(rowNum);
    if (!p) return;
    
    document.getElementById('editRowNum').value = p.rowNum;
    document.getElementById('nama').value = p.nama;
    document.getElementById('alamat').value = p.alamat;
    document.getElementById('barang').value = p.barang;
    document.getElementById('harga').value = p.total;
    document.getElementById('tenor').value = p.tenor;
    document.getElementById('tipeTenor').value = p.tipe;
    document.getElementById('sisaUtang').value = p.sisa;
    document.getElementById('formTitle').innerHTML = "<i class='fas fa-edit mr-2'></i>Ubah Data: " + p.nama.toUpperCase();
    document.getElementById('btnSimpan').innerText = "PERBARUI DATA";
    window.scrollTo({top: 0, behavior: 'smooth'});
  }

  function resetForm() {
    document.getElementById('editRowNum').value = "";
    document.querySelectorAll('input').forEach(i => i.value = "");
    document.getElementById('formTitle').innerHTML = "<i class='fas fa-user-plus mr-2'></i>Registrasi Pelanggan Baru";
    document.getElementById('btnSimpan').innerText = "SIMPAN TRANSAKSI";
  }

  function filterTabel() {
    let input = document.getElementById("cariInput").value.toUpperCase();
    let tr = document.getElementById("tabelBody").getElementsByTagName("tr");
    for (let i = 0; i < tr.length; i++) {
      let td = tr[i].getElementsByTagName("span")[0];
      if(td) { tr[i].style.display = (td.innerText.toUpperCase().indexOf(input) > -1) ? "" : "none"; }
    }
  }

  function hapus(rowNum) {
    if(confirm("Hapus data pelanggan ini secara permanen?")) {
      document.getElementById('overlay').style.display = 'flex';
      fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ aksi: "hapus", rowNum: rowNum }) })
      .then(res => res.json()).then(() => muatData());
    }
  }

  window.onload = muatData;
</script>
</body>
</html>
