<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiki Kredit Solution</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; font-family: system-ui, -apple-system, sans-serif; color: #333; }
    .navbar-custom { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); padding: 15px 0; }
    .card-stats { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); transition: transform 0.2s; }
    .card-stats:hover { transform: translateY(-3px); }
    .table-container { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 4px 25px rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.03); }
    
    /* BADGE STATUS YANG JELAS */
    .badge-status { padding: 8px 14px; border-radius: 30px; font-weight: 600; font-size: 0.85rem; display: inline-block; }
    .badge-aktif { background-color: #e3f2fd; color: #0d6efd; border: 1px solid #b3e5fc; }
    .badge-lunas { background-color: #e8f5e9; color: #1b5e20; border: 1px solid #c8e6c9; }
    
    /* INPUT CARI & TOMBOL UKURAN JUMBO */
    .input-jumbo { padding: 12px 18px; border-radius: 12px !important; font-size: 1.05rem; }
    .btn-jumbo { padding: 12px 24px; border-radius: 12px; font-weight: 600; font-size: 1.05rem; box-shadow: 0 4px 10px rgba(13, 110, 253, 0.15); }
    
    /* TOMBOL AKSI DI TABEL (BESAR DAN LEBIH EMBEDDED) */
    .btn-aksi { padding: 8px 14px; font-size: 0.9rem; font-weight: 600; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px; margin: 3px; border: none; transition: all 0.2s; }
    .btn-aksi:hover { filter: brightness(0.9); transform: scale(1.03); }
    
    .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: flex; justify-content: center; align-items: center; z-index: 9999; display: none; }
    
    /* DESIGN PRINT THERMAL AUTO PAS */
    #areaStruk { display: none; }
    @media print {
      body * { display: none !important; }
      #areaStruk, #areaStruk * { display: block !important; }
      #areaStruk { 
        position: absolute; left: 0; top: 0; width: 100%; max-width: 58mm; 
        padding: 0; margin: 0; background: #fff; color: #000;
        font-family: "Courier New", Courier, monospace; font-size: 9pt; line-height: 1.2;
      }
      @page { size: auto; margin: 0mm; }
    }
    .text-center { text-align: center; }
    .line-double { border-top: 2px double #000; margin: 2mm 0; }
    .line-dash { border-top: 1px dashed #000; margin: 2mm 0; }
    .struk-row { display: flex; justify-content: space-between; margin-bottom: 1mm; }
    .struk-val { font-weight: bold; text-align: right; }
  </style>
</head>
<body>

  <div id="loading" class="loading-overlay">
    <div class="text-center">
      <div class="spinner-border text-primary" role="status" style="width: 3.5rem; height: 3.5rem;"></div>
      <p class="mt-3 fw-bold fs-5 text-secondary">Memperbarui Data...</p>
    </div>
  </div>

  <nav class="navbar navbar-custom shadow-sm mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1 text-white fs-3 fw-bold">
        <i class="fa-solid fa-wallet me-2 text-warning"></i> Kiki Kredit Solution
      </span>
    </div>
  </nav>

  <div class="container mb-5">
    <div class="row mb-4">
      <div class="col-md-6 mb-3">
        <div class="card card-stats bg-white p-4 d-flex flex-row align-items-center justify-content-between">
          <div>
            <h6 class="text-muted text-uppercase fw-bold mb-1" style="font-size: 0.8rem; letter-spacing: 0.5px;">Total Piutang Aktif</h6>
            <h2 class="fw-bold text-primary mb-0" id="statTotalPiutang" style="font-size: 2rem;">Rp 0</h2>
          </div>
          <div class="bg-primary bg-opacity-10 p-3 rounded-4 text-primary"><i class="fa-solid fa-money-bill-wave fa-3xl"></i></div>
        </div>
      </div>
      <div class="col-md-6 mb-3">
        <div class="card card-stats bg-white p-4 d-flex flex-row align-items-center justify-content-between">
          <div>
            <h6 class="text-muted text-uppercase fw-bold mb-1" style="font-size: 0.8rem; letter-spacing: 0.5px;">Pelanggan Aktif</h6>
            <h2 class="fw-bold text-success mb-0" id="statPelangganAktif" style="font-size: 2rem;">0 Orang</h2>
          </div>
          <div class="bg-success bg-opacity-10 p-3 rounded-4 text-success"><i class="fa-solid fa-users fa-3xl"></i></div>
        </div>
      </div>
    </div>

    <div class="row g-3 justify-content-between align-items-center mb-4 bg-white p-3 rounded-4 shadow-sm border mx-0">
      <div class="col-md-6 col-12">
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 px-3"><i class="fa-solid fa-magnifying-glass text-muted fs-5"></i></span>
          <input type="text" id="inputCari" class="form-control bg-light border-start-0 input-jumbo" placeholder="Ketik nama atau alamat pelanggan untuk mencari..." oninput="filterTabelPelanggan()">
        </div>
      </div>
      <div class="col-md-4 col-12 text-end">
        <button class="btn btn-primary w-100 btn-jumbo" onclick="bukaModalForm()">
          <i class="fa-solid fa-user-plus me-2"></i> Tambah Pelanggan Baru
        </button>
      </div>
    </div>

    <div class="table-container">
      <h5 class="fw-bold text-secondary mb-3"><i class="fa-solid fa-users-viewfinder me-2"></i> Daftar Manajemen Cicilan</h5>
      <div class="table-responsive">
        <table class="table table-hover align-middle table-borderless border-top border-light">
          <thead class="table-light text-uppercase text-muted" style="font-size: 0.85rem; letter-spacing: 0.5px;">
            <tr>
              <th style="padding: 15px;">Nama Pelanggan</th>
              <th>Alamat</th>
              <th>Nama Barang</th>
              <th>Total Harga</th>
              <th>Tenor</th>
              <th class="text-center">Cicilan Ke</th>
              <th>Sisa Utang</th>
              <th>Status</th>
              <th class="text-center" style="width: 280px;">Aksi / Menu Utama</th>
            </tr>
          </thead>
          <tbody id="tabelPelanggan" class="fw-semibold"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modalForm" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4">
        <div class="modal-header border-bottom-0 pt-4 px-4">
          <h4 class="modal-title fw-bold text-secondary" id="modalFormTitle">Form Pelanggan</h4>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="formPelanggan" onsubmit="prosesSimpanData(event)">
          <div class="modal-body px-4">
            <input type="hidden" id="formRowNum">
            <div class="mb-3"><label class="form-label fw-bold small text-muted">Nama Lengkap</label><input type="text" id="formNama" class="form-control form-control-lg rounded-3" required></div>
            <div class="mb-3"><label class="form-label fw-bold small text-muted">Alamat Rumah</label><input type="text" id="formAlamat" class="form-control form-control-lg rounded-3" required></div>
            <div class="mb-3"><label class="form-label fw-bold small text-muted">Barang Kredit</label><input type="text" id="formBarang" class="form-control form-control-lg rounded-3" required></div>
            <div class="row">
              <div class="col-6 mb-3"><label class="form-label fw-bold small text-muted">Total Harga (Rp)</label><input type="number" id="formTotalHarga" class="form-control form-control-lg rounded-3" required oninput="sinkronSisaUtang()"></div>
              <div class="col-6 mb-3"><label class="form-label fw-bold small text-muted">Sisa Utang (Rp)</label><input type="number" id="formSisaUtang" class="form-control form-control-lg rounded-3" required></div>
            </div>
            <div class="row">
              <div class="col-6 mb-3">
                <label class="form-label fw-bold small text-muted">Metode Tenor</label>
                <select id="formTipeTenor" class="form-select form-select-lg rounded-3"><option value="Bulanan">Bulanan</option><option value="Mingguan">Mingguan</option><option value="Harian">Harian</option></select>
              </div>
              <div class="col-6 mb-3"><label class="form-label fw-bold small text-muted">Tenor (Jumlah Kali)</label><input type="number" id="formTenor" class="form-control form-control-lg rounded-3" required></div>
            </div>
          </div>
          <div class="modal-footer border-top-0 pb-4 px-4"><button type="button" class="btn btn-light btn-lg rounded-3 px-4" data-bs-dismiss="modal">Batal</button><button type="submit" class="btn btn-primary btn-lg rounded-3 px-5">Simpan Data</button></div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modalBayar" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm modal-dialog-centered">
      <div class="modal-content rounded-4">
        <div class="modal-header border-bottom-0 pt-4 px-4"><h4 class="modal-title fw-bold text-secondary">Bayar Cicilan</h4><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <form id="formBayar" onsubmit="prosesBayarManual(event)">
          <div class="modal-body px-4">
            <input type="hidden" id="bayarRowNum">
            <div class="mb-3"><label class="form-label small text-muted fw-bold d-block mb-0">Nama Pelanggan</label><input type="text" id="bayarNama" class="form-control-plaintext fw-bold text-primary fs-5 p-0" readonly></div>
            <div class="mb-3"><label class="form-label fw-bold small text-muted">Nominal Pembayaran (Rp)</label><input type="number" id="bayarNominal" class="form-control form-control-lg rounded-3 text-success fw-bold" required placeholder="0"></div>
          </div>
          <div class="modal-footer border-top-0 pb-4 px-4"><button type="button" class="btn btn-light rounded-3" data-bs-dismiss="modal">Batal</button><button type="submit" class="btn btn-success px-4 rounded-3 fw-bold">Konfirmasi Bayar</button></div>
        </form>
      </div>
    </div>
  </div>

  <div id="areaStruk"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzeWIBiIVGYMmLNi-OLD2TkhbX1ab1LDpY4uMTjEGEojHRjtiu1ElqO72bnZWYHoug/exec";

    let listPelanggan = [];
    const bootstrapModalForm = new bootstrap.Modal(document.getElementById('modalForm'));
    const bootstrapModalBayar = new bootstrap.Modal(document.getElementById('modalBayar'));

    document.addEventListener("DOMContentLoaded", muatDataDashboard);

    function tunjukkanLoading(show) { document.getElementById('loading').style.display = show ? 'flex' : 'none'; }
    function formatRupiah(angka) { return "Rp " + Number(angka).toLocaleString('id-ID'); }
    function sinkronSisaUtang() { if(!document.getElementById('formRowNum').value) document.getElementById('formSisaUtang').value = document.getElementById('formTotalHarga').value; }

    function muatDataDashboard() {
      tunjukkanLoading(true);
      fetch(`${API_URL}?action=ambilData`)
        .then(res => res.json())
        .then(res => {
          tunjukkanLoading(false);
          if (res.error) return Swal.fire("Error", res.error, "error");
          
          listPelanggan = res.pelanggan || [];
          document.getElementById('statTotalPiutang').innerText = formatRupiah(res.stats.totalPiutang);
          document.getElementById('statPelangganAktif').innerText = res.stats.aktif + " Orang";
          
          buatTabel(listPelanggan);
        }).catch(err => { tunjukkanLoading(false); Swal.fire("Error", "Gagal menyambung ke database.", "error"); });
    }

    function buatTabel(dataArray) {
      const tbody = document.getElementById('tabelPelanggan');
      tbody.innerHTML = dataArray.length === 0 ? '<tr><td colspan="9" class="text-center text-muted py-4 fs-5">Tidak ada data pelanggan ditemukan.</td></tr>' : '';
      
      dataArray.forEach(p => {
        const tr = document.createElement('tr');
        tr.style.borderBottom = "1px solid #f1f1f1";
        tr.innerHTML = `
          <td style="padding: 16px 10px;" class="text-dark fw-bold">${p.nama}</td>
          <td><span class="text-muted small">${p.alamat}</span></td>
          <td><span class="badge bg-light text-dark border p-2">${p.barang}</span></td>
          <td class="text-secondary">${formatRupiah(p.total)}</td>
          <td><small class="text-muted">${p.tenor}x (${p.tipe})</small></td>
          <td class="text-center fs-5 text-primary fw-bold">${p.cicilanKe}</td>
          <td class="fw-bold text-danger fs-5">${formatRupiah(p.sisa)}</td>
          <td><span class="badge-status ${p.status === 'AKTIF' ? 'badge-aktif' : 'badge-lunas'}">${p.status}</span></td>
          <td class="text-center">
            <button class="btn-aksi btn-success text-white" ${p.status !== 'AKTIF'?'disabled':''} onclick="bukaModalBayar(${p.rowNum}, '${p.nama}')"><i class="fa-solid fa-hand-holding-dollar"></i> Bayar</button>
            <button class="btn-aksi btn-secondary text-white" onclick="cetakUlangStruk(${p.rowNum})"><i class="fa-solid fa-print"></i> Print</button>
            <button class="btn-aksi btn-warning text-dark" onclick="bukaModalForm(${p.rowNum})"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
            <button class="btn-aksi btn-danger text-white" onclick="prosesHapusData(${p.rowNum})"><i class="fa-solid fa-trash"></i> Hapus</button>
          </td>`;
        tbody.appendChild(tr);
      });
    }

    function filterTabelPelanggan() {
      const input = document.getElementById('inputCari');
      if (!input) return;
      const kataKunci = input.value.toLowerCase().trim();
      
      const hasilFilter = listPelanggan.filter(p => 
        (p.nama && p.nama.toLowerCase().includes(kataKunci)) || 
        (p.alamat && p.alamat.toLowerCase().includes(kataKunci))
      );
      buatTabel(hasilFilter);
    }

    function bukaModalForm(rowNum = null) {
      document.getElementById('formPelanggan').reset();
      document.getElementById('formRowNum').value = rowNum || '';
      document.getElementById('modalFormTitle').innerText = rowNum ? "⚙️ Edit Pelanggan" : "👤 Tambah Pelanggan";
      if(rowNum) {
        const p = listPelanggan.find(i => i.rowNum === rowNum);
        if(p) {
          document.getElementById('formNama').value = p.nama; document.getElementById('formAlamat').value = p.alamat;
          document.getElementById('formBarang').value = p.barang; document.getElementById('formTotalHarga').value = p.total;
          document.getElementById('formSisaUtang').value = p.sisa; document.getElementById('formTipeTenor').value = p.tipe;
          document.getElementById('formTenor').value = p.tenor;
        }
      }
      bootstrapModalForm.show();
    }

    function prosesSimpanData(e) {
      e.preventDefault();
      const payload = {
        action: "simpanData",
        data: {
          rowNum: document.getElementById('formRowNum').value, nama: document.getElementById('formNama').value,
          alamat: document.getElementById('formAlamat').value, barang: document.getElementById('formBarang').value,
          totalHarga: document.getElementById('formTotalHarga').value, sisaUtang: document.getElementById('formSisaUtang').value,
          tipeTenor: document.getElementById('formTipeTenor').value, tenor: document.getElementById('formTenor').value
        }
      };
      bootstrapModalForm.hide(); tunjukkanLoading(true);
      irimKeApi(payload);
    }

    function bukaModalBayar(rowNum, nama) {
      document.getElementById('formBayar').reset();
      document.getElementById('bayarRowNum').value = rowNum;
      document.getElementById('bayarNama').value = nama;
      bootstrapModalBayar.show();
    }

    function prosesBayarManual(e) {
      e.preventDefault();
      const payload = {
        action: "bayarManual",
        rowNum: document.getElementById('bayarRowNum').value,
        nominal: document.getElementById('bayarNominal').value
      };
      bootstrapModalBayar.hide(); tunjukkanLoading(true);
      
      fetch(API_URL, { method: "POST", body: JSON.stringify(payload) })
        .then(res => res.json())
        .then(res => {
          if(res.error) { tunjukkanLoading(false); return Swal.fire("Gagal", res.error, "error"); }
          tunjukkanLoading(false);
          
          pemicuKertasThermal(res.hasilBayar.tgl, res.hasilBayar.nama, res.hasilBayar.barang, res.hasilBayar.nominal, res.hasilBayar.sisa);
          muatDataDashboard();
        }).catch(() => { tunjukkanLoading(false); Swal.fire("Error", "Gagal memproses transaksi.", "error"); });
    }

    function cetakUlangStruk(rowNum) {
      const p = listPelanggan.find(i => i.rowNum === rowNum);
      if (p) {
        let opsi = { year: '2-digit', month: 'numeric', day: 'numeric' };
        let tglSkg = new Date().toLocaleDateString('id-ID', opsi);
        pemicuKertasThermal(tglSkg, p.nama, p.barang, 0, p.sisa);
      }
    }

    function pemicuKertasThermal(tgl, nama, barang, nominal, sisa) {
      const _nominalDisplay = nominal > 0 ? formatRupiah(nominal) : "- (Cetak Ulang)";
      const strukDiv = document.getElementById('areaStruk');
      strukDiv.innerHTML = `
        <div class="text-center">
          <b>SLIP PEMBAYARAN</b><br>
          <b>KIKI KREDIT SOLUTION</b>
          <div class="line-double"></div>
        </div>
        <div class="struk-row"><span>Tgl:</span><span class="struk-val">${tgl}</span></div>
        <div class="struk-row"><span>Nama:</span><span class="struk-val">${nama}</span></div>
        <div class="struk-row"><span>Barang:</span><span class="struk-val">${barang}</span></div>
        <div class="line-dash"></div>
        <div class="struk-row"><span>BAYAR:</span><span class="struk-val">${_nominalDisplay}</span></div>
        <div class="struk-row"><span>SISA UTANG:</span><span class="struk-val">${formatRupiah(sisa)}</span></div>
        <div class="line-dash"></div>
        <div class="text-center" style="margin-top: 3mm; font-size: 8pt; font-style: italic;">
          *** Terima Kasih ***<br>Bukti Pembayaran Sah.
        </div>
      `;
      window.print();
    }

    function prosesHapusData(rowNum) {
      Swal.fire({ title: "Hapus data ini?", text: "Data pelanggan akan dihapus permanen dari sistem!", icon: "warning", showCancelButton: true, confirmButtonColor: "#d33", confirmButtonText: "Ya, Hapus Terus!" }).then((result) => {
        if (result.isConfirmed) {
          tunjukkanLoading(true);
          irimKeApi({ action: "hapusData", rowNum: rowNum });
        }
      });
    }

    function irimKeApi(payload) {
      fetch(API_URL, { method: "POST", body: JSON.stringify(payload) })
        .then(res => res.json())
        .then(pesan => { tunjukkanLoading(false); Swal.fire("Berhasil", typeof pesan === 'string' ? pesan : "Selesai!", "success"); muatDataDashboard(); })
        .catch(() => { tunjukkanLoading(false); Swal.fire("Error", "Gagal mengirim data ke server.", "error"); });
    }
  </script>
</body>
</html>
